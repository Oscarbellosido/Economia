<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economia Mundial — explicada fàcil</title>
<meta name="description" content="Deute, inflació, sous, tipus d'interès i creixement dels principals països del món, explicats de manera senzilla. Dades de l'FMI, l'OCDE i el BIS.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1b2d">
<!-- Política de seguretat de contingut: l'app llegeix dades.json del mateix servidor i, a la pestanya
     d'immigració, l'última dada de cada municipi de l'Idescat.
     Tota la interactivitat va amb onclick en línia, per això cal 'unsafe-inline' als scripts. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self' https://api.idescat.cat;
  font-src 'self';
  manifest-src 'self';
  worker-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'none';
  frame-src 'none'">
<style>
/* ── Variables ──────────────────────────────────────────────────────────────── */
:root {
  color-scheme: dark;
  --bg: #0c1626;
  --bg-2: #111f33;
  --card: #15263d;
  --card-2: #1a2e48;
  --text: #eef3f8;
  --text-2: #a9b8c9;
  --muted: #7d8ea3;
  --border: rgba(148,178,214,0.16);
  --grid: rgba(148,178,214,0.12);
  --accent: #3987e5;
  --shadow: rgba(0,0,0,0.35);
  --neg: #e66767;
  --pos: #3987e5;
  --mid: #383835;
  --good: #3fb97a;
  --warn: #e0a526;
  --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #2f9e2f; --s7: #9085e9; --s8: #e66767;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9;
  --bg-2: #ffffff;
  --card: #ffffff;
  --card-2: #f2f5f9;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #74736e;
  --border: rgba(20,40,70,0.12);
  --grid: rgba(20,40,70,0.09);
  --accent: #2a78d6;
  --shadow: rgba(20,40,70,0.08);
  --neg: #e34948;
  --pos: #2a78d6;
  --mid: #f0efec;
  --good: #1d8a4f;
  --warn: #b77900;
  --bad: #d23b3a;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}

/* ── Base ───────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; margin-bottom: 6px; }
h3 { font-size: 1.02rem; margin-bottom: 4px; }
p { margin: 0 0 10px; }
.sub { color: var(--text-2); }
.muted { color: var(--muted); font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* ── Capçalera i pestanyes ─────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.top { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; }
.top h1 { font-size: 1.15rem; flex: 1; }
.top h1 span { color: var(--muted); font-weight: 500; font-size: .9rem; }
.iconbtn {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  width: 38px; height: 38px; cursor: pointer; font-size: 1.05rem;
}
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  flex: none; border: 1px solid transparent; background: none; cursor: pointer;
  padding: 7px 12px; border-radius: 999px; color: var(--text-2); white-space: nowrap;
}
nav.tabs button:hover { background: var(--card); }
nav.tabs button.on { background: var(--accent); color: #fff; }

main { padding: 18px 0 40px; }
section.view { display: none; }
section.view.on { display: block; }

/* ── Targetes ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px var(--shadow);
}
.card > h3 + .sub { margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.intro { margin-bottom: 16px; }
.intro p { max-width: 70ch; }

/* Xifres destacades */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.tile .k { color: var(--text-2); font-size: .82rem; }
.tile .v { font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0; }
.tile .d { color: var(--muted); font-size: .8rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge.good { color: var(--good); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }

/* Explicacions */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin: 10px 0 4px; }
.flow .step { flex: 1 1 150px; background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.flow .step b { display: block; margin-bottom: 2px; }
.flow .arr { align-self: center; color: var(--muted); font-size: 1.2rem; }
.concept .emo { font-size: 1.6rem; }
details.glos { border-top: 1px solid var(--border); padding: 10px 0; }
details.glos summary { cursor: pointer; font-weight: 600; }
details.glos p { margin: 6px 0 0; color: var(--text-2); }
.callout { border-left: 3px solid var(--accent); background: var(--card-2); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 10px 0; }

/* ── Controls ───────────────────────────────────────────────────────────────── */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card-2); border-radius: 999px;
  padding: 4px 10px; font-size: .85rem; color: var(--text-2);
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip.on { color: var(--text); border-color: currentColor; background: var(--card); }
.chip.on .dot { box-shadow: 0 0 0 2px var(--card); }
select, input[type=number] {
  background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
}
.more { font-size: .85rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px; }

/* ── Gràfics ────────────────────────────────────────────────────────────────── */
.chart { position: relative; width: 100%; min-height: 120px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .lbl { fill: var(--text-2); font-size: 12px; font-weight: 600; }
.chart .grid line { stroke: var(--grid); }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .fc { fill: var(--text); opacity: .045; }
.chart .hl { stroke: var(--muted); stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--text-2); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px) !important; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 150px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px; font-size: .8rem; box-shadow: 0 6px 20px var(--shadow); display: none;
}
.tip .t { font-weight: 650; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .r span:first-child { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; }

/* Barres horitzontals */
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 70px; align-items: center; gap: 10px; font-size: .86rem; padding: 2px 4px; border-radius: 6px; }
.bar:hover { background: var(--card-2); }
.bar.me { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.bar .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .track { position: relative; height: 16px; }
.bar .fill { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; }
.bar .axis0 { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; }
.bar.pair { grid-template-columns: minmax(100px, 150px) 1fr 58px; }
.bar.pair .dbl { display: grid; gap: 3px; }
.bar.pair .track { height: 11px; }
.bar.pair .val { display: grid; line-height: 1.15; font-size: .8rem; }
.bar .ref { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--text-2); }

/* Taula */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card); }
th.on { color: var(--text); }
tr.grp td { color: var(--text-2); font-style: italic; }
td.hi { color: var(--bad); font-weight: 600; }
td.lo { color: var(--good); font-weight: 600; }

/* Resum: semàfor, fitxes i escenaris */
.sem { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 12px; }
.semi { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--card-2);
  border-left: 4px solid var(--muted); color: inherit; text-decoration: none; }
.semi:hover { background: color-mix(in srgb, var(--accent) 8%, var(--card-2)); }
.semi.good { border-left-color: var(--good); } .semi.warn { border-left-color: var(--warn); } .semi.bad { border-left-color: var(--bad); }
.semi .semt { font-size: .95rem; }
.semi .semv { font-size: .78rem; color: var(--accent); margin-top: auto; }
.fitxes { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.fitxa { margin: 0; background: var(--card-2); box-shadow: none; }
.fitxa .mini { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .84rem; color: var(--text-2); margin: 6px 0 8px; }
.fitxa .mini b { color: var(--text); }
.esc { padding: 12px 14px; border-radius: 12px; background: var(--card-2); border-top: 3px solid var(--muted); }
.esc.good { border-top-color: var(--good); } .esc.warn { border-top-color: var(--warn); } .esc.bad { border-top-color: var(--bad); }

/* Calculadora */
.calc { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.calc .res { font-size: 1.6rem; font-weight: 650; }

footer { border-top: 1px solid var(--border); padding: 20px 0 40px; color: var(--muted); font-size: .82rem; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

@media (max-width: 560px) {
  body { font-size: 14px; }
  .card { padding: 14px; border-radius: 14px; }
  .tile .v { font-size: 1.55rem; }
  .bar { grid-template-columns: 105px 1fr 58px; gap: 6px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar .fill { transition: width .35s ease, left .35s ease; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>🌍 Economia Mundial <span>explicada fàcil</span></h1>
      <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="Canvia el tema" aria-label="Canvia el tema">🌓</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Seccions">
      <button data-v="resum" onclick="go('resum')">🧭 Resum</button>

<main class="wrap" id="app">
  <div class="loading" id="loading">Carregant dades…</div>

  <!-- ── Resum ── -->
  <section class="view" id="v-resum"></section>
  <!-- ── Inici ── -->

  <div class="wrap">
    <p id="fonts"></p>
    <p>Els anys ombrejats als gràfics són <b>previsions</b> de l'FMI, no dades reals. Les xifres de l'FMI es revisen dues vegades l'any (abril i octubre).
    Aquesta app no desa res a cap servidor.</p>
    <p>Versió <span id="ver"></span></p>
  </div>
</footer>

<script>
/* ── Configuració ───────────────────────────────────────────────────────────── */
const APP_VERSION = '1.6.1';
const BUILD_DATE = '2026-09-16';
const LS_THEME = 'economia_theme';
const LS_SEL = 'economia_sel';
const LS_BANKS = 'economia_banks';
const LS_PAIS = 'economia_pais';
const LS_DATA = 'economia_dades_v1';
const MAX_SEL = 6;
const DEFAULT_SEL = ['ESP', 'USA', 'DEU', 'CHN', 'JPN'];
const DEFAULT_BANKS = ['XM', 'US', 'GB', 'JP', 'CH'];
const SLOTS = 8;

// Nom dels bancs centrals (codis del BIS)
const BANKS = {
  XM: 'BCE (zona euro)', US: 'Reserva Federal (EUA)', GB: 'Banc d\'Anglaterra', JP: 'Banc del Japó',
  CH: 'Banc Nacional Suís', CN: 'Banc Popular de la Xina', CA: 'Banc del Canadà', AU: 'Banc de la Reserva d\'Austràlia',
  IN: 'Banc de la Reserva de l\'Índia', BR: 'Banc Central del Brasil', MX: 'Banc de Mèxic', KR: 'Banc de Corea',
  SE: 'Riksbank (Suècia)', NO: 'Norges Bank', PL: 'Banc Nacional de Polònia', TR: 'Banc Central de Turquia',
  RU: 'Banc de Rússia', ZA: 'Banc de la Reserva de Sud-àfrica', ID: 'Banc d\'Indonèsia', SA: 'Banc Central Saudita',
  AR: 'Banc Central de l\'Argentina',
};
// País o grup que fa servir cada banc central (per comparar-ne la inflació)
const BANK_INFL = { XM: 'EURO', US: 'USA', GB: 'GBR', JP: 'JPN', CH: 'CHE', CN: 'CHN', CA: 'CAN', AU: 'AUS', IN: 'IND',
  BR: 'BRA', MX: 'MEX', KR: 'KOR', SE: 'SWE', NO: 'NOR', PL: 'POL', TR: 'TUR', RU: 'RUS', ZA: 'ZAF', ID: 'IDN', SA: 'SAU', AR: 'ARG' };

/* ── Helpers ────────────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? '–' : v.toLocaleString('ca-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? '–' : nf(v, d) + ' %';
const sgn = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + nf(v, d);
const money = v => v == null ? '–' : v >= 1000 ? nf(v / 1000, v >= 10000 ? 0 : 1) + ' bil. $' : nf(v, 0) + ' mil M $';
const int = v => v == null ? '–' : Math.round(v).toLocaleString('ca-ES');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lsGet = (k, def) => { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let D = null;          // dades.json
let Y = 2026;          // any "actual" (el de la descàrrega): a partir d'aquí són previsions
let view = 'inici';

const ent = c => D.paisos[c] || D.grups[c];
const isGroup = c => !!D.grups[c];
const val = (c, k, y) => ent(c)?.s[k]?.[y];
const pts = (c, k, from = 0, to = 9999) => Object.entries(ent(c)?.s[k] || {}).map(([a, v]) => [+a, v]).filter(([a]) => a >= from && a <= to);
const lastYear = (c, k, max = 9999) => { const ys = Object.keys(ent(c)?.s[k] || {}).map(Number).filter(a => a <= max); return ys.length ? Math.max(...ys) : null; };
const label = c => { const e = ent(c); return e ? `${e.flag} ${e.nom}` : c; };
const countries = () => Object.keys(D.paisos).sort((a, b) => (val(b, 'pib', Y) || 0) - (val(a, 'pib', Y) || 0));

// Preus acumulats: quant pugen els preus entre la mitjana de l'any a0 i la de l'any a1
function cumInfl(c, a0, a1) {
  let f = 1;
  for (let a = a0 + 1; a <= a1; a++) { const i = val(c, 'infl', a); if (i == null) return null; f *= 1 + i / 100; }
  return (f - 1) * 100;
}

/* ── Tema ───────────────────────────────────────────────────────────────────── */
function applyTheme(t) {
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#f4f6f9' : '#0c1626';
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  lsSet(LS_THEME, t); applyTheme(t); renderView();
}
applyTheme(lsGet(LS_THEME, null));
// si l'usuari no ha triat tema, segueix el del sistema també quan canvia
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!lsGet(LS_THEME, null)) { applyTheme(null); renderView(); } });

/* ── Selecció de països (colors fixos per país mentre estigui seleccionat) ─── */
let sel = lsGet(LS_SEL, DEFAULT_SEL);
let colorOf = lsGet(LS_SEL + '_c', {});
function fixColors(list, map) {
  for (const k of Object.keys(map)) if (!list.includes(k)) delete map[k];
  for (const k of list) if (map[k] == null) {
    const used = new Set(Object.values(map));
    map[k] = [...Array(SLOTS).keys()].find(i => !used.has(i)) ?? 0;
  }
  return map;
}
fixColors(sel, colorOf);
const col = (c, map = colorOf) => `var(--s${(map[c] ?? 0) + 1})`;

/* ── Gràfic de línies (SVG propi, sense llibreries) ───────────────────────── */
function niceTicks(min, max, n = 5) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const t = [];
  for (let v = Math.floor(min / step) * step; v <= max + step * 0.001; v += step) t.push(+v.toFixed(10));
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + step);
  return t;
}
const monthX = s => +s.slice(0, 4) + (+s.slice(5, 7) - 1) / 12;
const MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
const monthLabel = x => { const y = Math.floor(x + 1e-6); return `${MESOS[Math.round((x - y) * 12)]} ${y}`; };

/**
 * o.series: [{name, color, pts:[[x,y]], dash}]
 * o.fmt: format dels valors · o.forecast: primer any de previsió · o.zero: inclou el 0
 * o.months: l'eix x són mesos (x decimal) · o.h: alçada
 */
function lineChart(host, o) {
  const W = Math.max(280, host.clientWidth || 600), H = o.h || (W < 500 ? 240 : 300);
  const narrow = W < 500;
  const labelsOn = o.series.length <= 4 && !narrow;
  const m = { t: 14, r: labelsOn ? 118 : 14, b: 26, l: 46 };
  const all = o.series.flatMap(s => s.pts);
  if (!all.length) { host.innerHTML = '<p class="muted">No hi ha dades per a aquesta selecció.</p>'; return; }
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (o.zero !== false) { y0 = Math.min(0, y0); y1 = Math.max(0, y1); }
  const yt = niceTicks(y0, y1, narrow ? 4 : 5);
  y0 = yt[0]; y1 = yt[yt.length - 1];
  const X = x => m.l + (x - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
  const Yp = y => m.t + (1 - (y - y0) / (y1 - y0 || 1)) * (H - m.t - m.b);
  const fmt = o.fmt || (v => nf(v));

  // eix x: anys rodons
  const span = x1 - x0, every = span > 24 ? 5 : span > 10 ? (narrow ? 5 : 2) : 1;
  const xt = [];
  for (let a = Math.ceil(x0); a <= Math.floor(x1); a++) if (a % every === 0) xt.push(a);

  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.title || 'Gràfic')}">`;
  if (o.forecast != null && o.forecast <= x1) {
    const fx = X(Math.max(x0, o.forecast - 0.5));
    s += `<rect class="fc" x="${fx}" y="${m.t}" width="${X(x1) - fx}" height="${H - m.t - m.b}"/>
      <text x="${fx + 4}" y="${m.t + 11}">previsió</text>`;
  }
  s += `<g class="grid">${yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Yp(v)}" y2="${Yp(v)}"/>`).join('')}</g>`;
  s += yt.map(v => `<text x="${m.l - 6}" y="${Yp(v) + 4}" text-anchor="end">${esc(o.tick ? o.tick(v) : nf(v, Math.abs(v) < 10 && v % 1 ? 1 : 0))}</text>`).join('');
  s += xt.map(a => `<text x="${X(a)}" y="${H - 6}" text-anchor="middle">${a}</text>`).join('');
  if (y0 < 0 && y1 > 0) s += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Yp(0)}" y2="${Yp(0)}"/>`;
  if (o.ref) s += `<line class="hl" x1="${m.l}" x2="${W - m.r}" y1="${Yp(o.ref.y)}" y2="${Yp(o.ref.y)}"/><text x="${m.l + 4}" y="${Yp(o.ref.y) - 4}">${esc(o.ref.label)}</text>`;

  for (const se of o.series) {
    if (!se.pts.length) continue;
    const d = se.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Yp(p[1]).toFixed(1)}`).join('');
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
  }
  // etiquetes directes al final de cada línia, separades perquè no se solapin
  if (labelsOn) {
    const ends = o.series.filter(se => se.pts.length).map(se => { const p = se.pts[se.pts.length - 1]; return { se, x: X(p[0]), y: Yp(p[1]) }; }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    for (const e of ends) s += `<text class="lbl" x="${e.x + 8}" y="${e.y + 4}">${esc(e.se.short || e.se.name)}</text>`;
  }
  s += `<line class="hl" id="hl" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" style="display:none"/>`;
  s += `<g id="dots"></g><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" class="hit"/></svg>`;

  const leg = o.series.length > 1 ? `<div class="legend">${o.series.map(se => `<span><i class="${se.dash ? 'dash' : ''}" style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>` : '';
  host.innerHTML = s + leg + '<div class="tip"></div>';

  // capa d'interacció: línia vertical + tooltip amb tots els valors d'aquell punt
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), hl = svg.querySelector('#hl'), dots = svg.querySelector('#dots');
  const xs = [...new Set(all.map(p => p[0]))].sort((a, b) => a - b);
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * W / r.width;
    const xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    let best = xs[0];
    for (const x of xs) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x;
    const rows = o.series.map(se => ({ se, p: se.pts.find(p => Math.abs(p[0] - best) < 1e-6) })).filter(r => r.p).sort((a, b) => b.p[1] - a.p[1]);
    if (!rows.length) return;
    hl.setAttribute('x1', X(best)); hl.setAttribute('x2', X(best)); hl.style.display = '';
    dots.innerHTML = rows.map(r => `<circle cx="${X(best)}" cy="${Yp(r.p[1])}" r="4.5" fill="${r.se.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
    const title = o.months ? monthLabel(best) : best + (o.forecast != null && best >= o.forecast ? ' · previsió' : '');
    tip.innerHTML = `<div class="t">${esc(title)}</div>` + rows.map(r => `<div class="r"><span><i class="sw" style="background:${r.se.color}"></i>${esc(r.se.name)}</span><b class="num">${esc(fmt(r.p[1]))}</b></div>`).join('');
    tip.style.display = 'block';
    const hx = X(best) * r.width / W;
    const left = hx + 14 + tip.offsetWidth > host.clientWidth ? hx - 14 - tip.offsetWidth : hx + 14;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '8px';
  };
  const out = () => { tip.style.display = 'none'; hl.style.display = 'none'; dots.innerHTML = ''; };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', out);
}

/* ── Barres horitzontals (HTML) ─────────────────────────────────────────────── */
// rows: [{c, name, v, color}] · o.fmt · o.me: codi a ressaltar · o.ref: {v, label}
function barsHTML(rows, o = {}) {
  rows = rows.filter(r => r.v != null);
  if (!rows.length) return '<p class="muted">Sense dades.</p>';
  const lo = Math.min(0, ...rows.map(r => r.v)), hi = Math.max(0, ...rows.map(r => r.v), o.ref?.v ?? 0);
  const P = v => (v - lo) / (hi - lo || 1) * 100;
  const fmt = o.fmt || (v => nf(v));
  return `<div class="bars">${rows.map(r => {
    const a = P(Math.min(0, r.v)), b = P(Math.max(0, r.v));
    const color = r.color || (r.v < 0 ? 'var(--neg)' : 'var(--pos)');
    return `<div class="bar ${r.c === o.me ? 'me' : ''}" title="${esc(r.name)}: ${esc(fmt(r.v))}">
      <span class="n">${esc(r.name)}</span>
      <span class="track">${lo < 0 ? `<span class="axis0" style="left:${P(0)}%"></span>` : ''}
        <span class="fill" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;background:${color}"></span>
        ${o.ref ? `<span class="ref" style="left:${P(o.ref.v)}%"></span>` : ''}</span>
      <span class="val">${esc(fmt(r.v))}</span></div>`;
  }).join('')}</div>${o.ref ? `<p class="muted" style="margin-top:6px">┆ La línia discontínua és ${esc(o.ref.label)}.</p>` : ''}`;
}

function fitxaPais(c, nom) {

  if (de != null && deF != null && deF - de >= 5) avis.push(`el deute seguirà pujant (${pct(deF, 0)} el ${Y + 5})`);
  if (de != null && deF != null && de - deF >= 5) avis.push(`el deute baixarà (${pct(deF, 0)} el ${Y + 5})`);
  if (it != null && it >= 3) avis.push('els interessos ja pesen molt');
  if (inf != null && inf < 1.5) avis.push('preus gairebé plans');
  const e = (it != null && it >= 3) || (de != null && deF != null && deF - de >= 10) ? 'bad' : (cr != null && cr < 1.5) || (de || 0) >= 100 ? 'warn' : 'good';

    </div>
    ${avis.length ? `<p class="sub"><b>${esc(avis[0][0].toUpperCase() + avis[0].slice(1))}</b>${avis.slice(1).map(a => ', ' + esc(a)).join('')}.</p>` : ''}

}

function renderResum() {
  const E = 'ESP', W = 'WEOWORLD';
  const v = k => val(E, k, Y);
  const cr = v('creix'), cr1 = val(E, 'creix', Y + 1), crEu = val('EURO', 'creix', Y);
  const at = v('atur'), atEu = val('EURO', 'atur', Y);
  const inf = v('infl'), preus = cumInfl(E, 2020, Y);
  const de = v('deute'), deF = val(E, 'deute', Y + 5);
  const it = interessos(E, Y), it21 = interessos(E, 2021);
  const A0 = 2019; // abans de la pandèmia: el 2020 el PIB es va enfonsar i qualsevol comparació hi surt inflada
  const pobA = val(E, 'pob', A0), pobB = v('pob');
  const creixAcum = acum(E, 'creix', A0, Y);
  const perCap = creixAcum != null && pobA && pobB ? ((1 + creixAcum / 100) / (pobB / pobA) - 1) * 100 : null;
  // habitatge vs sous (reals) des del 2015
  const H = D.altra?.habitatge?.[E]?.anual, SR = ent(E).s.souReal;
  const aH = H && SR ? Math.min(Math.max(...Object.keys(H).map(Number)), lastYear(E, 'souReal')) : null;
  const pis = aH ? (H[aH] / H[2015] - 1) * 100 : null, sou = aH ? (SR[aH] / SR[2015] - 1) * 100 : null;
  const esforc = pis != null ? ((1 + pis / 100) / (1 + sou / 100) - 1) * 100 : null;
  // impostos
  const T = D.fiscal?.impostos?.[E];
  const aT = T?.irpf ? Math.max(...Object.keys(T.irpf).map(Number)) : null;
  const irpfPuja = aT && T.irpf[2020] != null ? T.irpf[aT] - T.irpf[2020] : null;
  let netReal = null, brutReal = null;
  if (T?.net?.[2000] && T?.brut?.[2000] && aT) { const f = 1 + (cumInfl(E, 2000, aT) || 0) / 100; netReal = (T.net[aT] / T.net[2000] / f - 1) * 100; brutReal = (T.brut[aT] / T.brut[2000] / f - 1) * 100; }
  // deute: prima
  const de10 = D.fiscal?.bons?.DEU, es10 = D.fiscal?.bons?.ESP;
  const mesP = es10 && de10 ? Object.keys(es10).filter(k => de10[k] != null).sort().at(-1) : null;
  const prima = mesP ? (es10[mesP] - de10[mesP]) * 100 : null;
  // immigració
  const IM = D.immi?.eu?.ESP || {};
  const lastK = k => { const s = IM[k]; if (!s) return null; const a = Math.max(...Object.keys(s).map(Number)); return [a, s[a]]; };
  const fora = lastK('nascutsFora'), pobF = fora ? IM.pob?.[fora[0]] : null;
  const ord = lastK('ordres'), ret = ord ? IM.retorns?.[ord[0]] : null;
  const mig = lastK('migNeta');

  const semEsp = [
    { t: 'Creixement', link: 'creixement', e: cr >= 1.5 ? 'good' : cr >= 0.5 ? 'warn' : 'bad',
      txt: `Creix un ${pct(cr)} el ${Y} i un ${pct(cr1)} el ${Y + 1}, més que la zona euro (${pct(crEu)}). L'FMI no preveu cap recessió.` },
    { t: 'Creixement per habitant', link: 'creixement', e: perCap == null ? 'warn' : perCap >= (Y - A0) * 1.5 ? 'good' : perCap >= (Y - A0) * 0.5 ? 'warn' : 'bad',
      txt: perCap == null ? 'Sense dades.' : `Del ${A0} (abans de la pandèmia) al ${Y}, el PIB real creix un ${pct(creixAcum, 1)}, però la població també (+${nf(pobB - pobA, 1)} milions). Per habitant, un ${pct(perCap, 1)}: menys d'un ${nf(Math.ceil(perCap / (Y - A0)), 0)} % l'any.` },
    { t: 'Atur', link: 'creixement', e: at < 7 ? 'good' : at < 12 ? 'warn' : 'bad',
      txt: `${pct(at)} el ${Y}. Baixa, però continua sent dels més alts d'Europa (zona euro: ${pct(atEu)}).` },
    { t: 'Preus', link: 'inflacio', e: inf <= 2.5 && preus < 15 ? 'good' : inf <= 4 ? 'warn' : 'bad',
      txt: `Inflació del ${pct(inf)} el ${Y}, per sobre del 2 % per l'energia. Els preus ja són un ${pct(preus, 0)} més alts que el 2020, i no tornaran enrere.` },
    { t: 'Habitatge', link: 'altra', e: esforc == null ? 'warn' : esforc > 20 ? 'bad' : esforc > 5 ? 'warn' : 'good',
      txt: esforc == null ? 'Sense dades.' : `Del 2015 al ${aH}, els pisos pugen un ${pct(pis, 0)} per sobre de la inflació i els sous un ${pct(sou, 0)}. Comprar costa un ${pct(esforc, 0)} més d'anys de sou.` },
    { t: 'Impostos sobre el sou', link: 'impostos', e: irpfPuja == null ? 'warn' : irpfPuja > 1 ? 'bad' : irpfPuja > 0.3 ? 'warn' : 'good',
      txt: irpfPuja == null ? 'Sense dades.' : `L'IRPF d'un sou mitjà ha pujat ${nf(irpfPuja, 1)} punts des del 2020 sense tocar la llei. Des del 2000, el sou brut real ${sgn(brutReal, 1)} % i el net ${sgn(netReal, 1)} %.` },
    { t: 'Deute i interessos', link: 'deute', e: it >= 3 || de >= 110 ? 'bad' : de >= 60 ? 'warn' : 'good',
      txt: `Deute del ${pct(de, 0)} del PIB; l'FMI preveu que baixi al ${pct(deF, 0)} el ${Y + 5}. Els interessos ja són el ${pct(it)} del PIB (${pct(it21)} el 2021). Prima de risc: ${prima != null ? nf(prima, 0) + ' pb' : '–'}.` },
    { t: 'Immigració', link: 'immigracio', e: ret != null && ord && ret / ord[1] < 0.3 ? 'warn' : 'good',
      txt: fora ? `${(s => s[0].toUpperCase() + s.slice(1))(artPct(fora[1] / pobF * 100))} de la població ha nascut a fora i la migració neta és de ${sgn(mig?.[1])} per mil. Sosté el creixement i les cotitzacions, però pressiona l'habitatge. Només es compleix ${artPct(ret / ord[1] * 100, 0)} de les ordres d'expulsió.` : 'Sense dades.' },
    { t: 'Energia i Ormuz', link: 'inici', e: 'warn',
      txt: 'El petroli es paga a preu mundial, el compri qui el compri: si l\'estret d\'Ormuz continua inestable, la benzina, el transport i la inflació en patiran.' },
  ];

  const W1 = val(W, 'creix', Y), W2 = val(W, 'infl', Y), W3 = val(W, 'deute', Y), W4 = val(W, 'deute', Y + 5);
  const or = D.altra?.or, orCompra = or ? Object.values(or).reduce((s, x) => s + ((x[2025] ?? 0) - (x[2021] ?? x[2025] ?? 0)), 0) : null;

  return `

    <b>no surt als titulars</b>. Toca qualsevol punt per veure'n el detall.</p>

  </div>

      <b>més habitants</b>, i la majoria de la gent <b>no el nota a la butxaca</b>: el pis, la inflació acumulada i els impostos se'n mengen gairebé tota la millora.
    </div>
    ${semEsp.length ? semHTML(semEsp) : ''}
    <div class="grid g2" style="margin-top:14px">
      <div>
        <b>📰 La lectura oficial</b>
        <p class="sub">• Una de les economies grans de la zona euro que més creix.</p>
        <p class="sub">• L'atur i el deute baixen a poc a poc, i l'FMI preveu que la inflació torni a baixar el ${Y + 1} (${pct(val(E, 'infl', Y + 1))}).</p>
        <p class="sub">• La prima de risc és baixa: els inversors es fien d'Espanya més que de França o Itàlia.</p>
        <p class="sub">• La immigració aporta treballadors i cotitzacions en un país que envelleix.</p>
      </div>
      <div>
        <b>🔍 La lectura crítica</b>
        <p class="sub">• Per habitant, el creixement és molt més modest que el total.</p>
        <p class="sub">• Els pisos s'han allunyat dels sous, i els joves ho noten més que ningú.</p>

        <p class="sub">• L'atur continua molt per sobre de la mitjana europea, i el control de la immigració irregular és feble.</p>

  <div class="card">

function renderInici() {
  const W = 'WEOWORLD';
  const top = countries().slice(0, 15);
  const alts = countries().filter(c => (val(c, 'deute', Y) || 0) >= 100);
  const inflMax = Math.max(...pts(W, 'infl', 2015, Y).map(p => p[1]));
  const anyMax = pts(W, 'infl', 2015, Y).find(p => p[1] === inflMax)?.[0];
  const pibTop = top.reduce((s, c) => s + (val(c, 'quota', Y) || 0), 0);
  const inflPuja = val(W, 'infl', Y) > val(W, 'infl', Y - 1);
  const bce = lastChange('XM');
  return `
  <div class="intro">
    <h2>Com va el món el ${Y}?</h2>
    <p class="sub">Les xifres principals de l'economia mundial, amb les dades de l'FMI. Toca qualsevol pestanya per aprofundir-hi.

  </div>
  <div class="tiles">
    ${tile('🏭 Creixement mundial', pct(val(W, 'creix', Y)), `Quant creix l'economia del món el ${Y}`, levelCreix(val(W, 'creix', Y)))}
    ${tile('🛒 Inflació mundial', pct(val(W, 'infl', Y)), `El ${anyMax} va arribar al ${pct(inflMax)}`, levelInfl(val(W, 'infl', Y)))}
    ${tile('🏦 Deute públic mundial', pct(val(W, 'deute', Y), 0), 'del PIB mundial', levelDeute(val(W, 'deute', Y)))}

  </div>
  ${actualitatHTML()}

  <div class="grid g2">
    <div class="card">
      <h3>Les economies més grans</h3>
      <p class="sub">PIB del ${Y} en dòlars. Aquests 15 països fan el ${nf(pibTop, 0)} % de l'economia mundial (comptant en paritat de poder adquisitiu).</p>
      ${barsHTML(top.map(c => ({ c, name: label(c), v: val(c, 'pib', Y) })), { fmt: money, me: 'ESP' })}

    <div class="card">
      <h3>Inflació: la pujada de preus al món</h3>
      <p class="sub">Percentatge anual. Després de la pandèmia i la guerra d'Ucraïna els preus es van disparar. ${inflPuja ? `Quan semblava que es calmaven, la crisi d'Ormuz els torna a empènyer el ${Y}.` : 'Després han anat tornant a la normalitat.'}</p>
      ${chart('c-home-infl', el => lineChart(el, { title: 'Inflació', forecast: Y, fmt: v => pct(v),
        series: [['WEOWORLD', 1], ['ADVEC', 0], ['OEMDC', 2]].map(([c, i]) => ({ name: ent(c).nom, color: `var(--s${i + 1})`, pts: pts(c, 'infl', 2000) })) }))}
    </div>
  </div>

  <div class="card">
    <h3>Tres coses per entendre el moment actual</h3>
    <div class="grid g3" style="margin-top:10px">
      <div class="concept"><div class="emo">🛒</div><b>${inflPuja ? 'Els preus tornen a pujar més de pressa' : 'Els preus ja no pugen tan de pressa…'}</b>
        <p class="sub">${inflPuja ? `L'FMI preveu un ${pct(val(W, 'infl', Y))} d'inflació mundial el ${Y}, més que el ${Y - 1} (${pct(val(W, 'infl', Y - 1))}), sobretot per l'energia.` : '…però no han baixat.'}
        El que va pujar el 2021-2023 no ha tornat enrere; per això molta gent nota que tot és més car.
        <a href="#inflacio">Mira-ho →</a></p></div>
      <div class="concept"><div class="emo">🏦</div><b>Els estats deuen més que mai</b>

}

/* ── 💶 Sous ────────────────────────────────────────────────────────────────── */
function renderSous() {
  const has = c => !isGroup(c) && ent(c).s.souReal;
  const base = 2000;
  const selW = sel.filter(has);
  const idx = c => { const s = ent(c).s.souReal, b = s[base] ?? s[Object.keys(s)[0]]; return Object.entries(s).map(([a, v]) => [+a, v / b * 100]); };
  const ocde = countries().filter(has);
  const lastW = c => lastYear(c, 'souNom');
  // Sous vs preus 2020 → últim any amb dada de sou
  const comp = c => {
    const a1 = lastW(c); if (!a1 || !val(c, 'souNom', 2020)) return null;
    const w = (val(c, 'souNom', a1) / val(c, 'souNom', 2020) - 1) * 100, p = cumInfl(c, 2020, a1);
    // el poder adquisitiu surt del sou real de l'OCDE (deflactat amb els preus del consum privat),
    // no de restar la inflació de l'FMI: així coincideix amb el gràfic del sou real
    const r0 = val(c, 'souReal', 2020), r1 = val(c, 'souReal', a1);
    return p == null || !r0 || !r1 ? null : { w, p, real: (r1 / r0 - 1) * 100, a1 };
  };
  const reals = ocde.map(c => ({ c, name: label(c), v: comp(c)?.real })).sort((a, b) => b.v - a.v);
  const guany = reals.filter(r => r.v > 0).length;
  const me = selW[0] || 'ESP', mc = comp(me);
  return `
  <div class="intro">
    <h2>💶 Sous: guanyem o perdem poder adquisitiu?</h2>
    <p class="sub">Que et pugin el sou no vol dir que visquis millor: si els preus pugen més, a final de mes et queda menys.
    Això és el <b>sou real</b>: el sou descomptant la inflació. Dades de l'OCDE (${ocde.length} països; la Xina, l'Índia o el Brasil no hi són).</p>
  </div>
  ${mc ? `<div class="tiles">
    ${tile(`${esc(label(me))}: sous ${mc.a1} vs 2020`, sgn(mc.w, 1) + ' %', 'pujada del sou mitjà en diners')}
    ${tile('Preus en el mateix període', sgn(mc.p, 1) + ' %', 'inflació acumulada')}
    ${tile('Poder adquisitiu', sgn(mc.real, 1) + ' %', mc.real >= 0 ? 'el sou compra més coses' : 'el sou compra menys coses',
      mc.real >= 0 ? '<span class="badge good">▲ guany</span>' : '<span class="badge bad">▼ pèrdua</span>')}
  </div>` : ''}
  <div class="card">
    <h3>Evolució del sou real (${base} = 100)</h3>
    <p class="sub">Si la línia puja, el sou mitjà compra més coses que el ${base}. Si està per sota de 100, compra menys.</p>
    ${chipsHTML(has)}
    ${selW.length ? chart('c-sous', el => lineChart(el, { title: 'Sou real', zero: false, fmt: v => nf(v), ref: { y: 100, label: 'nivell del ' + base },
      series: selW.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: idx(c) })) }))
      : '<p class="muted">Cap dels països seleccionats té dades de sous a l\'OCDE. Tria\'n algun de la llista.</p>'}
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Guanys i pèrdues des del 2020</h3>
      <p class="sub">Variació del poder adquisitiu del sou mitjà del 2020 a l'últim any disponible. En ${guany} de ${reals.filter(r => r.v != null).length} països els sous ja han superat la inflació.</p>
      ${barsHTML(reals, { fmt: v => sgn(v) + ' %', me })}
    </div>
    <div class="card">
      <h3>Qui cobra més? (sou mitjà anual ${lastYear('USA', 'souReal')})</h3>
      <p class="sub">En dòlars ajustats pel cost de vida de cada país (PPA), perquè sigui comparable.</p>
      ${barsHTML(ocde.map(c => ({ c, name: label(c), v: val(c, 'souReal', lastYear(c, 'souReal')) })).sort((a, b) => b.v - a.v), { fmt: v => int(v) + ' $', me })}
    </div>
  </div>
  <p class="muted">L'OCDE calcula el sou real amb els preus del consum privat, no exactament amb l'IPC. Per això el poder adquisitiu no sempre és
  exactament la pujada del sou menys la inflació de l'FMI que es mostra al costat.
  El sou mitjà inclou tots els assalariats a temps complet equivalent.</p>`;
}

/* ── 💸 El preu del deute ───────────────────────────────────────────────────── */
// Rendiment del bo a 10 anys (OCDE, mensual), prima de risc i interessos pagats (FMI).
const EURO_PAISOS = ['DEU', 'FRA', 'ITA', 'ESP', 'NLD', 'BEL', 'AUT', 'PRT', 'GRC', 'IRL'];
const bons = c => D.fiscal?.bons?.[c];
const bonsPts = c => Object.entries(bons(c) || {}).map(([k, v]) => [monthX(k), v]).sort((a, b) => a[0] - b[0]);
const bonUltim = c => { const e = Object.entries(bons(c) || {}).sort((a, b) => a[0] < b[0] ? -1 : 1); return e.at(-1); };
// "de" + nom amb apòstrof quan cal (d'Espanya, d'Itàlia, de França)
const deNom = n => (/^[aeiouàèéíòóúh]/i.test(n) ? "d'" : 'de ') + n;
const interessos = (c, a) => { const pr = val(c, 'primari', a), s = val(c, 'deficit', a); return pr != null && s != null ? pr - s : null; };

function costDeuteHTML(p) {
  if (!D.fiscal?.bons) return '';
  const de = bonUltim('DEU');
  // la prima es calcula amb el mateix mes per als dos països (l'últim que tinguin tots dos)
  const prima = EURO_PAISOS.filter(c => c !== 'DEU' && bons(c)).map(c => {
    const mes = Object.keys(bons(c)).filter(k => bons('DEU')?.[k] != null).sort().at(-1);
    return { c, name: label(c), v: mes ? (bons(c)[mes] - bons('DEU')[mes]) * 100 : null, mes };
  })
    .filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const fr = prima.find(r => r.c === 'FRA'), it = prima.find(r => r.c === 'ITA'), es = prima.find(r => r.c === 'ESP');
  const selB = sel.filter(c => bons(c));
  const ints = countries().map(c => ({ c, name: label(c), v: interessos(c, Y) })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const ip = interessos(p, Y), dp = val(p, 'deute', Y);
  return `
  <div class="card">
    <h3>💸 Quant costa el deute?</h3>
    <p class="sub">Els estats es financen venent <b>bons</b>. El que paguen per un bo a 10 anys és el termòmetre de la confiança: si els inversors
    tenen dubtes, demanen més interès. Aquest preu acaba als impostos, a les hipoteques i al que queda per a sanitat i pensions.</p>
    <div class="tiles">
      ${de ? tile('🇩🇪 Alemanya (referència)', pct(de[1], 2), `bo a 10 anys, ${monthLabel(monthX(de[0]))}`) : ''}
      ${es ? tile('🇪🇸 Prima de risc d\'Espanya', nf(es.v, 0) + ' pb', 'punts bàsics per sobre d\'Alemanya') : ''}
      ${fr && it ? tile('🇫🇷 França vs 🇮🇹 Itàlia', `${nf(fr.v, 0)} / ${nf(it.v, 0)} pb`, fr.v >= it.v ? 'França ja paga tant o més que Itàlia' : 'Itàlia encara paga més que França',
        fr.v >= it.v ? '<span class="badge bad">⚠ canvi de rol</span>' : '') : ''}
      ${ip != null ? tile(`Interessos ${esc(deNom(ent(p).nom))} ${Y}`, pct(ip), `del PIB, amb un deute del ${pct(dp, 0)}`) : ''}
    </div>
    <h3>Rendiment del bo a 10 anys</h3>
    <p class="sub">Mitjana mensual. Es veuen la crisi de l'euro (2011-2012), els tipus gairebé a zero (2015-2021) i la pujada des del 2022.</p>
    ${chipsHTML(c => !!bons(c))}
    ${chart('c-bons', el => lineChart(el, { title: 'Bons a 10 anys', months: true, fmt: v => pct(v, 2), tick: v => v + ' %',
      series: selB.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: bonsPts(c) })) }))}
    <div class="grid g2" style="margin-top:14px">
      <div>
        <h3>Prima de risc a la zona euro</h3>
        <p class="sub">Diferència amb el bo alemany el mateix mes, en punts bàsics (100 pb = 1 %). Últim mes disponible de cada país.</p>
        ${barsHTML(prima, { fmt: v => nf(v, 0) + ' pb', me: p })}
      </div>
      <div>
        <h3>Interessos pagats en % del PIB (${Y})</h3>
        <p class="sub">Interessos nets del deute públic, previsió de l'FMI.${val(p, 'pib', Y) ? ` A ${esc(ent(p).nom)}, cada 1 % del PIB són uns ${int(val(p, 'pib', Y) * 10)} milions de dòlars l'any.` : ''}</p>
        ${barsHTML(ints, { fmt: v => pct(v), me: p })}
      </div>
    </div>
    <h3 style="margin-top:14px">Evolució dels interessos</h3>
    <p class="sub">% del PIB. Com que el deute vell es va renovant a tipus nous més alts, aquesta factura puja a poc a poc durant anys.</p>
    ${chart('c-ints', el => lineChart(el, { title: 'Interessos del deute', forecast: Y, fmt: v => pct(v),
      series: sel.filter(c => ent(c).s.primari).map(c => ({ name: label(c), short: ent(c).nom, color: col(c),
        pts: Object.keys(ent(c).s.primari).map(Number).map(a => [a, interessos(c, a)]).filter(x => x[1] != null) })) }))}
    <div class="callout" style="margin-top:12px">
      <b>Per què importa si "sempre hi ha algú que compra"?</b>
      <p class="sub">Durant anys el BCE i el Banc del Japó compraven bons sense discutir el preu. Ara ja no ho fan, i els estats han de convèncer
      inversors privats, que demanen més interès, sobretot si el dèficit no baixa o la política és inestable. Un estat pot ser <b>solvent</b>
      (acabarà pagant) i alhora tenir problemes de <b>liquidesa</b> (li costa trobar qui li deixi diners avui).</p>
      <p class="muted">Fonts: OCDE (rendiment dels bons a 10 anys) i FMI (saldo primari i saldo total; els interessos són la diferència).</p>
    </div>
  </div>`;
}

/* ── 🏦 Deute ───────────────────────────────────────────────────────────────── */

    <div>
      <div class="card">
        <h3>Evolució del deute públic</h3>

        ${chipsHTML()}
        ${chart('c-deute', el => lineChart(el, { title: 'Deute públic', forecast: Y, fmt: v => pct(v, 0), tick: v => v + ' %',
          series: sel.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: pts(c, 'deute', 2000) })) }))}

        <div style="margin-top:12px">${hy ? barsHTML([
          { name: '🏛️ Estat', v: val(p, 'deute', hy), color: 'var(--s1)' },
          { name: '👪 Famílies', v: val(p, 'deuteLlars', hy), color: 'var(--s2)' },

/* ── 📈 Tipus d'interès ─────────────────────────────────────────────────────── */
let banks = lsGet(LS_BANKS, DEFAULT_BANKS);
let bankCol = fixColors(banks, lsGet(LS_BANKS + '_c', {}));
function toggleBank(b) {
  if (banks.includes(b)) { if (banks.length > 1) banks = banks.filter(x => x !== b); }
  else { if (banks.length >= MAX_SEL) return alert(`Com a màxim ${MAX_SEL} alhora.`); banks = [...banks, b]; }
  fixColors(banks, bankCol); lsSet(LS_BANKS, banks); lsSet(LS_BANKS + '_c', bankCol); renderView();
}
function renderTipus() {
  const T = D.tipus || {};
  const avail = Object.keys(BANKS).filter(b => T[b]);
  const last = b => { const k = Object.keys(T[b] || {}).sort().pop(); return k ? [k, T[b][k]] : null; };
  const rows = avail.map(b => {
    const l = last(b), inf = val(BANK_INFL[b], 'infl', Y);
    return { b, l, inf, real: l && inf != null ? l[1] - inf : null };
  });
  const ecb = last('XM');
  return `
  <div class="intro">
    <h2>📈 Tipus d'interès: el preu dels diners</h2>
    <p class="sub">El <b>tipus d'interès oficial</b> el fixa el banc central de cada país. És el preu al qual els bancs es deixen diners, i d'aquí surten
    l'euríbor, les hipoteques, els préstecs i el que et paguen pels estalvis.</p>
  </div>
  ${ecb ? `<div class="tiles">
    ${tile('🇪🇺 Tipus del BCE', pct(ecb[1], 2), `a ${monthLabel(monthX(ecb[0]))}`)}
    ${tile('Inflació zona euro ' + Y, pct(val('EURO', 'infl', Y)), 'previsió FMI', levelInfl(val('EURO', 'infl', Y)))}
    ${tile('Tipus real', sgn(ecb[1] - val('EURO', 'infl', Y), 2) + ' %', 'tipus menys inflació')}
  </div>` : ''}
  <div class="card">
    <h3>Tipus oficials dels bancs centrals des del 2007</h3>
    <p class="sub">A final de cada mes. Fixa't en els tres moments clau: la crisi del 2008, els tipus a zero (o negatius) fins al 2022, i la pujada ràpida per frenar la inflació.</p>
    <div class="chips" style="margin-bottom:12px">${avail.map(b => `<button class="chip ${banks.includes(b) ? 'on' : ''}" onclick="toggleBank('${b}')" ${banks.includes(b) ? `style="color:${col(b, bankCol)}"` : ''}>
      ${banks.includes(b) ? `<span class="dot" style="background:${col(b, bankCol)}"></span>` : ''}<span style="color:var(--text)">${esc(BANKS[b])}</span></button>`).join('')}</div>
    ${chart('c-tipus', el => lineChart(el, { title: 'Tipus oficials', months: true, fmt: v => pct(v, 2),
      series: banks.filter(b => T[b]).map(b => ({ name: BANKS[b], short: BANKS[b].split(' (')[0].replace(/^Banc (del |de l'|d'|de )?/, ''), color: col(b, bankCol),
        pts: Object.entries(T[b]).map(([k, v]) => [monthX(k), v]).sort((a, b) => a[0] - b[0]) })) }))}
  </div>
  <div class="card">
    <h3>Tipus reals: guanyen els estalvis a la inflació?</h3>
    <p class="sub">Tipus oficial actual menys la inflació prevista per al ${Y}. Si és positiu, els diners estalviats guanyen valor; si és negatiu, en perden, i demanar un préstec surt "barat".</p>
    ${barsHTML(rows.map(r => ({ c: r.b, name: BANKS[r.b], v: r.real })).sort((a, b) => b.v - a.v), { fmt: v => sgn(v) + ' %', me: 'XM' })}
  </div>
  <div class="card">
    <h3>Com funciona?</h3>
    <div class="flow">
      <div class="step"><b>📈 Pugen els tipus</b>Les hipoteques i els préstecs són més cars.</div><div class="arr">→</div>
      <div class="step"><b>💳 Menys crèdit</b>Famílies i empreses gasten i inverteixen menys.</div><div class="arr">→</div>
      <div class="step"><b>📦 Menys demanda</b>Les botigues venen menys i no poden apujar tant els preus.</div><div class="arr">→</div>
      <div class="step"><b>🛒 Baixa la inflació</b>…però l'economia creix més a poc a poc.</div>
    </div>
    <p class="sub" style="margin-top:8px">Quan baixen els tipus passa al revés: s'anima el consum i la inversió. L'art del banc central és trobar el punt on els preus pugen un 2 % sense frenar massa l'economia.</p>
  </div>`;
}

/* ── 🏭 Creixement ──────────────────────────────────────────────────────────── */

    <h2>🏭 Creixement, atur i riquesa</h2>
    <p class="sub">El <b>PIB</b> és el valor de tot el que un país produeix en un any. Quan creix, normalment hi ha més feina i més ingressos.

  </div>
  <div class="card">
    <h3>Creixement anual del PIB</h3>
    <p class="sub">Descomptada la inflació. Es veuen clarament la crisi del 2009 i la pandèmia del 2020.</p>
    ${chipsHTML()}
    ${chart('c-creix', el => lineChart(el, { title: 'Creixement del PIB', forecast: Y, fmt: v => sgn(v) + ' %',
      series: sel.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: pts(c, 'creix', 2000) })) }))}
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Qui creix més el ${Y}?</h3>
      <p class="sub">Els països emergents creixen més de pressa perquè parteixen de més avall.</p>
      ${barsHTML(rows, { fmt: v => sgn(v) + ' %', me: 'ESP', ref: { v: val('WEOWORLD', 'creix', Y), label: 'el creixement mundial' } })}
    </div>
    <div class="card">
      <h3>Atur ${Y}</h3>
      <p class="sub">% de la població activa que busca feina i no en troba. En vermell, per sobre del 10 %.</p>
      ${barsHTML(atur, { fmt: v => pct(v), me: 'ESP' })}

  <div class="card">
    <h3>Riquesa per habitant ${Y}</h3>
    <p class="sub">PIB per persona en dòlars internacionals (ajustat pel cost de vida). És la millor manera de comparar el nivell de vida mitjà, tot i que no diu res de com es reparteix.</p>
    ${barsHTML(rics, { fmt: v => int(v) + ' $', me: 'ESP' })}
  </div>`;
}

/* ── 📍 Fitxa de país ───────────────────────────────────────────────────────── */
let fitxa = lsGet('economia_fitxa', 'ESP');
function renderPais() {
  const c = D.paisos[fitxa] || D.grups[fitxa] ? fitxa : 'ESP', e = ent(c);
  const v = k => val(c, k, Y);
  const g = isGroup(c);
  const txt = [];
  const cr = v('creix'), inf = v('infl'), de = v('deute'), at = v('atur'), df = v('deficit'), cc = v('cc');
  if (cr != null) txt.push(cr < 0 ? `L'economia es contrau un ${pct(-cr)}.` : cr < 1 ? `L'economia gairebé no creix (${pct(cr)}).` : cr > 4 ? `L'economia creix amb força, un ${pct(cr)}.` : `L'economia creix a un ritme moderat, un ${pct(cr)}.`);
  if (inf != null) txt.push(inf <= 2.5 ? `Els preus estan controlats (${pct(inf)}).` : inf <= 5 ? `Els preus pugen una mica més del desitjable (${pct(inf)}).` : `La inflació és un problema seriós: ${pct(inf)}.`);
  if (at != null) txt.push(at >= 10 ? `L'atur és alt: un ${pct(at)}.` : at < 5 ? `Gairebé hi ha plena ocupació (atur del ${pct(at)}).` : `L'atur és del ${pct(at)}.`);
  if (de != null) txt.push(de >= 100 ? `L'estat deu més que tot el que el país produeix en un any (${pct(de, 0)} del PIB).` : de >= 60 ? `El deute públic és considerable (${pct(de, 0)} del PIB).` : `El deute públic és moderat (${pct(de, 0)} del PIB).`);
  if (df != null) txt.push(df < -3 ? `Gasta força més del que ingressa: dèficit del ${pct(-df)}.` : df < 0 ? `Gasta una mica més del que ingressa (dèficit del ${pct(-df)}).` : `Ingressa més del que gasta (superàvit del ${pct(df)}).`);
  if (cc != null) txt.push(cc >= 0 ? `Ven a l'exterior més del que compra (superàvit exterior del ${pct(cc)}).` : `Compra a l'exterior més del que ven (dèficit exterior del ${pct(-cc)}).`);
  const opts = [...Object.keys(D.grups), ...countries()];
  const cs = `var(--s1)`, is = `var(--s2)`;
  return `
  <div class="intro controls">
    <h2 style="margin:0">📍 ${esc(label(c))}</h2>
    <select onchange="fitxa=this.value;lsSet('economia_fitxa',this.value);renderView()" aria-label="País">${opts.map(o => `<option value="${o}" ${o === c ? 'selected' : ''}>${esc(label(o))}</option>`).join('')}</select>
  </div>
  <div class="tiles">
    ${tile('Creixement ' + Y, sgn(cr) + ' %', 'PIB real', levelCreix(cr))}
    ${tile('Inflació ' + Y, pct(inf), 'pujada de preus', levelInfl(inf))}
    ${tile('Atur ' + Y, pct(at), 'població activa', levelAtur(at))}
    ${tile('Deute públic', pct(de, 0), 'del PIB', levelDeute(de))}
    ${tile('PIB', money(v('pib')), g ? '' : `${nf(v('quota'), 1)} % del món (PPA)`)}
    ${g ? '' : tile('PIB per habitant', int(v('pibpc')) + ' $', `${nf(v('pob'), v('pob') < 10 ? 2 : 0)} M d'habitants`)}
  </div>
  <div class="card">
    <h3>En poques paraules</h3>
    <p>${txt.map(esc).join(' ')}</p>
    <p class="muted">Dades del ${Y} (previsió de l'FMI).</p>
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Creixement i inflació</h3>
      <p class="sub">% anual.</p>
      ${chart('c-p1', el => lineChart(el, { title: 'Creixement i inflació', forecast: Y, fmt: v => pct(v),
        series: [{ name: 'Creixement del PIB', short: 'Creixement', color: cs, pts: pts(c, 'creix', 2000) }, { name: 'Inflació', color: is, pts: pts(c, 'infl', 2000) }] }))}
    </div>
    <div class="card">
      <h3>Deute públic i dèficit</h3>
      <p class="sub">% del PIB.</p>
      ${chart('c-p2', el => lineChart(el, { title: 'Deute', forecast: Y, fmt: v => pct(v), tick: v => v + ' %',
        series: [{ name: 'Deute públic', short: 'Deute', color: cs, pts: pts(c, 'deute', 2000) }, { name: 'Saldo públic (dèficit si és negatiu)', short: 'Saldo', color: is, pts: pts(c, 'deficit', 2000) }] }))}
    </div>
    <div class="card">
      <h3>Atur</h3>
      <p class="sub">% de la població activa.</p>
      ${chart('c-p3', el => lineChart(el, { title: 'Atur', forecast: Y, fmt: v => pct(v), series: [{ name: 'Atur', color: cs, pts: pts(c, 'atur', 2000) }] }))}
    </div>
    ${!g && e.s.souReal ? `<div class="card">
      <h3>Sou mitjà anual</h3>
      <p class="sub">En diners de cada any (${esc(e.moneda || '')}) i descomptant la inflació (preus del ${esc(e.souBase || '')}). La distància entre les dues línies és el que s'ha menjat la inflació.</p>
      ${chart('c-p4', el => {
        const f = e.s.souReal[e.souBase] / e.s.souNom[e.souBase]; // passa el sou real a moneda nacional
        lineChart(el, { title: 'Sou mitjà', zero: false, fmt: v => int(v) + ' ' + (e.moneda || ''), series: [
          { name: 'Sou en diners de cada any', short: 'Nominal', color: cs, pts: pts(c, 'souNom', 2000) },
          { name: `Sou real (preus del ${e.souBase})`, short: 'Real', color: is, pts: Object.entries(e.s.souReal).map(([a, x]) => [+a, x / f]) }] });
      })}
    </div>` : `<div class="card">
      <h3>Balança exterior</h3>
      <p class="sub">% del PIB. Positiu: ven més a fora del que compra.</p>
      ${chart('c-p4', el => lineChart(el, { title: 'Compte corrent', forecast: Y, fmt: v => sgn(v) + ' %', series: [{ name: 'Compte corrent', color: cs, pts: pts(c, 'cc', 2000) }] }))}
    </div>`}
  </div>`;
}

/* ── 🔍 L'altra cara ────────────────────────────────────────────────────────── */
// Dades oficials que no surten als titulars: habitatge, creació de diners i or.
let altraPais = lsGet('economia_altra_pais', 'ESP');
let altraBase = lsGet('economia_altra_base', 2015);
const A = () => D.altra || {};
const nomOr = c => ent(c) ? label(c) : (A().orNoms?.[c] ? `${A().orNoms[c][1]} ${A().orNoms[c][0]}` : c);
const idxBase = (serie, base) => { const b = serie?.[base]; return b ? Object.entries(serie).filter(([a]) => +a >= base).map(([a, v]) => [+a, v / b * 100]) : []; };

// Barres dobles: dues mesures per fila, amb el mateix eix
function pairBarsHTML(rows, o) {
  rows = rows.filter(r => r.a != null && r.b != null);
  if (!rows.length) return '<p class="muted">Sense dades.</p>';
  const lo = Math.min(0, ...rows.flatMap(r => [r.a, r.b])), hi = Math.max(0, ...rows.flatMap(r => [r.a, r.b]));
  const P = v => (v - lo) / (hi - lo || 1) * 100;
  const one = (v, color) => {
    const a = P(Math.min(0, v)), b = P(Math.max(0, v));
    return `<span class="track">${lo < 0 ? `<span class="axis0" style="left:${P(0)}%"></span>` : ''}<span class="fill" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;background:${color}"></span></span>`;
  };
  return `<div class="legend" style="margin:0 0 8px"><span><i style="background:var(--s2)"></i>${esc(o.la)}</span><span><i style="background:var(--s1)"></i>${esc(o.lb)}</span></div>
  <div class="bars">${rows.map(r => `<div class="bar pair ${r.c === o.me ? 'me' : ''}" title="${esc(r.name)}: ${esc(o.la)} ${esc(o.fmt(r.a))} · ${esc(o.lb)} ${esc(o.fmt(r.b))}">
    <span class="n">${esc(r.name)}</span>
    <span class="dbl">${one(r.a, 'var(--s2)')}${one(r.b, 'var(--s1)')}</span>
    <span class="val"><span>${esc(o.fmt(r.a))}</span><span class="muted">${esc(o.fmt(r.b))}</span></span></div>`).join('')}</div>`;
}

function renderAltra() {
  const X = A();
  if (!X.habitatge && !X.balanc && !X.diners && !X.or) return '<p class="muted">Aquestes dades encara no s\'han baixat.</p>';

  // 1 · Habitatge vs sous (tots dos descomptant la inflació)
  const H = X.habitatge || {};
  const base = altraBase;
  const both = countries().filter(c => H[c] && ent(c).s.souReal);
  const comuna = c => Math.min(lastYear(c, 'souReal'), Math.max(...Object.keys(H[c].anual).map(Number)));
  const canvi = (serie, a) => serie?.[base] && serie?.[a] ? (serie[a] / serie[base] - 1) * 100 : null;
  const pair = both.map(c => { const a = comuna(c); return { c, name: label(c), a: canvi(H[c].anual, a), b: canvi(ent(c).s.souReal, a), any: a }; })
    .filter(r => r.a != null && r.b != null).sort((x, y) => (y.a - y.b) - (x.a - x.b));
  const hp = both.includes(altraPais) ? altraPais : (both[0] || 'ESP');
  const hr = pair.find(r => r.c === hp);
  const esforc = hr ? ((1 + hr.a / 100) / (1 + hr.b / 100) - 1) * 100 : null;
  const pitjor = pair.filter(r => r.a > r.b).length;

  // 2 · Balanç dels bancs centrals en % del PIB
  const B = X.balanc || {};
  const balPct = (b, a) => { const v = B[b]?.anual?.[a], p = val(BANK_INFL[b], 'pib', +a); return v && p ? v / p * 100 : null; };
  const avail = Object.keys(BANKS).filter(b => B[b]);
  const selB = banks.filter(b => B[b]);
  const mult = avail.map(b => { const a = B[b].anual; return { c: b, name: BANKS[b], v: a[2007] ? Object.values(a).at(-1) / a[2007] : null }; }).sort((x, y) => y.v - x.v);
  const eu = B.XM?.anual, euMax = eu ? Object.entries(eu).reduce((m, e) => e[1] > m[1] ? e : m) : null;
  const euAra = B.XM ? Object.entries(B.XM.mensual).at(-1) : null;

  // 3 · Diners vs economia a la zona euro
  const M = X.diners;
  const d0 = 2000;
  const lastM = M ? Math.max(...Object.keys(M.pib).map(Number)) : null;
  const ratio = (s, a) => s[a] / s[d0];

  // 4 · Or
  const O = X.or || {};
  const ultimOr = c => Math.max(...Object.keys(O[c]).map(Number));
  const compra = Object.keys(O).map(c => ({ c, name: nomOr(c), v: O[c][2021] != null ? O[c][ultimOr(c)] - O[c][2021] : null }))
    .filter(r => r.v).sort((a, b) => b.v - a.v);
  const totalOr = Object.keys(O).map(c => ({ c, name: nomOr(c), v: O[c][ultimOr(c)], color: 'var(--s4)' })).sort((a, b) => b.v - a.v).slice(0, 15);
  const orAny = Object.keys(O).length ? Math.max(...Object.keys(O).map(ultimOr)) : null;
  const chn = O.CHN;
  // Compres i vendes de l'any en curs amb les dades mensuals (des del desembre anterior)
  const OM = X.orMensual || {};
  const anyOr = Math.max(...Object.values(OM).flatMap(x => Object.keys(x)).map(k => +k.slice(0, 4)), 0);
  const ultimMesOr = Object.values(OM).flatMap(x => Object.keys(x)).filter(k => k.startsWith(anyOr)).sort().at(-1);
  const any26 = Object.keys(OM).map(c => {
    const s = OM[c], ks = Object.keys(s).filter(k => k.startsWith(anyOr)).sort(), base = s[`${anyOr - 1}-12`];
    return ks.length && base != null ? { c, name: nomOr(c), v: s[ks.at(-1)] - base, mes: ks.at(-1) } : null;
  }).filter(r => r && Math.abs(r.v) >= 1).sort((a, b) => b.v - a.v);
  const net26 = any26.reduce((t, r) => t + r.v, 0);

  return `
  <div class="intro">
    <h2>🔍 L'altra cara dels números</h2>
    <p class="sub">Les xifres oficials no són falses, però els titulars sovint només n'expliquen una part. Aquí hi ha dades
    <b>també oficials</b> (BIS, BCE, FMI, OCDE) que ajuden a entendre per què molta gent sent que viu pitjor del que diuen les estadístiques.</p>
  </div>

  ${hr ? `<div class="tiles">
    ${tile(`🏠 Pisos a ${esc(ent(hp).nom)}`, sgn(hr.a, 0) + ' %', `preu real, del ${base} al ${hr.any}`)}
    ${tile('💶 Sous reals', sgn(hr.b, 0) + ' %', 'en el mateix període')}
    ${tile('⏳ Esforç per comprar un pis', sgn(esforc, 0) + ' %', 'anys de sou necessaris, respecte al ' + base,
      esforc > 5 ? '<span class="badge bad">▲ més difícil</span>' : esforc < -5 ? '<span class="badge good">▼ més fàcil</span>' : '<span class="badge warn">≈ igual</span>')}
  </div>` : ''}

  <div class="card">
    <h3>🏠 1. Els pisos pugen més que els sous</h3>
    <p class="sub">Tots dos <b>descomptant la inflació</b>. Si la barra taronja supera la blava, comprar un pis costa més anys de feina que el ${base}.
    Passa en ${pitjor} dels ${pair.length} països amb dades. L'IPC no ho recull: a la zona euro no hi compta el preu de comprar un habitatge.</p>
    <div class="controls">
      Des de l'any
      <select onchange="altraBase=+this.value;lsSet('economia_altra_base',altraBase);renderView()" aria-label="Any de referència">${[2000, 2008, 2010, 2015, 2020].map(a => `<option ${a === base ? 'selected' : ''}>${a}</option>`).join('')}</select>
      País
      <select onchange="altraPais=this.value;lsSet('economia_altra_pais',altraPais);renderView()" aria-label="País">${both.map(c => `<option value="${c}" ${c === hp ? 'selected' : ''}>${esc(label(c))}</option>`).join('')}</select>
    </div>
    <div class="grid g2">
      <div>${chart('c-alt-hab', el => lineChart(el, { title: 'Habitatge i sous reals', zero: false, fmt: v => nf(v), ref: { y: 100, label: 'nivell del ' + base },
        series: [{ name: 'Preu real dels pisos', short: 'Pisos', color: 'var(--s2)', pts: idxBase(H[hp]?.anual, base) },
                 { name: 'Sou real mitjà', short: 'Sous', color: 'var(--s1)', pts: idxBase(ent(hp).s.souReal, base) }] }))}
        <p class="muted">${base} = 100. ${hp === 'ESP' && base >= 2008 && base <= 2010 ? 'Compte: el 2008-2010 a Espanya encara no havia esclatat del tot la bombolla immobiliària; prova des del 2015 o del 2000.' : ''}</p></div>
      <div>${pairBarsHTML(pair, { la: 'Pisos', lb: 'Sous', fmt: v => sgn(v, 0) + ' %', me: hp })}</div>
    </div>
  </div>

  ${avail.length ? `<div class="card">
    <h3>🖨️ 2. La màquina de fer diners</h3>
    <p class="sub">Quan un banc central "imprimeix diners", en realitat compra deute (sobretot dels estats) i el paga amb diners nous.
    Tot el que ha comprat queda al seu <b>balanç</b>. Aquí es veu en % del PIB de cada país.</p>
    ${eu ? `<div class="tiles">
      ${tile('Eurosistema el 2007', nf(eu[2007] / 1000, 1) + ' bil. $', `${pct(balPct('XM', 2007), 0)} del PIB`)}
      ${tile(`Màxim (${euMax[0]})`, nf(euMax[1] / 1000, 1) + ' bil. $', `${pct(balPct('XM', euMax[0]), 0)} del PIB`)}
      ${euAra ? tile(`Ara (${monthLabel(monthX(euAra[0]))})`, nf(euAra[1] / 1000, 1) + ' bil. $', 'des del 2022 en retira', '<span class="badge good">▼ baixant</span>') : ''}
    </div>` : ''}
    <div class="chips" style="margin-bottom:12px">${avail.map(b => `<button class="chip ${banks.includes(b) ? 'on' : ''}" onclick="toggleBank('${b}')" ${banks.includes(b) ? `style="color:${col(b, bankCol)}"` : ''}>
      ${banks.includes(b) ? `<span class="dot" style="background:${col(b, bankCol)}"></span>` : ''}<span style="color:var(--text)">${esc(BANKS[b])}</span></button>`).join('')}</div>
    ${chart('c-alt-bal', el => lineChart(el, { title: 'Balanç dels bancs centrals', fmt: v => pct(v, 0), tick: v => v + ' %',
      series: selB.map(b => ({ name: BANKS[b], short: BANKS[b].split(' (')[0].replace(/^Banc (del |de l'|d'|de )?/, ''), color: col(b, bankCol),
        pts: Object.keys(B[b].anual).map(a => [+a, balPct(b, a)]).filter(p => p[1] != null && p[0] < Y) })) }))}
    <p class="muted">Els mateixos bancs centrals que tries a la pestanya de tipus d'interès. Balanç a final d'any dividit pel PIB d'aquell any.</p>
    <div class="grid g2" style="margin-top:14px">
      <div>
        <h3>Quantes vegades més gran que el 2007?</h3>
        <p class="sub">Balanç actual dividit pel del 2007, abans de la crisi financera.</p>
        ${barsHTML(mult, { fmt: v => '×' + nf(v, 1), me: 'XM' })}
      </div>
      <div class="callout">
        <b>Per què ho van fer?</b>
        <p class="sub">2008: salvar els bancs. 2012: salvar l'euro. 2020: pagar la pandèmia. Sense aquestes compres, molts estats
        no s'haurien pogut finançar a tipus baixos.</p>
        <b>Quin preu té?</b>
        <p class="sub">Els diners nous arriben primer als mercats: pugen <b>pisos, borsa i or</b>, i qui ja en tenia es fa més ric.
        Qui viu del sou ho nota més tard, en forma d'inflació (2021-2023).</p>
        <p class="muted">Xifres en dòlars: els canvis de valor de les monedes (sobretot el ien) també les mouen. Font: BIS.</p>
      </div>
    </div>
  </div>` : ''}

  ${M ? `<div class="card">
    <h3>💶 3. Diners vs economia a la zona euro</h3>
    <p class="sub">Si els diners en circulació (M3: bitllets, comptes corrents i dipòsits) creixen molt més de pressa que l'economia, els diners de més
    acaben pujant el preu d'alguna cosa: dels productes (inflació) o dels actius (pisos, accions).</p>
    ${chart('c-alt-m3', el => lineChart(el, { title: 'Diners, economia i preus', zero: false, fmt: v => nf(v, 0), ref: { y: 100, label: 'nivell del ' + d0 },
      series: [{ name: 'Diners en circulació (M3)', short: 'Diners', color: 'var(--s2)', pts: idxBase(M.m3, d0).filter(p => p[0] <= lastM) },
               { name: 'Economia en euros (PIB nominal)', short: 'PIB', color: 'var(--s1)', pts: idxBase(M.pib, d0) },
               { name: 'Preus (IPCH)', short: 'Preus', color: 'var(--s3)', pts: idxBase(M.preus, d0).filter(p => p[0] <= lastM) }] }))}
    <p class="sub" style="margin-top:8px">Del ${d0} al ${lastM}, els diners s'han multiplicat per <b>${nf(ratio(M.m3, lastM), 1)}</b>, l'economia en euros per
    <b>${nf(ratio(M.pib, lastM), 1)}</b> i els preus per <b>${nf(ratio(M.preus, lastM), 2)}</b>.</p>
    <p class="muted">${d0} = 100. Font: BCE (M3 a final d'any, PIB nominal i IPCH).</p>
  </div>` : ''}

  ${orAny ? `<div class="card">
    <h3>🥇 4. La febre de l'or dels bancs centrals</h3>
    <p class="sub">Des del 2022 els bancs centrals compren or al ritme més alt en dècades. Els motius principals:</p>
    <div class="grid g3" style="margin:6px 0 14px">
      <div><b>🔒 Les sancions a Rússia</b><p class="sub">El 2022 li van congelar les reserves en dòlars i euros. Molts països van entendre que l'or guardat a casa ningú no el pot bloquejar.</p></div>
      <div><b>💵 Desconfiança en el dòlar</b><p class="sub">Amb els EUA i altres estats molt endeutats, l'or és una reserva que no depèn de cap govern.</p></div>
      <div><b>🛡️ Protecció</b><p class="sub">Si les monedes perden valor per la inflació, l'or tendeix a mantenir el seu.</p></div>
    </div>
    ${any26.length ? `<div class="callout" style="margin-bottom:14px">
      <h3>El ${anyOr}, fins a ${esc(monthLabel(monthX(ultimMesOr)))}</h3>
      <p class="sub">Tones comprades (o venudes) des del desembre del ${anyOr - 1}, segons les dades mensuals que els països envien a l'FMI.
      Entre tots els que ho declaren: <b>${sgn(net26, 0)} t</b>. Quan un estat necessita diners, fins i tot l'or es ven: fixa't en els negatius.</p>
      ${barsHTML(any26, { fmt: v => sgn(v, 0) + ' t' })}
      <p class="muted">Alguns països publiquen amb un o dos mesos de retard; les dades oficials no inclouen compres no declarades.</p>
    </div>` : ''}
    <div class="grid g2">
      <div>
        <h3>Qui n'ha comprat més des del 2021</h3>
        <p class="sub">Tones afegides a les reserves fins al ${orAny}.${chn?.[2021] && chn?.[orAny] ? ` La Xina declara ${int(chn[orAny] - chn[2021])} t més; molts analistes creuen que en compra més del que diu oficialment.` : ''}</p>
        ${barsHTML(compra.slice(0, 12), { fmt: v => sgn(v, 0) + ' t' })}
      </div>
      <div>
        <h3>Qui en té més</h3>
        <p class="sub">Reserves oficials d'or, en tones (${orAny}).</p>
        ${barsHTML(totalOr, { fmt: v => int(v) + ' t', me: 'ESP' })}
      </div>
    </div>
    <p class="muted">Font: FMI (reserves internacionals). Alguns països no publiquen aquestes dades a l'FMI o no ho fan cada any.</p>
  </div>` : ''}

  <div class="card">
    <h3>🧾 5. Per què la inflació oficial pot semblar massa baixa</h3>
    <div class="grid g2" style="margin-top:8px">
      <div><b>🏠 L'habitatge hi pesa poc</b><p class="sub">A la zona euro l'IPC compta els lloguers, però no el preu de comprar un pis, que és la despesa més gran de moltes famílies.</p></div>
      <div><b>🔄 La cistella s'adapta</b><p class="sub">Si la carn puja i la gent compra pollastre, l'estadística canvia la cistella. El número surt més baix, però vius pitjor.</p></div>
      <div><b>📱 "Millores de qualitat"</b><p class="sub">Si un producte val el mateix però és millor, es compta com si hagués baixat de preu.</p></div>
      <div><b>📈 Els preus no tornen enrere</b><p class="sub">Que la inflació baixi al 2 % vol dir que els preus pugen més a poc a poc, no que baixin. El que va pujar el 2022 es queda.</p></div>
      <div><b>👪 Cada família té la seva inflació</b><p class="sub">Qui gasta molt en lloguer, menjar i energia (sovint les rendes baixes) pateix més inflació que la mitjana.</p></div>
      <div><b>🏷️ La "reduflació"</b><p class="sub">El paquet val el mateix però porta menys producte. Les estadístiques ho intenten recollir, però costa.</p></div>
    </div>
    <p class="muted" style="margin-top:10px">Hi ha índexs alternatius que diuen que la inflació real és molt més alta, però la majoria no expliquen bé com es calculen.
    Aquí només fem servir dades oficials, i n'ensenyem la part que no surt als titulars.</p>
  </div>`;
}

/* ── 🧳 Immigració ──────────────────────────────────────────────────────────── */
// Tema delicat: dades oficials, beneficis i costos junts, i sempre dient d'on surt cada xifra.
const IM_DEFAULT = ['ESP', 'DEU', 'FRA', 'ITA', 'EU'];
let imSel = lsGet('economia_imsel', IM_DEFAULT);
let imCol = fixColors(imSel, lsGet('economia_imsel_c', {}));
let imPais = lsGet('economia_impais', 'ESP');
let imMun = lsGet('economia_immun', '080193');
let munLive = {};    // id → {any, pob, estr, cat: [estr, pob]} (última dada, en directe)
let munGen = 0;
const IE = () => D.immi?.eu || {};
const imNom = c => c === 'EU' ? '🇪🇺 Unió Europea' : label(c);
const imShort = c => c === 'EU' ? 'UE' : ent(c)?.nom || c;
const imVal = (c, k, a) => IE()[c]?.[k]?.[a];
const imLast = (c, k) => { const s = IE()[c]?.[k]; if (!s) return null; const a = Math.max(...Object.keys(s).map(Number)); return [a, s[a]]; };
const pctFora = (c, a) => { const f = imVal(c, 'nascutsFora', a), p = imVal(c, 'pob', a); return f && p ? f / p * 100 : null; };
const serieFora = c => Object.keys(IE()[c]?.nascutsFora || {}).map(Number).map(a => [a, pctFora(c, a)]).filter(p => p[1] != null);

function toggleIm(c) {
  if (imSel.includes(c)) { if (imSel.length > 1) imSel = imSel.filter(x => x !== c); }
  else { if (imSel.length >= MAX_SEL) return alert(`Com a màxim ${MAX_SEL} alhora.`); imSel = [...imSel, c]; }
  fixColors(imSel, imCol); lsSet('economia_imsel', imSel); lsSet('economia_imsel_c', imCol); renderView();
}

// Última dada d'un municipi, en directe de l'Idescat (el padró de dades.json acaba el 2022)
async function loadMun(id) {
  if (munLive[id] || !/^\d{6}$/.test(id)) return;
  const gen = ++munGen;
  try {
    const r = await fetch(`https://api.idescat.cat/emex/v1/dades.json?id=${id}&i=f171,f73&lang=ca`, { signal: AbortSignal.timeout(10000) });
    const j = await r.json();
    const ind = [j.fitxes?.indicadors?.i].flat().filter(Boolean);
    const get = k => (ind.find(x => x.id === k)?.v || '').split(',').map(x => x === '_' ? null : +x);
    const pob = get('f171'), estr = get('f73');
    if (gen !== munGen || !pob[0]) return;
    munLive[id] = { any: +ind[0].r, pob: pob[0], estr: estr[0], cat: [estr[2], pob[2]] };
    if (view === 'immigracio') renderView();
  } catch { /* sense connexió: es mostra només el padró fins al 2022 */ }
}
function setMun(txt) {
  const C = D.immi?.cat; if (!C) return;
  const t = txt.trim().toLowerCase();
  const id = Object.keys(C.mun).find(k => C.mun[k][0].toLowerCase() === t);
  if (!id) return;
  imMun = id; lsSet('economia_immun', id); renderView(); loadMun(id);
}

  }

/* ── 🧾 Impostos ────────────────────────────────────────────────────────────── */
// OCDE Taxing Wages: treballador sense fills que cobra el sou mitjà del seu país.
let impPais = lsGet('economia_imppais', 'ESP');
const IMP = () => D.fiscal?.impostos || {};
const impV = (c, k, a) => IMP()[c]?.[k]?.[a];
const impLast = c => { const s = IMP()[c]?.irpf; return s ? Math.max(...Object.keys(s).map(Number)) : null; };

function renderImpostos() {
  const T = IMP();
  const paisos = countries().filter(c => T[c]?.irpf);
  if (!paisos.length) return '<p class="muted">Aquestes dades encara no s\'han baixat.</p>';
  const p = paisos.includes(impPais) ? impPais : paisos[0];
  const aU = impLast(p), a0 = 2000, aI = 2020;
  const irpf0 = impV(p, 'irpf', a0), irpfI = impV(p, 'irpf', aI), irpfU = impV(p, 'irpf', aU);

  // Nòmina: on van 100 € del que paga l'empresa
  const brut = impV(p, 'brut', aU), net = impV(p, 'net', aU), cunya = impV(p, 'cunya', aU), ss = impV(p, 'irpfSS', aU);
  let nomina = '';
  if (brut && net && cunya != null && ss != null) {
    const cost = net / (1 - cunya / 100);
    const parts = [
      ['🏢 Cotització de l\'empresa', (cost - brut) / cost * 100, 'var(--s4)'],
      ['🏛️ IRPF', brut * irpfU / 100 / cost * 100, 'var(--s2)'],
      ['🧑‍💼 Cotització del treballador', brut * (ss - irpfU) / 100 / cost * 100, 'var(--s5)'],
      ['💶 El que cobres net', net / cost * 100, 'var(--s1)'],
    ];
    const mon = ent(p).moneda || '';
    nomina = `
    <div class="card">
      <h3>🧾 On van els diners d'un sou mitjà a ${esc(ent(p).nom)} (${aU})</h3>
      <p class="sub">De cada 100 que paga l'empresa per un treballador sense fills que cobra el sou mitjà:</p>
      <div style="display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin:10px 0" role="img" aria-label="Repartiment del cost laboral">
        ${parts.map(([n, v, c]) => `<div title="${esc(n)}: ${nf(v, 1)}" style="width:${v}%;background:${c}"></div>`).join('')}
      </div>
      <div class="grid g2">
        ${parts.map(([n, v, c]) => `<div style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:${c};flex:none"></span>
