<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economia Mundial — explicada fàcil · By CRE</title>
<meta name="description" content="Deute, inflació, sous, tipus d'interès i creixement dels principals països del món, explicats de manera senzilla. Dades de l'FMI, l'OCDE i el BIS.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1b2d">
<!-- Política de seguretat de contingut: l'app llegeix dades.json del mateix servidor i, a la pestanya
     d'immigració, l'última dada de cada municipi de l'Idescat.
     Tota la interactivitat va amb onclick en línia, per això cal 'unsafe-inline' als scripts. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self' https://api.idescat.cat;
  font-src 'self';
  manifest-src 'self';
  worker-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'none';
  frame-src 'none'">
<style>
/* ── Variables ──────────────────────────────────────────────────────────────── */
:root {
  color-scheme: dark;
  --bg: #0c1626;
  --bg-2: #111f33;
  --card: #15263d;
  --card-2: #1a2e48;
  --text: #eef3f8;
  --text-2: #a9b8c9;
  --muted: #7d8ea3;
  --border: rgba(148,178,214,0.16);
  --grid: rgba(148,178,214,0.12);
  --accent: #3987e5;
  --shadow: rgba(0,0,0,0.35);
  --neg: #e66767;
  --pos: #3987e5;
  --mid: #383835;
  --good: #3fb97a;
  --warn: #e0a526;
  --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #2f9e2f; --s7: #9085e9; --s8: #e66767;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9;
  --bg-2: #ffffff;
  --card: #ffffff;
  --card-2: #f2f5f9;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #74736e;
  --border: rgba(20,40,70,0.12);
  --grid: rgba(20,40,70,0.09);
  --accent: #2a78d6;
  --shadow: rgba(20,40,70,0.08);
  --neg: #e34948;
  --pos: #2a78d6;
  --mid: #f0efec;
  --good: #1d8a4f;
  --warn: #b77900;
  --bad: #d23b3a;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}

/* ── Base ───────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; margin-bottom: 6px; }
h3 { font-size: 1.02rem; margin-bottom: 4px; }
p { margin: 0 0 10px; }
.sub { color: var(--text-2); }
.muted { color: var(--muted); font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* ── Capçalera i pestanyes ─────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.top { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; }
.top h1 { font-size: 1.15rem; flex: 1; }
.top h1 span { color: var(--muted); font-weight: 500; font-size: .9rem; }
.top h1 .autor { font-style: normal; font-weight: 700; font-size: .72rem; letter-spacing: .06em; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 1px 8px; margin-left: 4px; vertical-align: middle; white-space: nowrap; }
.iconbtn {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  width: 38px; height: 38px; cursor: pointer; font-size: 1.05rem;
}
/* Mòbil: una sola fila que llisca, amb una ombra a la dreta que indica que n'hi ha més */
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 40px 10px 0; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
nav.tabs::-webkit-scrollbar { display: none; }
/* Pantalles amples: totes les pestanyes a la vista, en diverses línies si cal */
@media (min-width: 720px) {
  nav.tabs { flex-wrap: wrap; overflow: visible; padding: 2px 0 10px; row-gap: 4px; -webkit-mask-image: none; mask-image: none; }
  nav.tabs button { padding: 6px 11px; }
}
nav.tabs button {
  flex: none; border: 1px solid transparent; background: none; cursor: pointer;
  padding: 7px 12px; border-radius: 999px; color: var(--text-2); white-space: nowrap;
}
nav.tabs button:hover { background: var(--card); }
nav.tabs button.on { background: var(--accent); color: #fff; }

main { padding: 18px 0 40px; }
section.view { display: none; }
section.view.on { display: block; }

/* ── Targetes ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px var(--shadow);
}
.card > h3 + .sub { margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.intro { margin-bottom: 16px; }
.intro p { max-width: 70ch; }

/* Xifres destacades */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.tile .k { color: var(--text-2); font-size: .82rem; }
.tile .v { font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0; }
.tile .d { color: var(--muted); font-size: .8rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge.good { color: var(--good); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }

/* Explicacions */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin: 10px 0 4px; }
.flow .step { flex: 1 1 150px; background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.flow .step b { display: block; margin-bottom: 2px; }
.flow .arr { align-self: center; color: var(--muted); font-size: 1.2rem; }
.concept .emo { font-size: 1.6rem; }
details.glos { border-top: 1px solid var(--border); padding: 10px 0; }
details.glos summary { cursor: pointer; font-weight: 600; }
details.glos p { margin: 6px 0 0; color: var(--text-2); }
.callout { border-left: 3px solid var(--accent); background: var(--card-2); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 10px 0; }

/* ── Controls ───────────────────────────────────────────────────────────────── */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card-2); border-radius: 999px;
  padding: 4px 10px; font-size: .85rem; color: var(--text-2);
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip.on { color: var(--text); border-color: currentColor; background: var(--card); }
.chip.on .dot { box-shadow: 0 0 0 2px var(--card); }
select, input[type=number] {
  background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
}
.more { font-size: .85rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px; }

/* ── Gràfics ────────────────────────────────────────────────────────────────── */
.chart { position: relative; width: 100%; min-height: 120px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .lbl { fill: var(--text-2); font-size: 12px; font-weight: 600; }
.chart .grid line { stroke: var(--grid); }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .fc { fill: var(--text); opacity: .045; }
.chart .hl { stroke: var(--muted); stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--text-2); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px) !important; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 150px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px; font-size: .8rem; box-shadow: 0 6px 20px var(--shadow); display: none;
}
.tip .t { font-weight: 650; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .r span:first-child { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; }

/* Barres horitzontals */
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 70px; align-items: center; gap: 10px; font-size: .86rem; padding: 2px 4px; border-radius: 6px; }
.bar:hover { background: var(--card-2); }
.bar.me { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.bar .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .track { position: relative; height: 16px; }
.bar .fill { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; }
.bar .axis0 { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; }
.bar.pair { grid-template-columns: minmax(100px, 150px) 1fr 58px; }
.bar.pair .dbl { display: grid; gap: 3px; }
.bar.pair .track { height: 11px; }
.bar.pair .val { display: grid; line-height: 1.15; font-size: .8rem; }
.bar .ref { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--text-2); }

/* Taula */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card); }
th.on { color: var(--text); }
tr.grp td { color: var(--text-2); font-style: italic; }
td.hi { color: var(--bad); font-weight: 600; }
td.lo { color: var(--good); font-weight: 600; }

/* Menú en dos nivells */
nav.grups button { font-weight: 600; color: var(--text); }
nav.sub { padding-top: 0; }
nav.sub button { font-size: .88rem; padding: 5px 11px; }
nav.sub button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

/* En 30 segons i detall plegat */
.rapid { background: color-mix(in srgb, var(--accent) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  border-radius: 14px; padding: 12px 16px; margin: 0 0 14px; }
.rapid .rtit { font-weight: 700; font-size: .78rem; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
.rapid p { margin: 4px 0 0; font-size: 1.02rem; line-height: 1.55; }
details.detall { margin-top: 6px; }
details.detall > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
  background: var(--card); border: 1px dashed var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
details.detall > summary::-webkit-details-marker { display: none; }
details.detall > summary:hover { border-color: var(--accent); }
details.detall .dobre, details.detall .dtanca { font-weight: 650; color: var(--accent); }
details.detall .dtanca, details.detall[open] .dobre { display: none; }
details.detall[open] .dtanca { display: inline; }

/* Rutes guiades */
.rutegrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); margin-top: 10px; }
.rutabtn { text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; cursor: pointer; padding: 12px 14px; border-radius: 14px;
  background: var(--card-2); border: 1px solid var(--border); color: var(--text); }
.rutabtn:hover { border-color: var(--accent); }
.rutabtn .remo { font-size: 1.6rem; grid-row: span 2; }
.rutabar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; margin-bottom: 14px; border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: .9rem; }
.rutabar .rpas { color: var(--text-2); flex: 1; min-width: 180px; }
.rutabar .rdots { display: inline-flex; gap: 5px; }
.rutabar .rdots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.rutabar .rdots i.fet { background: var(--accent); opacity: .5; }
.rutabar .rdots i.ara { background: var(--accent); }
.rutabar button { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--text-2); }
.rutanext { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 18px 0 6px; }
.rutanext button { cursor: pointer; border-radius: 14px; padding: 12px 18px; font-weight: 650; border: 0; background: var(--accent); color: #fff;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.rutanext button small { font-weight: 400; opacity: .9; }
.rutanext button.sec { background: var(--card); color: var(--text); border: 1px solid var(--border); }

/* Glossari emergent */
abbr.terme { text-decoration: none; border-bottom: 1.5px dotted var(--accent); cursor: help; }
#glostip { position: fixed; z-index: 50; display: none; max-width: min(320px, calc(100vw - 16px)); background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: .86rem; box-shadow: 0 8px 24px var(--shadow); }
#glostip p { margin: 4px 0 6px; color: var(--text-2); }

/* Lletra petita (crítica de les xifres oficials) */
details.petita { margin: 10px 0 0; border: 1px dashed var(--border); border-radius: 12px; background: var(--card-2); }
details.petita > summary { list-style: none; cursor: pointer; padding: 9px 14px; font-size: .88rem; font-weight: 600; color: var(--text-2); }
details.petita > summary::-webkit-details-marker { display: none; }
details.petita > summary:hover { color: var(--accent); }
details.petita > div { padding: 0 14px 10px; }
details.petita ul { margin: 0; padding-left: 18px; }
details.petita li { margin: 6px 0; font-size: .9rem; color: var(--text-2); line-height: 1.5; }

/* Resum: semàfor, fitxes i escenaris */
.sem { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 12px; }
.semi { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--card-2);
  border-left: 4px solid var(--muted); color: inherit; text-decoration: none; }
.semi:hover { background: color-mix(in srgb, var(--accent) 8%, var(--card-2)); }
.semi.good { border-left-color: var(--good); } .semi.warn { border-left-color: var(--warn); } .semi.bad { border-left-color: var(--bad); }
.semi .semt { font-size: .95rem; }
.semi .semv { font-size: .78rem; color: var(--accent); margin-top: auto; }
.fitxes { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.fitxa { margin: 0; background: var(--card-2); box-shadow: none; }
.fitxa .mini { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .84rem; color: var(--text-2); margin: 6px 0 8px; }
.fitxa .mini b { color: var(--text); }
.esc { padding: 12px 14px; border-radius: 12px; background: var(--card-2); border-top: 3px solid var(--muted); }
.esc.good { border-top-color: var(--good); } .esc.warn { border-top-color: var(--warn); } .esc.bad { border-top-color: var(--bad); }

/* Barra apilada (nòmina) */
.stack { display: flex; height: 38px; border-radius: 8px; overflow: hidden; gap: 2px; margin: 10px 0 8px; }
.stack > div { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; }
.stack span { color: #fff; font-size: .82rem; font-weight: 650; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.55); }
.stackleg { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .86rem; color: var(--text-2); }
.stackleg span { display: inline-flex; align-items: center; gap: 6px; }
.stackleg i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.stackleg b { color: var(--text); }

/* Calculadora */
.calc { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.calc .res { font-size: 1.6rem; font-weight: 650; }

footer { border-top: 1px solid var(--border); padding: 20px 0 40px; color: var(--muted); font-size: .82rem; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

@media (max-width: 560px) {
  body { font-size: 14px; }
  .card { padding: 14px; border-radius: 14px; }
  .tile .v { font-size: 1.55rem; }
  .bar { grid-template-columns: 105px 1fr 58px; gap: 6px; }
  .stack span { font-size: .7rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar .fill { transition: width .35s ease, left .35s ease; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>🌍 Economia Mundial <span>explicada fàcil</span> <em class="autor">By CRE</em></h1>
      <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="Canvia el tema" aria-label="Canvia el tema">🌓</button>
    </div>
    <nav class="tabs grups" id="grups" aria-label="Blocs"></nav>
    <nav class="tabs sub" id="tabs" aria-label="Pàgines del bloc"></nav>
  </div>
</header>

<div id="glostip" role="tooltip"></div>
<main class="wrap" id="app">
  <div class="loading" id="loading">Carregant dades…</div>

  <!-- ── Resum ── -->
  <section class="view" id="v-resum"></section>
  <!-- ── Inici ── -->
  <section class="view" id="v-inici"></section>
  <!-- ── Inflació ── -->
  <section class="view" id="v-inflacio"></section>
  <!-- ── Sous ── -->
  <section class="view" id="v-sous"></section>
  <!-- ── Impostos ── -->
  <section class="view" id="v-impostos"></section>
  <!-- ── Deute ── -->
  <section class="view" id="v-deute"></section>
  <!-- ── Deute dels EUA ── -->
  <section class="view" id="v-eua"></section>
  <!-- ── Borsa ── -->
  <section class="view" id="v-borsa"></section>
  <!-- ── Tipus ── -->
  <section class="view" id="v-tipus"></section>
  <!-- ── Creixement ── -->
  <section class="view" id="v-creixement"></section>
  <!-- ── País ── -->
  <section class="view" id="v-pais"></section>
  <!-- ── Comparar ── -->
  <section class="view" id="v-comparar"></section>
  <!-- ── L'altra cara ── -->
  <section class="view" id="v-altra"></section>
  <!-- ── Immigració ── -->
  <section class="view" id="v-immigracio"></section>
  <!-- ── Pensions ── -->
  <section class="view" id="v-pensions"></section>
  <!-- ── Aprendre ── -->
  <section class="view" id="v-aprendre"></section>
</main>

<footer>
  <div class="wrap">
    <p id="fonts"></p>
    <p>Els anys ombrejats als gràfics són <b>previsions</b> de l'FMI, no dades reals. Les xifres de l'FMI es revisen dues vegades l'any (abril i octubre).
    Aquesta app no desa res a cap servidor.</p>
    <p>Versió <span id="ver"></span></p>
  </div>
</footer>

<script>
/* ── Configuració ───────────────────────────────────────────────────────────── */
const APP_VERSION = '1.11.1';
const BUILD_DATE = '2026-09-18';
const LS_THEME = 'economia_theme';
const LS_SEL = 'economia_sel';
const LS_BANKS = 'economia_banks';
const LS_PAIS = 'economia_pais';
const LS_DATA = 'economia_dades_v1';
const MAX_SEL = 6;
const DEFAULT_SEL = ['ESP', 'USA', 'DEU', 'CHN', 'JPN'];
const DEFAULT_BANKS = ['XM', 'US', 'GB', 'JP', 'CH'];

/* ── Helpers ────────────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? '–' : v.toLocaleString('ca-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? '–' : nf(v, d) + ' %';
const sgn = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + nf(v, d);
const money = v => v == null ? '–' : v >= 1000 ? nf(v / 1000, v >= 10000 ? 0 : 1) + ' bil. $' : nf(v, 0) + ' mil M $';
const int = v => v == null ? '–' : Math.round(v).toLocaleString('ca-ES');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lsGet = (k, def) => { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const pts = (c, k, from = 0, to = 9999) => Object.entries(ent(c)?.s[k] || {}).map(([a, v]) => [+a, v]).filter(([a]) => a >= from && a <= to);
const lastYear = (c, k, max = 9999) => { const ys = Object.keys(ent(c)?.s[k] || {}).map(Number).filter(a => a <= max); return ys.length ? Math.max(...ys) : null; };
const label = c => { const e = ent(c); return e ? `${e.flag} ${e.nom}` : c; };

// Preus acumulats: quant pugen els preus entre la mitjana de l'any a0 i la de l'any a1
function cumInfl(c, a0, a1) {
  let f = 1;
  for (let a = a0 + 1; a <= a1; a++) { const i = val(c, 'infl', a); if (i == null) return null; f *= 1 + i / 100; }
  return (f - 1) * 100;
}

function fixColors(list, map) {
  for (const k of Object.keys(map)) if (!list.includes(k)) delete map[k];
  for (const k of list) if (map[k] == null) {
    const used = new Set(Object.values(map));
    map[k] = [...Array(SLOTS).keys()].find(i => !used.has(i)) ?? 0;

}

/* ── Gràfic de línies (SVG propi, sense llibreries) ───────────────────────── */
function niceTicks(min, max, n = 5) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const t = [];
  for (let v = Math.floor(min / step) * step; v <= max + step * 0.001; v += step) t.push(+v.toFixed(10));
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + step);
  return t;
}
const monthX = s => +s.slice(0, 4) + (+s.slice(5, 7) - 1) / 12;
const MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
const monthLabel = x => { const y = Math.floor(x + 1e-6); return `${MESOS[Math.round((x - y) * 12)]} ${y}`; };

/**
 * o.series: [{name, color, pts:[[x,y]], dash}]
 * o.fmt: format dels valors · o.forecast: primer any de previsió · o.zero: inclou el 0
 * o.months: l'eix x són mesos (x decimal) · o.h: alçada
 */
function lineChart(host, o) {
  const W = Math.max(280, host.clientWidth || 600), H = o.h || (W < 500 ? 240 : 300);
  const narrow = W < 500;
  const labelsOn = o.series.length <= 4 && !narrow;
  const m = { t: 14, r: labelsOn ? 118 : 14, b: 26, l: 46 };
  const all = o.series.flatMap(s => s.pts);
  if (!all.length) { host.innerHTML = '<p class="muted">No hi ha dades per a aquesta selecció.</p>'; return; }
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (o.zero !== false) { y0 = Math.min(0, y0); y1 = Math.max(0, y1); }
  const yt = niceTicks(y0, y1, narrow ? 4 : 5);
  y0 = yt[0]; y1 = yt[yt.length - 1];
  const X = x => m.l + (x - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
  const Yp = y => m.t + (1 - (y - y0) / (y1 - y0 || 1)) * (H - m.t - m.b);
  const fmt = o.fmt || (v => nf(v));

  // eix x: anys rodons
  const span = x1 - x0, every = span > 24 ? 5 : span > 10 ? (narrow ? 5 : 2) : 1;
  const xt = [];
  for (let a = Math.ceil(x0); a <= Math.floor(x1); a++) if (a % every === 0) xt.push(a);

  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.title || 'Gràfic')}">`;
  if (o.forecast != null && o.forecast <= x1) {
    const fx = X(Math.max(x0, o.forecast - 0.5));
    s += `<rect class="fc" x="${fx}" y="${m.t}" width="${X(x1) - fx}" height="${H - m.t - m.b}"/>
      <text x="${fx + 4}" y="${m.t + 11}">previsió</text>`;
  }
  s += `<g class="grid">${yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Yp(v)}" y2="${Yp(v)}"/>`).join('')}</g>`;
  s += yt.map(v => `<text x="${m.l - 6}" y="${Yp(v) + 4}" text-anchor="end">${esc(o.tick ? o.tick(v) : nf(v, Math.abs(v) < 10 && v % 1 ? 1 : 0))}</text>`).join('');
  s += xt.map(a => `<text x="${X(a)}" y="${H - 6}" text-anchor="middle">${a}</text>`).join('');
  if (y0 < 0 && y1 > 0) s += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Yp(0)}" y2="${Yp(0)}"/>`;
  if (o.ref) s += `<line class="hl" x1="${m.l}" x2="${W - m.r}" y1="${Yp(o.ref.y)}" y2="${Yp(o.ref.y)}"/><text x="${m.l + 4}" y="${Yp(o.ref.y) - 4}">${esc(o.ref.label)}</text>`;

  for (const se of o.series) {
    if (!se.pts.length) continue;
    const d = se.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Yp(p[1]).toFixed(1)}`).join('');
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
  }
  // etiquetes directes al final de cada línia, separades perquè no se solapin
  if (labelsOn) {
    const ends = o.series.filter(se => se.pts.length).map(se => { const p = se.pts[se.pts.length - 1]; return { se, x: X(p[0]), y: Yp(p[1]) }; }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    for (const e of ends) s += `<text class="lbl" x="${e.x + 8}" y="${e.y + 4}">${esc(e.se.short || e.se.name)}</text>`;
  }
  s += `<line class="hl" id="hl" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" style="display:none"/>`;
  s += `<g id="dots"></g><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" class="hit"/></svg>`;

  const leg = o.series.length > 1 ? `<div class="legend">${o.series.map(se => `<span><i class="${se.dash ? 'dash' : ''}" style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>` : '';
  host.innerHTML = s + leg + '<div class="tip"></div>';

  // capa d'interacció: línia vertical + tooltip amb tots els valors d'aquell punt
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), hl = svg.querySelector('#hl'), dots = svg.querySelector('#dots');
  const xs = [...new Set(all.map(p => p[0]))].sort((a, b) => a - b);
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * W / r.width;
    const xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    let best = xs[0];
    for (const x of xs) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x;
    const rows = o.series.map(se => ({ se, p: se.pts.find(p => Math.abs(p[0] - best) < 1e-6) })).filter(r => r.p).sort((a, b) => b.p[1] - a.p[1]);
    if (!rows.length) return;
    hl.setAttribute('x1', X(best)); hl.setAttribute('x2', X(best)); hl.style.display = '';
    dots.innerHTML = rows.map(r => `<circle cx="${X(best)}" cy="${Yp(r.p[1])}" r="4.5" fill="${r.se.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
    const title = o.months ? monthLabel(best) : best + (o.forecast != null && best >= o.forecast ? ' · previsió' : '');
    tip.innerHTML = `<div class="t">${esc(title)}</div>` + rows.map(r => `<div class="r"><span><i class="sw" style="background:${r.se.color}"></i>${esc(r.se.name)}</span><b class="num">${esc(fmt(r.p[1]))}</b></div>`).join('');
    tip.style.display = 'block';
    const hx = X(best) * r.width / W;
    const left = hx + 14 + tip.offsetWidth > host.clientWidth ? hx - 14 - tip.offsetWidth : hx + 14;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '8px';
  };
  const out = () => { tip.style.display = 'none'; hl.style.display = 'none'; dots.innerHTML = ''; };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', out);
}

/* ── Barres horitzontals (HTML) ─────────────────────────────────────────────── */
// rows: [{c, name, v, color}] · o.fmt · o.me: codi a ressaltar · o.ref: {v, label}
function barsHTML(rows, o = {}) {
  rows = rows.filter(r => r.v != null);
  if (!rows.length) return '<p class="muted">Sense dades.</p>';
  const lo = Math.min(0, ...rows.map(r => r.v)), hi = Math.max(0, ...rows.map(r => r.v), o.ref?.v ?? 0);
  const P = v => (v - lo) / (hi - lo || 1) * 100;
  const fmt = o.fmt || (v => nf(v));
  return `<div class="bars">${rows.map(r => {
    const a = P(Math.min(0, r.v)), b = P(Math.max(0, r.v));
    const color = r.color || (r.v < 0 ? 'var(--neg)' : 'var(--pos)');
    return `<div class="bar ${r.c === o.me ? 'me' : ''}" title="${esc(r.name)}: ${esc(fmt(r.v))}">
      <span class="n">${esc(r.name)}</span>
      <span class="track">${lo < 0 ? `<span class="axis0" style="left:${P(0)}%"></span>` : ''}
        <span class="fill" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;background:${color}"></span>
        ${o.ref ? `<span class="ref" style="left:${P(o.ref.v)}%"></span>` : ''}</span>
      <span class="val">${esc(fmt(r.v))}</span></div>`;
  }).join('')}</div>${o.ref ? `<p class="muted" style="margin-top:6px">┆ La línia discontínua és ${esc(o.ref.label)}.</p>` : ''}`;
}

// Els gràfics SVG es dibuixen després d'inserir l'HTML (necessiten l'amplada real)
let pending = [];
const chart = (id, fn) => { pending.push([id, fn]); return `<div class="chart" id="${id}"></div>`; };
// Els gràfics dins d'un detall tancat es dibuixen quan s'obre (abans no tenen amplada)
function flushCharts() {
  const resten = [];
  for (const [id, fn] of pending) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.closest('details:not([open])')) resten.push([id, fn]); else fn(el);
  }
  pending = resten;
}

const VIEWS = { resum: renderResum, inici: renderInici, inflacio: renderInflacio, sous: renderSous, impostos: renderImpostos, deute: renderDeute, eua: renderEua, borsa: renderBorsa, tipus: renderTipus,
  creixement: renderCreixement, pais: renderPais, comparar: renderComparar, altra: renderAltra, immigracio: renderImmigracio, pensions: renderPensions, aprendre: renderAprendre };
function go(v) {
  if (!VIEWS[v]) v = 'resum';
  view = v;
  if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
  ultimVist[grupDe(v).id] = v; lsSet('economia_ultim', ultimVist);
  amagaTerme();
  renderView();
  document.querySelector(`#tabs button[data-v="${v}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });

}
function renderView() {
  if (!D) return;
  document.querySelectorAll('section.view').forEach(s => s.classList.remove('on'));
  const el = $('#v-' + view);
  pending = [];
  const sy = scrollY;
  renderNav();
  el.innerHTML = VIEWS[view]();
  if (PLEGA.has(view)) plega(el);
  if (view === 'resum') el.querySelector('.intro')?.insertAdjacentHTML('afterend', rutesHTML());
  afegeixRuta(el);
  glossaritza(el);
  el.classList.add('on');
  flushCharts();
  scrollTo({ top: sy });
}

addEventListener('resize', debounce(() => { if (innerWidth !== lastW) { lastW = innerWidth; renderView(); } }, 200));

/* ── Lectura en llenguatge planer ───────────────────────────────────────────── */
function levelInfl(v) {
  if (v == null) return '';
  if (v < 0) return '<span class="badge warn">↓ preus baixant</span>';
  if (v <= 2.5) return '<span class="badge good">✓ estable</span>';
  if (v <= 5) return '<span class="badge warn">▲ una mica alta</span>';
  return '<span class="badge bad">▲▲ alta</span>';
}
function levelDeute(v) {
  if (v == null) return '';
  if (v < 60) return '<span class="badge good">✓ moderat</span>';
  if (v < 100) return '<span class="badge warn">▲ elevat</span>';
  return '<span class="badge bad">▲▲ molt elevat</span>';
}
function levelAtur(v) {
  if (v == null) return '';
  if (v < 5) return '<span class="badge good">✓ baix</span>';
  if (v < 10) return '<span class="badge warn">▲ mitjà</span>';
  return '<span class="badge bad">▲▲ alt</span>';
}
function levelCreix(v) {
  if (v == null) return '';
  if (v < 0) return '<span class="badge bad">▼ en recessió</span>';
  if (v < 1) return '<span class="badge warn">≈ estancada</span>';
  return '<span class="badge good">▲ creix</span>';
}
const tile = (k, v, d, badge = '') => `<div class="tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="d">${d} ${badge}</div></div>`;

// Últim canvi del tipus oficial d'un banc central: {mes, de, a}
function lastChange(b) {
  const e = Object.entries(D.tipus?.[b] || {}).sort((x, y) => x[0] < y[0] ? -1 : 1);
  for (let i = e.length - 1; i > 0; i--) if (e[i][1] !== e[i - 1][1]) return { mes: e[i][0], de: e[i - 1][1], a: e[i][1] };
  return null;
}

}

/* ── 🧭 Resum: què ens espera ───────────────────────────────────────────────── */
// Conclusions calculades amb les dades (s'actualitzen soles) + context escrit a mà (porta data: RESUM_DATA).
const RESUM_DATA = '16 de setembre de 2026';
const artPct = (v, d = 1) => { const t = nf(v, d); return (/^(1|11|8\d*)(,|$)/.test(t) ? "l'" : 'el ') + t + ' %'; };
const SEM = { good: ['🟢', 'good'], warn: ['🟡', 'warn'], bad: ['🔴', 'bad'] };
const acum = (c, k, a0, a1) => { let f = 1; for (let a = a0 + 1; a <= a1; a++) { const v = val(c, k, a); if (v == null) return null; f *= 1 + v / 100; } return (f - 1) * 100; };

function semHTML(items) {
  return `<div class="sem">${items.map(i => `<a class="semi ${SEM[i.e][1]}" href="#${i.link}">
    <span class="semt">${SEM[i.e][0]} <b>${esc(i.t)}</b></span>
    <span class="sub">${i.txt}</span><span class="semv">Més detall →</span></a>`).join('')}</div>`;
}

// Fitxa curta d'un país o zona per a "La resta del món"
const CONTEXT = {
  USA: 'Deu més de 40 bilions de dòlars i té un dèficit enorme sense estar en crisi. Depèn que el món continuï comprant els seus bons, i cada cop li costen més.',
  EURO: 'Creixement feble. França, amb dèficit alt i inestabilitat política, ja paga tant com Itàlia per endeutar-se, i el BCE ja no compra deute com abans.',
  CHN: 'Creix menys que abans, amb preus gairebé plans (risc de deflació), la crisi immobiliària encara oberta i un deute públic que es dispara. És el país que més or ha comprat des del 2021, segons el que declara.',
  JPN: 'Té el deute més alt del món. El Banc del Japó en compra menys i el bo a 10 anys paga el màxim en 30 anys, cosa que pot fer tornar a casa diners japonesos invertits fora.',
  GBR: 'Creix poc i té més inflació que la zona euro. El 2022 el mercat de bons ja va castigar un pla fiscal sense finançar, i en fa por repetir-ho.',
  IND: 'És l\'economia gran que més creix, amb molta població jove. Però els interessos del deute ja són dels més alts del món.',
};
function fitxaPais(c, nom) {
  const cr = val(c, 'creix', Y), cr1 = val(c, 'creix', Y + 1), inf = val(c, 'infl', Y);
  const de = val(c, 'deute', Y), deF = val(c, 'deute', Y + 5), it = interessos(c, Y), b = bonUltim(c);
  const avis = [];
  if (cr != null && cr < 1) avis.push('economia gairebé aturada');
  else if (cr != null && cr < 1.5) avis.push('creixement feble');
  if (cr != null && cr >= 4) avis.push('continua creixent amb força');
  if (de != null && deF != null && deF - de >= 5) avis.push(`el deute seguirà pujant (${pct(deF, 0)} el ${Y + 5})`);
  if (de != null && deF != null && de - deF >= 5) avis.push(`el deute baixarà (${pct(deF, 0)} el ${Y + 5})`);
  if (it != null && it >= 3) avis.push('els interessos ja pesen molt');
  if (inf != null && inf < 1.5) avis.push('preus gairebé plans');
  const e = (it != null && it >= 3) || (de != null && deF != null && deF - de >= 10) ? 'bad' : (cr != null && cr < 1.5) || (de || 0) >= 100 ? 'warn' : 'good';
  return `<div class="card fitxa">
    <h3>${SEM[e][0]} ${esc(nom)}</h3>
    <div class="mini">
      <span>Creix <b>${sgn(cr)} %</b> <small>(${Y + 1}: ${sgn(cr1)} %)</small></span>
      <span>Inflació <b>${pct(inf)}</b></span>
      <span>Deute <b>${pct(de, 0)}</b></span>
      ${it != null ? `<span>Interessos <b>${pct(it)}</b> PIB</span>` : ''}
      ${b ? `<span>Bo 10 anys <b>${pct(b[1], 2)}</b></span>` : ''}
    </div>
    ${avis.length ? `<p class="sub"><b>${esc(avis[0][0].toUpperCase() + avis[0].slice(1))}</b>${avis.slice(1).map(a => ', ' + esc(a)).join('')}.</p>` : ''}
    <p class="sub">${esc(CONTEXT[c] || '')}</p>
  </div>`;
}

function renderResum() {
  const E = 'ESP', W = 'WEOWORLD';
  const v = k => val(E, k, Y);
  const cr = v('creix'), cr1 = val(E, 'creix', Y + 1), crEu = val('EURO', 'creix', Y);
  const at = v('atur'), atEu = val('EURO', 'atur', Y);
  const inf = v('infl'), preus = cumInfl(E, 2020, Y);
  const de = v('deute'), deF = val(E, 'deute', Y + 5);
  const it = interessos(E, Y), it21 = interessos(E, 2021);
  const A0 = 2019; // abans de la pandèmia: el 2020 el PIB es va enfonsar i qualsevol comparació hi surt inflada
  const pobA = val(E, 'pob', A0), pobB = v('pob');
  const creixAcum = acum(E, 'creix', A0, Y);
  const perCap = creixAcum != null && pobA && pobB ? ((1 + creixAcum / 100) / (pobB / pobA) - 1) * 100 : null;
  // habitatge vs sous (reals) des del 2015
  const H = D.altra?.habitatge?.[E]?.anual, SR = ent(E).s.souReal;
  const aH = H && SR ? Math.min(Math.max(...Object.keys(H).map(Number)), lastYear(E, 'souReal')) : null;
  const pis = aH ? (H[aH] / H[2015] - 1) * 100 : null, sou = aH ? (SR[aH] / SR[2015] - 1) * 100 : null;
  const esforc = pis != null ? ((1 + pis / 100) / (1 + sou / 100) - 1) * 100 : null;
  // impostos
  const T = D.fiscal?.impostos?.[E];
  const aT = T?.irpf ? Math.max(...Object.keys(T.irpf).map(Number)) : null;
  const irpfPuja = aT && T.irpf[2020] != null ? T.irpf[aT] - T.irpf[2020] : null;
  let netReal = null, brutReal = null;
  if (T?.net?.[2000] && T?.brut?.[2000] && aT) { const f = 1 + (cumInfl(E, 2000, aT) || 0) / 100; netReal = (T.net[aT] / T.net[2000] / f - 1) * 100; brutReal = (T.brut[aT] / T.brut[2000] / f - 1) * 100; }
  // deute: prima
  const de10 = D.fiscal?.bons?.DEU, es10 = D.fiscal?.bons?.ESP;
  const mesP = es10 && de10 ? Object.keys(es10).filter(k => de10[k] != null).sort().at(-1) : null;
  const prima = mesP ? (es10[mesP] - de10[mesP]) * 100 : null;
  // immigració
  const IM = D.immi?.eu?.ESP || {};
  const lastK = k => { const s = IM[k]; if (!s) return null; const a = Math.max(...Object.keys(s).map(Number)); return [a, s[a]]; };
  const fora = lastK('nascutsFora'), pobF = fora ? IM.pob?.[fora[0]] : null;
  const ord = lastK('ordres'), ret = ord ? IM.retorns?.[ord[0]] : null;
  const mig = lastK('migNeta');

  const semEsp = [
    { t: 'Creixement', link: 'creixement', e: cr >= 1.5 ? 'good' : cr >= 0.5 ? 'warn' : 'bad',
      txt: `Creix un ${pct(cr)} el ${Y} i un ${pct(cr1)} el ${Y + 1}, més que la zona euro (${pct(crEu)}). L'FMI no preveu cap recessió.` },
    { t: 'Creixement per habitant', link: 'creixement', e: perCap == null ? 'warn' : perCap >= (Y - A0) * 1.5 ? 'good' : perCap >= (Y - A0) * 0.5 ? 'warn' : 'bad',
      txt: perCap == null ? 'Sense dades.' : `Del ${A0} (abans de la pandèmia) al ${Y}, el PIB real creix un ${pct(creixAcum, 1)}, però la població també (+${nf(pobB - pobA, 1)} milions). Per habitant, un ${pct(perCap, 1)}: menys d'un ${nf(Math.ceil(perCap / (Y - A0)), 0)} % l'any.` },
    { t: 'Atur', link: 'creixement', e: at < 7 ? 'good' : at < 12 ? 'warn' : 'bad',
      txt: `${pct(at)} el ${Y}. Baixa, però continua sent dels més alts d'Europa (zona euro: ${pct(atEu)}).` },
    { t: 'Preus', link: 'inflacio', e: inf <= 2.5 && preus < 15 ? 'good' : inf <= 4 ? 'warn' : 'bad',
      txt: `Inflació del ${pct(inf)} el ${Y}, per sobre del 2 % per l'energia. Els preus ja són un ${pct(preus, 0)} més alts que el 2020, i no tornaran enrere.` },
    { t: 'Habitatge', link: 'altra', e: esforc == null ? 'warn' : esforc > 20 ? 'bad' : esforc > 5 ? 'warn' : 'good',
      txt: esforc == null ? 'Sense dades.' : `Del 2015 al ${aH}, els pisos pugen un ${pct(pis, 0)} per sobre de la inflació i els sous un ${pct(sou, 0)}. Comprar costa un ${pct(esforc, 0)} més d'anys de sou.` },
    { t: 'Impostos sobre el sou', link: 'impostos', e: irpfPuja == null ? 'warn' : irpfPuja > 1 ? 'bad' : irpfPuja > 0.3 ? 'warn' : 'good',
      txt: irpfPuja == null ? 'Sense dades.' : `L'IRPF d'un sou mitjà ha pujat ${nf(irpfPuja, 1)} punts des del 2020 sense tocar la llei. Des del 2000, el sou brut real ${sgn(brutReal, 1)} % i el net ${sgn(netReal, 1)} %.` },
    { t: 'Deute i interessos', link: 'deute', e: it >= 3 || de >= 110 ? 'bad' : de >= 60 ? 'warn' : 'good',
      txt: `Deute del ${pct(de, 0)} del PIB; l'FMI preveu que baixi al ${pct(deF, 0)} el ${Y + 5}. Els interessos ja són el ${pct(it)} del PIB (${pct(it21)} el 2021). Prima de risc: ${prima != null ? nf(prima, 0) + ' pb' : '–'}.` },
    { t: 'Immigració', link: 'immigracio', e: ret != null && ord && ret / ord[1] < 0.3 ? 'warn' : 'good',
      txt: fora ? `${(s => s[0].toUpperCase() + s.slice(1))(artPct(fora[1] / pobF * 100))} de la població ha nascut a fora i la migració neta és de ${sgn(mig?.[1])} per mil. Sosté el creixement i les cotitzacions, però pressiona l'habitatge. Només es compleix ${artPct(ret / ord[1] * 100, 0)} de les ordres d'expulsió.` : 'Sense dades.' },
    ...(() => {
      const dp = D.demo?.eu?.ESP; if (!dp?.depVell) return [];
      const ad = Math.max(...Object.keys(dp.depVell).map(Number)), d0 = dp.depVell[ad], d50 = dp.depVellProj?.[2050];
      return [{ t: 'Pensions', link: 'pensions', e: d50 && d50 - d0 > 15 ? 'bad' : 'warn',
        txt: `Avui hi ha ${nf(100 / d0, 1)} persones en edat de treballar per cada una de 65 anys o més; el 2050 n'hi haurà ${nf(100 / d50, 1)} (Eurostat). El sistema haurà de canviar.` }];
    })(),
    { t: 'Energia i Ormuz', link: 'inici', e: 'warn',
      txt: 'El petroli es paga a preu mundial, el compri qui el compri: si l\'estret d\'Ormuz continua inestable, la benzina, el transport i la inflació en patiran.' },
  ];

  const W1 = val(W, 'creix', Y), W2 = val(W, 'infl', Y), W3 = val(W, 'deute', Y), W4 = val(W, 'deute', Y + 5);
  const or = D.altra?.or, orCompra = or ? Object.values(or).reduce((s, x) => s + ((x[2025] ?? 0) - (x[2021] ?? x[2025] ?? 0)), 0) : null;

  return `
  <div class="intro">
    <h2>🧭 Què ens espera?</h2>
    <p class="sub">Un resum de tot el que hi ha a l'app, en dos minuts. Hi ha el que diuen les <b>dades oficials</b> (FMI, OCDE, BCE, Eurostat…) i el que
    <b>no surt als titulars</b>. Toca qualsevol punt per veure'n el detall.</p>
    <p class="muted">Les xifres s'actualitzen soles cada mes. Els textos de context són de ${RESUM_DATA}. És una interpretació de les dades, no una predicció segura ni un consell d'inversió.</p>
  </div>

  <div class="card">
    <h3>🇪🇸 Espanya</h3>
    <div class="callout">
      <b>En una frase:</b> Espanya creix més que els seus veïns i té menys deute públic que França o Itàlia, però aquest creixement ve sobretot de tenir
      <b>més habitants</b>, i la majoria de la gent <b>no el nota a la butxaca</b>: el pis, la inflació acumulada i els impostos se'n mengen gairebé tota la millora.
    </div>
    ${semEsp.length ? semHTML(semEsp) : ''}
    <div class="grid g2" style="margin-top:14px">
      <div>
        <b>📰 La lectura oficial</b>
        <p class="sub">• Una de les economies grans de la zona euro que més creix.</p>
        <p class="sub">• L'atur i el deute baixen a poc a poc, i l'FMI preveu que la inflació torni a baixar el ${Y + 1} (${pct(val(E, 'infl', Y + 1))}).</p>
        <p class="sub">• La prima de risc és baixa: els inversors es fien d'Espanya més que de França o Itàlia.</p>
        <p class="sub">• La immigració aporta treballadors i cotitzacions en un país que envelleix.</p>
      </div>
      <div>
        <b>🔍 La lectura crítica</b>
        <p class="sub">• Per habitant, el creixement és molt més modest que el total.</p>
        <p class="sub">• Els pisos s'han allunyat dels sous, i els joves ho noten més que ningú.</p>
        <p class="sub">• La progressivitat en fred és una pujada d'impostos que no es vota.</p>
        <p class="sub">• Els interessos del deute tornen a créixer, i els paguem amb impostos.</p>
        <p class="sub">• L'atur continua molt per sobre de la mitjana europea, i el control de la immigració irregular és feble.</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>🌐 La resta del món</h3>
    <p class="sub">Les grans economies, en una fitxa. 🟢 sense alarmes, 🟡 per vigilar, 🔴 riscos clars.</p>
    <div class="grid fitxes">
      ${fitxaPais('USA', '🇺🇸 Estats Units')}
      ${fitxaPais('EURO', '🇪🇺 Zona euro')}
      ${fitxaPais('CHN', '🇨🇳 Xina')}
      ${fitxaPais('JPN', '🇯🇵 Japó')}
      ${fitxaPais('GBR', '🇬🇧 Regne Unit')}
      ${fitxaPais('IND', '🇮🇳 Índia')}
    </div>
    <p class="muted">Pots veure qualsevol altre país a la <a href="#pais">fitxa de país</a> o a la <a href="#comparar">taula comparativa</a>.</p>
  </div>

  <div class="card">
    <h3>🌍 El món</h3>
    <div class="tiles">
      ${tile('Creixement mundial', pct(W1), `${Y}, previsió FMI`, levelCreix(W1))}
      ${tile('Inflació mundial', pct(W2), 'torna a pujar per l\'energia', levelInfl(W2))}
      ${tile('Deute públic mundial', pct(W3, 0), `del PIB; ${pct(W4, 0)} el ${Y + 5}`, levelDeute(W4))}
      ${orCompra ? tile('Or comprat pels bancs centrals', '+' + int(orCompra) + ' t', 'del 2021 al 2025 (els que ho declaren)') : ''}
    </div>
    <p><b>Les cinc grans tendències</b></p>
    <p class="sub">1. <b>Deute rècord i cada cop més car.</b> Els estats deuen més que mai i, sense bancs centrals que comprin bons, han de pagar més interessos. <a href="#deute">Deute →</a> · <a href="#eua">Deute dels EUA →</a></p>
    <p class="sub">2. <b>Energia i geopolítica.</b> La crisi d'Ormuz ha tornat a encarir el petroli i frena la baixada de la inflació. <a href="#inici">Actualitat →</a></p>
    <p class="sub">3. <b>Desconfiança en el sistema.</b> Els bancs centrals compren or com mai des de les sancions a Rússia, per no dependre del dòlar. <a href="#altra">L'altra cara →</a></p>
    <p class="sub">4. <b>Actius cars, sous que no els segueixen.</b> Anys de diners fàcils han pujat pisos i borsa; qui només té el sou s'ha quedat enrere. <a href="#altra">L'altra cara →</a> · <a href="#borsa">Borsa →</a></p>
    <p class="sub">5. <b>Envelliment i migració.</b> Els països rics necessiten treballadors, i la immigració és alhora una solució i una font de tensió. <a href="#immigracio">Immigració →</a></p>

    <p style="margin-top:14px"><b>Tres escenaris per als pròxims anys</b></p>
    <div class="grid g3">
      <div class="esc good"><b>🟢 Favorable</b><p class="sub">Ormuz es normalitza, el petroli baixa, la inflació torna al 2 % i els bancs centrals abaixen tipus. Hipoteques més barates i els sous reals remunten.</p></div>
      <div class="esc warn"><b>🟡 El més probable (FMI)</b><p class="sub">Creixement mundial al voltant del 3 %, inflació que baixa a poc a poc i deute que continua pujant. Tipus que no tornen a zero: diners més cars durant anys.</p></div>
      <div class="esc bad"><b>🔴 Advers</b><p class="sub">Petroli car durant mesos i un ensurt als mercats de deute (Japó, França o EUA). Tipus a llarg termini que es disparen, estats que retallen i hipoteques més cares.</p></div>
    </div>
  </div>

  <div class="card">
    <h3>👀 Què convé vigilar els pròxims mesos</h3>
    <div class="grid g2">
      <p class="sub">• <b>El preu del petroli i l'estret d'Ormuz</b>, per la inflació i la benzina.</p>
      <p class="sub">• <b>El BCE</b>: si torna a pujar tipus, l'euríbor i les hipoteques ho notaran. <a href="#tipus">Tipus →</a></p>
      <p class="sub">• <b>La prima de risc de França i Itàlia</b>: si es dispara, arrossega la resta de la zona euro. <a href="#deute">Deute →</a></p>
      <p class="sub">• <b>Els bons del Japó i dels EUA</b>, que marquen el preu dels diners a tot el món.</p>
      <p class="sub">• <b>Les previsions de l'FMI d'octubre</b>, que l'app agafarà sola al novembre.</p>
      <p class="sub">• <b>Si s'actualitzen els trams de l'IRPF</b> als pressupostos. <a href="#impostos">Impostos →</a></p>
    </div>
  </div>`;
}

function renderInici() {
  const W = 'WEOWORLD';
  const top = countries().slice(0, 15);
  const alts = countries().filter(c => (val(c, 'deute', Y) || 0) >= 100);
  const inflMax = Math.max(...pts(W, 'infl', 2015, Y).map(p => p[1]));
  const anyMax = pts(W, 'infl', 2015, Y).find(p => p[1] === inflMax)?.[0];
  const pibTop = top.reduce((s, c) => s + (val(c, 'quota', Y) || 0), 0);
  const inflPuja = val(W, 'infl', Y) > val(W, 'infl', Y - 1);
  const bce = lastChange('XM');
  return `
  <div class="intro">
    <h2>Com va el món el ${Y}?</h2>
    <p class="sub">Les xifres principals de l'economia mundial, amb les dades de l'FMI. Toca qualsevol pestanya per aprofundir-hi.

  ${actualitatHTML()}

  <div class="grid g2">
    <div class="card">
      <h3>Les economies més grans</h3>
      <p class="sub">PIB del ${Y} en dòlars. Aquests 15 països fan el ${nf(pibTop, 0)} % de l'economia mundial (comptant en paritat de poder adquisitiu).</p>
      ${barsHTML(top.map(c => ({ c, name: label(c), v: val(c, 'pib', Y) })), { fmt: money, me: 'ESP' })}

    <div class="card">
      <h3>Inflació: la pujada de preus al món</h3>

      ${chart('c-home-infl', el => lineChart(el, { title: 'Inflació', forecast: Y, fmt: v => pct(v),
        series: [['WEOWORLD', 1], ['ADVEC', 0], ['OEMDC', 2]].map(([c, i]) => ({ name: ent(c).nom, color: `var(--s${i + 1})`, pts: pts(c, 'infl', 2000) })) }))}
    </div>
  </div>

  <div class="card">
    <h3>Tres coses per entendre el moment actual</h3>
    <div class="grid g3" style="margin-top:10px">
      <div class="concept"><div class="emo">🛒</div><b>${inflPuja ? 'Els preus tornen a pujar més de pressa' : 'Els preus ja no pugen tan de pressa…'}</b>
        <p class="sub">${inflPuja ? `L'FMI preveu un ${pct(val(W, 'infl', Y))} d'inflació mundial el ${Y}, més que el ${Y - 1} (${pct(val(W, 'infl', Y - 1))}), sobretot per l'energia.` : '…però no han baixat.'}
        El que va pujar el 2021-2023 no ha tornat enrere; per això molta gent nota que tot és més car.
        <a href="#inflacio">Mira-ho →</a></p></div>
      <div class="concept"><div class="emo">🏦</div><b>Els estats deuen més que mai</b>
        <p class="sub">${alts.length} dels ${countries().length} països d'aquesta app deuen més del 100 % del que produeixen en un any, entre ells ${alts.slice(0, 4).map(c => esc(ent(c).nom)).join(', ')}.
        <a href="#deute">Mira-ho →</a></p></div>
      <div class="concept"><div class="emo">📈</div><b>Els diners tornen a tenir preu</b>
        <p class="sub">Del 2022 al 2023 els bancs centrals van pujar els tipus d'interès per frenar la inflació i després els van abaixar.
        ${bce ? `L'últim moviment del BCE va ser ${bce.a > bce.de ? 'una <b>pujada</b>' : 'una baixada'}: el ${monthLabel(monthX(bce.mes))}, del ${pct(bce.de, 2)} al ${pct(bce.a, 2)}.` : ''}
        <a href="#tipus">Mira-ho →</a></p></div>
    </div>
  </div>`;
}

/* ── 🛒 Inflació ────────────────────────────────────────────────────────────── */
// La inflació acumulada, traduïda a diners: la compra del mes, el sou i els estalvis.
let calc = lsGet('economia_calc2', { c: 'ESP', a0: 2015, a1: Y - 1, q: 100, m: 2000 });
function setCalc(k, v) { calc[k] = k === 'c' ? v : +v; lsSet('economia_calc2', calc); renderView(); }
const SIMBOLS = { EUR: '€', USD: '$', GBP: '£', JPY: '¥', CHF: 'CHF', SEK: 'kr', NOK: 'kr', DKK: 'kr', PLN: 'zł', CAD: '$', AUD: '$' };
function simbol(c) { const m = ent(c)?.moneda || (c === 'EURO' || c === 'EU' ? 'EUR' : ''); return SIMBOLS[m] || m || ''; }
const diners = (v, c, d = 0) => v == null ? '–' : nf(v, d) + (simbol(c) ? ' ' + simbol(c) : '');
// anys amb dada d'inflació per al país triat
const anysInfl = c => Object.keys(ent(c)?.s.infl || {}).map(Number).filter(a => a <= Y).sort((a, b) => a - b);
const anysCalc = () => { const a = [...anysInfl(calc.c)]; return { a0: Math.min(calc.a0, calc.a1), a1: Math.max(calc.a0, calc.a1), anys: a }; };

// Els tres efectes concrets de la inflació acumulada: compra, sou i estalvis.
function butxacaHTML() {
  const c = calc.c, { a0, a1, anys } = anysCalc();
  const cr = cumInfl(c, a0, a1);
  const opc = (k, sel0) => anys.map(a => `<option ${a === sel0 ? 'selected' : ''}>${a}</option>`).join('');
  const tria = `
    <div class="calc">
      <select onchange="setCalc('c', this.value)" aria-label="País">${[...Object.keys(D.grups), ...countries()].map(c2 => `<option value="${c2}" ${c2 === c ? 'selected' : ''}>${esc(label(c2))}</option>`).join('')}</select>
      <span>de l'any</span>
      <select onchange="setCalc('a0', this.value)" aria-label="Any inicial">${opc('a0', calc.a0)}</select>
      <span>fins al</span>
      <select onchange="setCalc('a1', this.value)" aria-label="Any final">${opc('a1', calc.a1)}</select>
    </div>`;
  if (cr == null) return `<div class="card sempre"><h3>🧺 Com es nota a la butxaca</h3>${tria}<p class="muted">No hi ha dades d'inflació per a tots aquests anys.</p></div>`;
  // els grups (món, avançades, emergents) barregen monedes: en diners no vol dir res
  if (!simbol(c)) return `<div class="card sempre"><h3>🧺 Com es nota a la butxaca</h3>${tria}
    <p class="sub"><b>${esc(ent(c).nom)}</b>: els preus han pujat un <b>${pct(cr, 1)}</b> acumulat entre el ${a0} i el ${a1}, però és una mitjana de molts països amb monedes diferents.
    <b>Tria un país</b> aquí sobre per veure què vol dir això a la compra, al sou i als estalvis.</p></div>`;
  const f = 1 + cr / 100;                                   // els preus s'han multiplicat per això
  const m = Math.max(1, calc.m || 0);                       // despesa d'avui, a mes
  const abans = m / f, mesMes = m - abans;
  const sou0 = val(c, 'souNom', a0), sou1 = val(c, 'souNom', a1);
  const souCal = sou0 == null ? null : sou0 * f;            // sou que caldria per empatar amb els preus
  const souDif = souCal == null || sou1 == null ? null : sou1 - souCal;
  const est = 10000, estAra = est / f;
  return `
  <div class="card sempre">
    <h3>🧺 Com es nota a la butxaca</h3>
    <p class="sub">Els preus <b>${esc(deNom(ent(c).nom))}</b> han pujat un <b>${pct(cr, 1)}</b> acumulat entre el ${a0} i el ${a1}.
    Això, traduït a diners, vol dir tres coses:</p>
    ${tria}
    <div class="grid g3" style="margin-top:12px">
      <div class="callout">
        <b>🛒 La compra i les factures</b>
        <div class="calc" style="margin:6px 0">
          <span>Si avui gastes</span>
          <input type="number" value="${m}" min="1" step="50" style="width:110px" onchange="setCalc('m', this.value)" aria-label="Despesa mensual">
          <span>${esc(simbol(c))} al mes</span>
        </div>
        <p class="sub">El ${a0} el mateix et costava <b class="num">${diners(abans, c)}</b>.
        Pagues <b class="num">${diners(mesMes, c)} més cada mes</b>, és a dir <b class="num">${diners(mesMes * 12, c)} més cada any</b>, per viure igual.</p>
      </div>
      <div class="callout">
        <b>💶 El sou que caldria</b>
        ${sou0 == null || sou1 == null ? '<p class="sub">No hi ha dades de sous de l\'OCDE per a aquest país o aquests anys.</p>' : `
        <p class="sub">El sou mitjà del ${a0} era <b class="num">${diners(sou0, c)}</b> l'any. Per comprar el mateix el ${a1} hauria de ser
        <b class="num">${diners(souCal, c)}</b>, i de fet és <b class="num">${diners(sou1, c)}</b>:
        <b class="num">${diners(Math.abs(souDif), c)} ${souDif >= 0 ? 'per sobre' : 'per sota'}</b> del que faria falta.</p>
        ${souDif >= 0 ? '<span class="badge good">▲ el sou ha guanyat la cursa</span>' : '<span class="badge bad">▼ el sou s\'ha quedat enrere</span>'}`}
      </div>
      <div class="callout">
        <b>🏦 Els estalvis parats</b>
        <p class="sub">${diners(est, c)} guardats al calaix (o en un compte sense interessos) el ${a0} avui compren el que aleshores valia
        <b class="num">${diners(estAra, c)}</b>: la inflació se n'ha menjat <b class="num">${diners(est - estAra, c)}</b>, un ${pct((1 - 1 / f) * 100, 0)} del seu valor.</p>
      </div>
    </div>
    <p class="muted">L'IPC és una mitjana de tot el que compra el conjunt del país. Si al teu pressupost hi pesen molt el lloguer, la llum o el menjar
    —que han pujat més que la mitjana— la teva inflació real és més alta. Els sous són el sou mitjà a temps complet de l'OCDE, abans d'impostos:
    el que et queda net depèn també de l'<a href="#impostos">IRPF i les cotitzacions</a>.${a1 >= Y ? ` Compte: el ${Y} i endavant són previsió de l'FMI.` : ''}</p>
  </div>`;
}

function renderInflacio() {
  const { a0, a1 } = anysCalc();
  const rows = [...sel].map(c => ({ c, name: label(c), v: cumInfl(c, a0, a1), color: col(c) })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const big = sel.some(c => pts(c, 'infl', 2000).some(p => p[1] > 30));
  const cr = cumInfl(calc.c, a0, a1);
  const yrs = anysInfl(calc.c);
  return `
  <div class="intro">
    <h2>🛒 Inflació: per què tot és més car</h2>
    <p class="sub">La <b>inflació</b> és el percentatge que pugen els preus en un any. Sembla poca cosa, però s'acumula: any rere any es va menjant
    el que pots comprar amb els mateixos diners. Aquí ho veus en euros, no en percentatges.</p>
  </div>
  ${cr == null ? '' : `<div class="tiles">
    ${tile(`Preus des del ${a0}`, '+' + pct(cr, 1), `${esc(ent(calc.c).nom)}, acumulat fins al ${a1}`)}
    ${tile(`${diners(100, calc.c)} del ${a0}`, diners(100 / (1 + cr / 100), calc.c, 0), `és el que compren avui`, '<span class="badge bad">▼ poder de compra</span>')}
    ${(() => { const s0 = val(calc.c, 'souNom', a0), s1 = val(calc.c, 'souNom', a1);
      if (s0 == null || s1 == null) return tile('Objectiu dels bancs centrals', '2 %', 'inflació anual considerada sana');
      const w = (s1 / s0 - 1) * 100;
      return tile(`Sou mitjà des del ${a0}`, sgn(w, 1) + ' %', 'en diners, abans d\'impostos',
        w >= cr ? '<span class="badge good">▲ per sobre dels preus</span>' : '<span class="badge bad">▼ per sota dels preus</span>'); })()}
  </div>`}
  ${butxacaHTML()}
  <div class="card">
    <h3>Inflació anual per país</h3>
    <p class="sub">Tria fins a ${MAX_SEL} països o zones per comparar.</p>
    ${chipsHTML()}
    ${big ? '<p class="muted">⚠️ Algun país seleccionat té inflacions molt altes i estira l\'escala: treu-lo per veure millor la resta.</p>' : ''}
    ${chart('c-infl', el => lineChart(el, { title: 'Inflació anual', forecast: Y, fmt: v => pct(v), ref: { y: 2, label: 'objectiu 2 %' },
      series: sel.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: pts(c, 'infl', 2000) })) }))}
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Quant han pujat els preus del ${a0} al ${a1}</h3>
      <p class="sub">Pujada acumulada de tots aquests anys junts. És el que costa de més avui el mateix carro de la compra.
      Canvia els anys a la targeta de dalt.</p>
      ${rows.length ? barsHTML(rows, { fmt: v => '+' + pct(v, 0) }) : '<p class="muted">Cap país seleccionat té dades per a tots aquests anys.</p>'}
    </div>
    <div class="card">
      <h3>🧮 Calculadora: què valen els teus diners?</h3>
      <p class="sub">Quants diners necessites avui per comprar el mateix que abans.</p>
      <div class="calc">
        <input type="number" value="${calc.q}" min="1" style="width:110px" onchange="setCalc('q', this.value)" aria-label="Quantitat">
        <span>${esc(simbol(calc.c))} de l'any</span>
        <select onchange="setCalc('a0', this.value)" aria-label="Any inicial">${yrs.map(a => `<option ${a === calc.a0 ? 'selected' : ''}>${a}</option>`).join('')}</select>
        <span>equivalen a l'any</span>
        <select onchange="setCalc('a1', this.value)" aria-label="Any final">${yrs.map(a => `<option ${a === calc.a1 ? 'selected' : ''}>${a}</option>`).join('')}</select>
      </div>
      <div class="callout" style="margin-top:12px">
        ${cr == null ? 'No hi ha dades per a tots aquests anys.' : `<div class="res num">${diners(calc.q * (1 + cr / 100) ** (calc.a1 >= calc.a0 ? 1 : -1), calc.c, 2)}</div>
        <div class="sub">Els preus ${calc.a1 >= calc.a0 ? 'han pujat' : 'eren'} un ${pct(cr)} ${calc.a1 >= calc.a0 ? '' : 'més baixos'}. ${calc.a1 >= calc.a0 ? `Amb els mateixos ${diners(calc.q, calc.c)} d'abans ara només compres el que abans valia ${diners(calc.q / (1 + cr / 100), calc.c, 2)}.` : ''}</div>`}
      </div>
      <p class="muted">Calculat amb la inflació mitjana anual de l'FMI. Els anys a partir del ${Y} són previsió.</p>
    </div>
  </div>
  <div class="callout">⚠️ El ${Y} la crisi de l'estret d'Ormuz ha tornat a encarir el petroli. Les previsions de l'FMI que es veuen aquí encara no recullen el rebrot de l'estiu. <a href="#inici">Més informació →</a></div>
  <div class="card">
    <h3>Per què va pujar tant el 2022?</h3>
    <div class="flow">
      <div class="step"><b>1. Pandèmia</b>Les fàbriques tanquen i falten peces i contenidors.</div><div class="arr">→</div>
      <div class="step"><b>2. Reobertura</b>Tothom torna a comprar alhora, amb estalvis i ajudes.</div><div class="arr">→</div>
      <div class="step"><b>3. Guerra d'Ucraïna</b>Gas, petroli i cereals es disparen.</div><div class="arr">→</div>
      <div class="step"><b>4. Contagi</b>L'energia encareix el transport i tota la resta de productes.</div>
    </div>
    ${petita(LP.ipc())}
    <p class="sub" style="margin-top:8px">La inflació de 2022 no va ser només "massa diners": va ser una barreja de menys oferta, més demanda i energia cara. Per frenar-la, els bancs centrals van pujar els <a href="#tipus">tipus d'interès</a>.</p>
  </div>`;
}

/* ── 💶 Sous ────────────────────────────────────────────────────────────────── */
function renderSous() {
  const has = c => !isGroup(c) && ent(c).s.souReal;
  const base = 2000;
  const selW = sel.filter(has);
  const idx = c => { const s = ent(c).s.souReal, b = s[base] ?? s[Object.keys(s)[0]]; return Object.entries(s).map(([a, v]) => [+a, v / b * 100]); };
  const ocde = countries().filter(has);
  const lastW = c => lastYear(c, 'souNom');
  // Sous vs preus 2020 → últim any amb dada de sou
  const comp = c => {
    const a1 = lastW(c); if (!a1 || !val(c, 'souNom', 2020)) return null;
    const w = (val(c, 'souNom', a1) / val(c, 'souNom', 2020) - 1) * 100, p = cumInfl(c, 2020, a1);
    // el poder adquisitiu surt del sou real de l'OCDE (deflactat amb els preus del consum privat),
    // no de restar la inflació de l'FMI: així coincideix amb el gràfic del sou real
    const r0 = val(c, 'souReal', 2020), r1 = val(c, 'souReal', a1);
    return p == null || !r0 || !r1 ? null : { w, p, real: (r1 / r0 - 1) * 100, a1 };
  };
  const reals = ocde.map(c => ({ c, name: label(c), v: comp(c)?.real })).sort((a, b) => b.v - a.v);
  const guany = reals.filter(r => r.v > 0).length;
  const me = selW[0] || 'ESP', mc = comp(me);
  return `
  <div class="intro">
    <h2>💶 Sous: guanyem o perdem poder adquisitiu?</h2>
    <p class="sub">Que et pugin el sou no vol dir que visquis millor: si els preus pugen més, a final de mes et queda menys.
    Això és el <b>sou real</b>: el sou descomptant la inflació. Dades de l'OCDE (${ocde.length} països; la Xina, l'Índia o el Brasil no hi són).</p>
  </div>
  ${mc ? `<div class="tiles">
    ${tile(`${esc(label(me))}: sous ${mc.a1} vs 2020`, sgn(mc.w, 1) + ' %', 'pujada del sou mitjà en diners')}
    ${tile('Preus en el mateix període', sgn(mc.p, 1) + ' %', 'inflació acumulada')}
    ${tile('Poder adquisitiu', sgn(mc.real, 1) + ' %', mc.real >= 0 ? 'el sou compra més coses' : 'el sou compra menys coses',
      mc.real >= 0 ? '<span class="badge good">▲ guany</span>' : '<span class="badge bad">▼ pèrdua</span>')}
  </div>` : ''}
  <div class="card">
    <h3>Evolució del sou real (${base} = 100)</h3>
    <p class="sub">Si la línia puja, el sou mitjà compra més coses que el ${base}. Si està per sota de 100, compra menys.</p>
    ${chipsHTML(has)}
    ${selW.length ? chart('c-sous', el => lineChart(el, { title: 'Sou real', zero: false, fmt: v => nf(v), ref: { y: 100, label: 'nivell del ' + base },
      series: selW.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: idx(c) })) }))
      : '<p class="muted">Cap dels països seleccionats té dades de sous a l\'OCDE. Tria\'n algun de la llista.</p>'}
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Guanys i pèrdues des del 2020</h3>
      <p class="sub">Variació del poder adquisitiu del sou mitjà del 2020 a l'últim any disponible. En ${guany} de ${reals.filter(r => r.v != null).length} països els sous ja han superat la inflació.</p>
      ${barsHTML(reals, { fmt: v => sgn(v) + ' %', me })}
    </div>
    <div class="card">
      <h3>Qui cobra més? (sou mitjà anual ${lastYear('USA', 'souReal')})</h3>
      <p class="sub">En dòlars ajustats pel cost de vida de cada país (PPA), perquè sigui comparable.</p>
      ${barsHTML(ocde.map(c => ({ c, name: label(c), v: val(c, 'souReal', lastYear(c, 'souReal')) })).sort((a, b) => b.v - a.v), { fmt: v => int(v) + ' $', me })}
    </div>
  </div>
  <p class="muted">L'OCDE calcula el sou real amb els preus del consum privat, no exactament amb l'IPC. Per això el poder adquisitiu no sempre és
  exactament la pujada del sou menys la inflació de l'FMI que es mostra al costat.
  El sou mitjà inclou tots els assalariats a temps complet equivalent.</p>
  ${petita(LP.sous())}`;
}

/* ── 💸 El preu del deute ───────────────────────────────────────────────────── */
// Rendiment del bo a 10 anys (OCDE, mensual), prima de risc i interessos pagats (FMI).
const EURO_PAISOS = ['DEU', 'FRA', 'ITA', 'ESP', 'NLD', 'BEL', 'AUT', 'PRT', 'GRC', 'IRL'];
const bons = c => D.fiscal?.bons?.[c];
const bonsPts = c => Object.entries(bons(c) || {}).map(([k, v]) => [monthX(k), v]).sort((a, b) => a[0] - b[0]);
const bonUltim = c => { const e = Object.entries(bons(c) || {}).sort((a, b) => a[0] < b[0] ? -1 : 1); return e.at(-1); };
// "de" + nom amb apòstrof quan cal (d'Espanya, d'Itàlia, de França)
const deNom = n => (/^[aeiouàèéíòóúh]/i.test(n) ? "d'" : 'de ') + n;
const interessos = (c, a) => { const pr = val(c, 'primari', a), s = val(c, 'deficit', a); return pr != null && s != null ? pr - s : null; };

function costDeuteHTML(p) {
  if (!D.fiscal?.bons) return '';
  const de = bonUltim('DEU');
  // la prima es calcula amb el mateix mes per als dos països (l'últim que tinguin tots dos)
  const prima = EURO_PAISOS.filter(c => c !== 'DEU' && bons(c)).map(c => {
    const mes = Object.keys(bons(c)).filter(k => bons('DEU')?.[k] != null).sort().at(-1);
    return { c, name: label(c), v: mes ? (bons(c)[mes] - bons('DEU')[mes]) * 100 : null, mes };
  })
    .filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const fr = prima.find(r => r.c === 'FRA'), it = prima.find(r => r.c === 'ITA'), es = prima.find(r => r.c === 'ESP');
  const selB = sel.filter(c => bons(c));
  const ints = countries().map(c => ({ c, name: label(c), v: interessos(c, Y) })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const ip = interessos(p, Y), dp = val(p, 'deute', Y);
  return `
  <div class="card">
    <h3>💸 Quant costa el deute?</h3>
    <p class="sub">Els estats es financen venent <b>bons</b>. El que paguen per un bo a 10 anys és el termòmetre de la confiança: si els inversors
    tenen dubtes, demanen més interès. Aquest preu acaba als impostos, a les hipoteques i al que queda per a sanitat i pensions.</p>
    <div class="tiles">
      ${de ? tile('🇩🇪 Alemanya (referència)', pct(de[1], 2), `bo a 10 anys, ${monthLabel(monthX(de[0]))}`) : ''}
      ${es ? tile('🇪🇸 Prima de risc d\'Espanya', nf(es.v, 0) + ' pb', 'punts bàsics per sobre d\'Alemanya') : ''}
      ${fr && it ? tile('🇫🇷 França vs 🇮🇹 Itàlia', `${nf(fr.v, 0)} / ${nf(it.v, 0)} pb`, fr.v >= it.v ? 'França ja paga tant o més que Itàlia' : 'Itàlia encara paga més que França',
        fr.v >= it.v ? '<span class="badge bad">⚠ canvi de rol</span>' : '') : ''}
      ${ip != null ? tile(`Interessos ${esc(deNom(ent(p).nom))} ${Y}`, pct(ip), `del PIB, amb un deute del ${pct(dp, 0)}`) : ''}
    </div>
    <h3>Rendiment del bo a 10 anys</h3>
    <p class="sub">Mitjana mensual. Es veuen la crisi de l'euro (2011-2012), els tipus gairebé a zero (2015-2021) i la pujada des del 2022.</p>
    ${chipsHTML(c => !!bons(c))}
    ${chart('c-bons', el => lineChart(el, { title: 'Bons a 10 anys', months: true, fmt: v => pct(v, 2), tick: v => v + ' %',
      series: selB.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: bonsPts(c) })) }))}
    <div class="grid g2" style="margin-top:14px">
      <div>
        <h3>Prima de risc a la zona euro</h3>
        <p class="sub">Diferència amb el bo alemany el mateix mes, en punts bàsics (100 pb = 1 %). Últim mes disponible de cada país.</p>
        ${barsHTML(prima, { fmt: v => nf(v, 0) + ' pb', me: p })}
      </div>
      <div>
        <h3>Interessos pagats en % del PIB (${Y})</h3>
        <p class="sub">Interessos nets del deute públic, previsió de l'FMI.${val(p, 'pib', Y) ? ` A ${esc(ent(p).nom)}, cada 1 % del PIB són uns ${int(val(p, 'pib', Y) * 10)} milions de dòlars l'any.` : ''}</p>
        ${barsHTML(ints, { fmt: v => pct(v), me: p })}
      </div>
    </div>
    <h3 style="margin-top:14px">Evolució dels interessos</h3>
    <p class="sub">% del PIB. Com que el deute vell es va renovant a tipus nous més alts, aquesta factura puja a poc a poc durant anys.</p>
    ${chart('c-ints', el => lineChart(el, { title: 'Interessos del deute', forecast: Y, fmt: v => pct(v),
      series: sel.filter(c => ent(c).s.primari).map(c => ({ name: label(c), short: ent(c).nom, color: col(c),
        pts: Object.keys(ent(c).s.primari).map(Number).map(a => [a, interessos(c, a)]).filter(x => x[1] != null) })) }))}
    <div class="callout" style="margin-top:12px">
      <b>Per què importa si "sempre hi ha algú que compra"?</b>
      <p class="sub">Durant anys el BCE i el Banc del Japó compraven bons sense discutir el preu. Ara ja no ho fan, i els estats han de convèncer
      inversors privats, que demanen més interès, sobretot si el dèficit no baixa o la política és inestable. Un estat pot ser <b>solvent</b>

/* ── 🔧 Productivitat: treballem més hores o produïm més en cada hora? ─────────── */
// Dades d'Eurostat, només països europeus. Identitat comptable, no opinió:
//   PIB = hores treballades × producció per hora    i    hores = població × hores per habitant
const PRODE = () => D.prod?.eu || {};
const teProd = c => !!(PRODE()[c]?.pibReal && PRODE()[c]?.hores);
const prodUltim = c => { const e = PRODE()[c]; if (!e) return null; const a = Object.keys(e.hores || {}).map(Number).filter(x => e.pibReal?.[x]); return a.length ? Math.max(...a) : null; };
const perHora = (c, a) => { const e = PRODE()[c]; return e?.pibReal?.[a] && e?.hores?.[a] ? e.pibReal[a] / e.hores[a] : null; };     // € del 2015 per hora
const perHoraPPA = (c, a) => { const e = PRODE()[c]; return e?.pibPPA?.[a] && e?.hores?.[a] ? e.pibPPA[a] / e.hores[a] : null; };   // comparable entre països
const serieHora = c => { const e = PRODE()[c] || {}; const o = {}; for (const a of Object.keys(e.pibReal || {})) if (e.hores?.[a]) o[a] = e.pibReal[a] / e.hores[a]; return o; };
const paisosProd = () => [...Object.keys(D.paisos), 'EU'].filter(teProd);

// Quant del creixement ve de treballar més i quant de produir més per hora
function desglossa(c, a0, a1) {
  const e = PRODE()[c];
  const f = k => e?.[k]?.[a0] && e?.[k]?.[a1] ? e[k][a1] / e[k][a0] : null;
  const pib = f('pibReal'), pob = f('pob'), h = f('hores');
  if (!pib || !pob || !h || pib <= 0) return null;
  // el pes es calcula amb logaritmes perquè les dues parts sumin exactament el creixement total
  const pes = Math.log(pib) === 0 ? null : Math.log(h) / Math.log(pib) * 100;
  return { pib: (pib - 1) * 100, pob: (pob - 1) * 100, horesPob: (h / pob - 1) * 100, hores: (h - 1) * 100, perHora: (pib / h - 1) * 100, pes };
}

let prodBase = lsGet('economia_prodbase', 2015);
function setProdBase(a) { prodBase = +a; lsSet('economia_prodbase', prodBase); renderView(); }

  const llista = paisosProd();

  const rows = llista.map(c => { const d = desglossa(c, a0, a1); return d && { c, name: label(c), a: d.hores, b: d.perHora, pib: d.pib }; })
    .filter(Boolean).sort((x, y) => y.pib - x.pib);
  const E = desglossa('ESP', a0, a1);
  const niv = llista.map(c => ({ c, name: label(c), v: perHoraPPA(c, a1) })).filter(r => r.v).sort((x, y) => y.v - x.v);
  const invRows = llista.map(c => ({ c, name: label(c), v: PRODE()[c]?.inversio?.[a1] })).filter(r => r.v != null).sort((x, y) => y.v - x.v);
  const invE = PRODE().ESP?.inversio || {};
  const selector = `<div class="calc" style="margin:8px 0">
    <span>Des de l'any</span>
    <select onchange="setProdBase(this.value)" aria-label="Any de referència">${opcions.map(a => `<option ${a === a0 ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <span class="muted">fins al ${a1}</span></div>`;
  return `
  <div class="card">
    <h3>🔧 D'on surt el creixement: més hores o més productivitat?</h3>
    <p class="sub">Tot el que produeix un país es pot partir en dues coses: <b>quantes hores es treballen</b> (més gent, més ocupació) i
    <b>quant es produeix en cada hora</b>. No és una opinió, és una divisió: les dues parts multiplicades donen el creixement total.
    Els sous només poden pujar de manera sostinguda si puja la segona.</p>
    ${selector}
    ${E ? `<div class="callout">
      <b>Espanya, del ${a0} al ${a1}:</b> l'economia creix un <b>${pct(E.pib, 0)}</b>. Les hores treballades pugen un ${pct(E.hores, 0)}
      (població ${sgn(E.pob, 0)} %, hores per habitant ${sgn(E.horesPob, 0)} %) i la producció per hora, un <b>${pct(E.perHora, 1)}</b>.
      Dit d'una altra manera: <b>${nf(E.pes, 0)} de cada 100 punts</b> de creixement venen de treballar més hores, i només ${nf(100 - E.pes, 0)} de fer-ho millor.</div>` : ''}

      ${cs.length ? chart('c-prod', el => lineChart(el, { title: 'Producció per hora', zero: false, fmt: v => nf(v, 0), ref: { y: 100, label: 'nivell del ' + a0 },

  </div>

    <div class="card">
      <h3>Inversió (${a1})</h3>

      ${barsHTML(invRows, { fmt: v => pct(v, 1), me: 'ESP' })}
      ${invE[2007] ? `<p class="muted">Espanya inverteix el ${pct(invE[a1], 1)} del PIB. El ${2007} era el ${pct(invE[2007], 1)}, però aleshores gairebé tot anava a pisos:
      invertir molt no serveix de res si s'inverteix en coses que no fan produir més.</p>` : ''}
    </div>
    <div class="card">
      <h3>La mitjana no és el que cobra la majoria</h3>
      <p class="sub">La <b>renda mediana</b> és la del que queda just al mig: la meitat de la gent en té menys i l'altra meitat, més.

      ${(() => {
        const rr = llista.map(c => { const e = PRODE()[c] || {}; const a = Math.max(...Object.keys(e.rendaMed || { 0: 0 }).map(Number)); return e.rendaMed?.[a] ? { c, name: label(c), a: e.rendaMed[a], b: e.rendaMitj?.[a], any: a } : null; }).filter(r => r && r.b).sort((x, y) => y.a - x.a);
        const es = PRODE().ESP || {}, aR = rr.find(r => r.c === 'ESP')?.any;
        const desde = 2015, inflR = aR ? cumInfl('ESP', desde - 1, aR - 1) : null;   // la renda de l'enquesta és la de l'any anterior
        const realR = es.rendaMed?.[desde] && aR && inflR != null ? (es.rendaMed[aR] / es.rendaMed[desde] / (1 + inflR / 100) - 1) * 100 : null;
        return `${pairBarsHTML(rr, { la: 'Mediana', lb: 'Mitjana', fmt: v => int(v) + ' €', me: 'ESP' })}

        Descomptant la inflació, ${realR >= 0 ? 'puja' : 'baixa'} un <b>${pct(Math.abs(realR), 0)}</b>: més que el sou mitjà, perquè hi compten les pensions, les ajudes
        i que a cada casa hi treballa més gent. Enquesta EU-SILC: els ingressos són els de l'any anterior.</p>` : ''}`;
      })()}
    </div>
  </div>`;
}

  if (inf != null) txt.push(inf <= 2.5 ? `Els preus estan controlats (${pct(inf)}).` : inf <= 5 ? `Els preus pugen una mica més del desitjable (${pct(inf)}).` : `La inflació és un problema seriós: ${pct(inf)}.`);

  if (df != null) txt.push(df < -3 ? `Gasta força més del que ingressa: dèficit del ${pct(-df)}.` : df < 0 ? `Gasta una mica més del que ingressa (dèficit del ${pct(-df)}).` : `Ingressa més del que gasta (superàvit del ${pct(df)}).`);
  if (cc != null) txt.push(cc >= 0 ? `Ven a l'exterior més del que compra (superàvit exterior del ${pct(cc)}).` : `Compra a l'exterior més del que ven (dèficit exterior del ${pct(-cc)}).`);

    </div>
    <div class="card">
      <h3>Deute públic i dèficit</h3>
