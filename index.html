let altraPais = lsGet('economia_altra_pais', 'ESP');
let altraBase = lsGet('economia_altra_base', 2015);
const A = () => D.altra || {};
const nomOr = c => ent(c) ? label(c) : (A().orNoms?.[c] ? `${A().orNoms[c][1]} ${A().orNoms[c][0]}` : c);
const idxBase = (serie, base) => { const b = serie?.[base]; return b ? Object.entries(serie).filter(([a]) => +a >= base).map(([a, v]) => [+a, v / b * 100]) : []; };

// Barres dobles: dues mesures per fila, amb el mateix eix
function pairBarsHTML(rows, o) {
  rows = rows.filter(r => r.a != null && r.b != null);
  if (!rows.length) return '<p class="muted">Sense dades.</p>';
  const lo = Math.min(0, ...rows.flatMap(r => [r.a, r.b])), hi = Math.max(0, ...rows.flatMap(r => [r.a, r.b]));
  const P = v => (v - lo) / (hi - lo || 1) * 100;
  const one = (v, color) => {
    const a = P(Math.min(0, v)), b = P(Math.max(0, v));
    return `<span class="track">${lo < 0 ? `<span class="axis0" style="left:${P(0)}%"></span>` : ''}<span class="fill" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;background:${color}"></span></span>`;
  };
  return `<div class="legend" style="margin:0 0 8px"><span><i style="background:var(--s2)"></i>${esc(o.la)}</span><span><i style="background:var(--s1)"></i>${esc(o.lb)}</span></div>
  <div class="bars">${rows.map(r => `<div class="bar pair ${r.c === o.me ? 'me' : ''}" title="${esc(r.name)}: ${esc(o.la)} ${esc(o.fmt(r.a))} · ${esc(o.lb)} ${esc(o.fmt(r.b))}">
    <span class="n">${esc(r.name)}</span>
    <span class="dbl">${one(r.a, 'var(--s2)')}${one(r.b, 'var(--s1)')}</span>
    <span class="val"><span>${esc(o.fmt(r.a))}</span><span class="muted">${esc(o.fmt(r.b))}</span></span></div>`).join('')}</div>`;
}

function renderAltra() {
  const X = A();
  if (!X.habitatge && !X.balanc && !X.diners && !X.or) return '<p class="muted">Aquestes dades encara no s\'han baixat.</p>';

  // 1 · Habitatge vs sous (tots dos descomptant la inflació)
  const H = X.habitatge || {};
  const base = altraBase;
  const both = countries().filter(c => H[c] && ent(c).s.souReal);
  const comuna = c => Math.min(lastYear(c, 'souReal'), Math.max(...Object.keys(H[c].anual).map(Number)));
  const canvi = (serie, a) => serie?.[base] && serie?.[a] ? (serie[a] / serie[base] - 1) * 100 : null;
  const pair = both.map(c => { const a = comuna(c); return { c, name: label(c), a: canvi(H[c].anual, a), b: canvi(ent(c).s.souReal, a), any: a }; })
    .filter(r => r.a != null && r.b != null).sort((x, y) => (y.a - y.b) - (x.a - x.b));
  const hp = both.includes(altraPais) ? altraPais : (both[0] || 'ESP');
  const hr = pair.find(r => r.c === hp);
  const esforc = hr ? ((1 + hr.a / 100) / (1 + hr.b / 100) - 1) * 100 : null;
  const pitjor = pair.filter(r => r.a > r.b).length;

  // 2 · Balanç dels bancs centrals en % del PIB
  const B = X.balanc || {};
  const balPct = (b, a) => { const v = B[b]?.anual?.[a], p = val(BANK_INFL[b], 'pib', +a); return v && p ? v / p * 100 : null; };
  const avail = Object.keys(BANKS).filter(b => B[b]);
  const selB = banks.filter(b => B[b]);
  const mult = avail.map(b => { const a = B[b].anual; return { c: b, name: BANKS[b], v: a[2007] ? Object.values(a).at(-1) / a[2007] : null }; }).sort((x, y) => y.v - x.v);
  const eu = B.XM?.anual, euMax = eu ? Object.entries(eu).reduce((m, e) => e[1] > m[1] ? e : m) : null;
  const euAra = B.XM ? Object.entries(B.XM.mensual).at(-1) : null;

  // 3 · Diners vs economia a la zona euro
  const M = X.diners;
  const d0 = 2000;
  const lastM = M ? Math.max(...Object.keys(M.pib).map(Number)) : null;
  const ratio = (s, a) => s[a] / s[d0];

  // 4 · Or
  const O = X.or || {};
  const ultimOr = c => Math.max(...Object.keys(O[c]).map(Number));
  const compra = Object.keys(O).map(c => ({ c, name: nomOr(c), v: O[c][2021] != null ? O[c][ultimOr(c)] - O[c][2021] : null }))
    .filter(r => r.v).sort((a, b) => b.v - a.v);
  const totalOr = Object.keys(O).map(c => ({ c, name: nomOr(c), v: O[c][ultimOr(c)], color: 'var(--s4)' })).sort((a, b) => b.v - a.v).slice(0, 15);
  const orAny = Object.keys(O).length ? Math.max(...Object.keys(O).map(ultimOr)) : null;
  const chn = O.CHN;
  // Compres i vendes de l'any en curs amb les dades mensuals (des del desembre anterior)
  const OM = X.orMensual || {};
  const anyOr = Math.max(...Object.values(OM).flatMap(x => Object.keys(x)).map(k => +k.slice(0, 4)), 0);
  const ultimMesOr = Object.values(OM).flatMap(x => Object.keys(x)).filter(k => k.startsWith(anyOr)).sort().at(-1);
  const any26 = Object.keys(OM).map(c => {
    const s = OM[c], ks = Object.keys(s).filter(k => k.startsWith(anyOr)).sort(), base = s[`${anyOr - 1}-12`];
    return ks.length && base != null ? { c, name: nomOr(c), v: s[ks.at(-1)] - base, mes: ks.at(-1) } : null;
  }).filter(r => r && Math.abs(r.v) >= 1).sort((a, b) => b.v - a.v);
  const net26 = any26.reduce((t, r) => t + r.v, 0);

  return `
  <div class="intro">
    <h2>🔍 L'altra cara dels números</h2>
    <p class="sub">Les xifres oficials no són falses, però els titulars sovint només n'expliquen una part. Aquí hi ha dades
    <b>també oficials</b> (BIS, BCE, FMI, OCDE) que ajuden a entendre per què molta gent sent que viu pitjor del que diuen les estadístiques.</p>
  </div>

  ${hr ? `<div class="tiles">
    ${tile(`🏠 Pisos a ${esc(ent(hp).nom)}`, sgn(hr.a, 0) + ' %', `preu real, del ${base} al ${hr.any}`)}
    ${tile('💶 Sous reals', sgn(hr.b, 0) + ' %', 'en el mateix període')}
    ${tile('⏳ Esforç per comprar un pis', sgn(esforc, 0) + ' %', 'anys de sou necessaris, respecte al ' + base,
      esforc > 5 ? '<span class="badge bad">▲ més difícil</span>' : esforc < -5 ? '<span class="badge good">▼ més fàcil</span>' : '<span class="badge warn">≈ igual</span>')}
  </div>` : ''}

  <div class="card">
    <h3>🏠 1. Els pisos pugen més que els sous</h3>
    <p class="sub">Tots dos <b>descomptant la inflació</b>. Si la barra taronja supera la blava, comprar un pis costa més anys de feina que el ${base}.
    Passa en ${pitjor} dels ${pair.length} països amb dades. L'IPC no ho recull: a la zona euro no hi compta el preu de comprar un habitatge.</p>
    <div class="controls">
      Des de l'any
      <select onchange="altraBase=+this.value;lsSet('economia_altra_base',altraBase);renderView()" aria-label="Any de referència">${[2000, 2008, 2010, 2015, 2020].map(a => `<option ${a === base ? 'selected' : ''}>${a}</option>`).join('')}</select>

        <p class="muted">${base} = 100. ${hp === 'ESP' && base >= 2008 && base <= 2010 ? 'Compte: el 2008-2010 a Espanya encara no havia esclatat del tot la bombolla immobiliària; prova des del 2015 o del 2000.' : ''}</p></div>
      <div>${pairBarsHTML(pair, { la: 'Pisos', lb: 'Sous', fmt: v => sgn(v, 0) + ' %', me: hp })}</div>

  ${obraNovaHTML()}

  ${avail.length ? `<div class="card">

      ${euAra ? tile(`Ara (${monthLabel(monthX(euAra[0]))})`, nf(euAra[1] / 1000, 1) + ' bil. $', 'des del 2022 en retira', '<span class="badge good">▼ baixant</span>') : ''}
    </div>` : ''}
    <div class="chips" style="margin-bottom:12px">${avail.map(b => `<button class="chip ${banks.includes(b) ? 'on' : ''}" onclick="toggleBank('${b}')" ${banks.includes(b) ? `style="color:${col(b, bankCol)}"` : ''}>
      ${banks.includes(b) ? `<span class="dot" style="background:${col(b, bankCol)}"></span>` : ''}<span style="color:var(--text)">${esc(BANKS[b])}</span></button>`).join('')}</div>
    ${chart('c-alt-bal', el => lineChart(el, { title: 'Balanç dels bancs centrals', fmt: v => pct(v, 0), tick: v => v + ' %',
      series: selB.map(b => ({ name: BANKS[b], short: BANKS[b].split(' (')[0].replace(/^Banc (del |de l'|d'|de )?/, ''), color: col(b, bankCol),
        pts: Object.keys(B[b].anual).map(a => [+a, balPct(b, a)]).filter(p => p[1] != null && p[0] < Y) })) }))}
    <p class="muted">Els mateixos bancs centrals que tries a la pestanya de tipus d'interès. Balanç a final d'any dividit pel PIB d'aquell any.</p>
    <div class="grid g2" style="margin-top:14px">
      <div>
        <h3>Quantes vegades més gran que el 2007?</h3>

      </div>

// Última dada d'un municipi, en directe de l'Idescat (el padró de dades.json acaba el 2022)
async function loadMun(id) {
  if (munLive[id] || !/^\d{6}$/.test(id)) return;
  const gen = ++munGen;
  try {
    const r = await fetch(`https://api.idescat.cat/emex/v1/dades.json?id=${id}&i=f171,f73&lang=ca`, { signal: AbortSignal.timeout(10000) });
    const j = await r.json();
    const ind = [j.fitxes?.indicadors?.i].flat().filter(Boolean);
    const get = k => (ind.find(x => x.id === k)?.v || '').split(',').map(x => x === '_' ? null : +x);
    const pob = get('f171'), estr = get('f73');
    if (gen !== munGen || !pob[0]) return;
    munLive[id] = { any: +ind[0].r, pob: pob[0], estr: estr[0], cat: [estr[2], pob[2]] };
    if (view === 'immigracio') renderView();
  } catch { /* sense connexió: es mostra només el padró fins al 2022 */ }
}
function setMun(txt) {
  const C = D.immi?.cat; if (!C) return;
  const t = txt.trim().toLowerCase();
  const id = Object.keys(C.mun).find(k => C.mun[k][0].toLowerCase() === t);
  if (!id) return;
  imMun = id; lsSet('economia_immun', id); renderView(); loadMun(id);
}

    cat = `

// OCDE Taxing Wages: treballador sense fills que cobra el sou mitjà del seu país.
let impPais = lsGet('economia_imppais', 'ESP');
const IMP = () => D.fiscal?.impostos || {};
const impV = (c, k, a) => IMP()[c]?.[k]?.[a];
const impLast = c => { const s = IMP()[c]?.irpf; return s ? Math.max(...Object.keys(s).map(Number)) : null; };

// Exemple numèric de progressivitat en fred amb dos trams inventats (20 % fins a 20.000 €, 30 % a partir d'aquí)
let fredInfl = lsGet('economia_fredinfl', 10);
let impBase = lsGet('economia_impbase', 2018);
function exempleFred() {
  const LIM = 20000, T1 = 0.20, T2 = 0.30, SOU = 20000;
  const imp = (sou, lim) => Math.min(sou, lim) * T1 + Math.max(0, sou - lim) * T2;
  const f = 1 + fredInfl / 100, sou2 = SOU * f;
  const cas = [
    { t: 'Abans', sou: SOU, lim: LIM },
    { t: 'Trams sense actualitzar', sou: sou2, lim: LIM },
    { t: 'Trams actualitzats', sou: sou2, lim: LIM * f },
  ].map((c, k) => { const i = imp(c.sou, c.lim), net = c.sou - i; return { ...c, i, net, real: k === 0 ? net : net / f }; });
  const perdua = cas[0].real - cas[1].real;
  const eur = v => int(v) + ' €';
  return `
    <div class="callout" style="margin-top:14px">
      <b>🧮 Un exemple amb números</b>
      <p class="sub">Regles inventades i simplificades: els primers <b>20.000 €</b> del sou paguen un <b>20 %</b> i el que passa d'aquí, un <b>30 %</b>.
      Cobres 20.000 € i un any la inflació és del
      <select onchange="fredInfl=+this.value;lsSet('economia_fredinfl',fredInfl);renderView()" aria-label="Inflació de l'exemple">${[2, 5, 10, 20].map(v => `<option value="${v}" ${v === fredInfl ? 'selected' : ''}>${v} %</option>`).join('')}</select>.
      L'empresa t'apuja el sou exactament el mateix.</p>
      <div class="tablewrap"><table>
        <thead><tr><th></th>${cas.map(c => `<th>${esc(c.t)}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Límit del primer tram</td>${cas.map(c => `<td class="num">${eur(c.lim)}</td>`).join('')}</tr>
          <tr><td>Sou brut</td>${cas.map(c => `<td class="num">${eur(c.sou)}</td>`).join('')}</tr>
          <tr><td>IRPF</td>${cas.map(c => `<td class="num">${eur(c.i)}</td>`).join('')}</tr>
          <tr><td>% del sou que pagues</td>${cas.map((c, k) => `<td class="num ${k === 1 ? 'hi' : ''}">${pct(c.i / c.sou * 100)}</td>`).join('')}</tr>
          <tr><td>Sou net</td>${cas.map(c => `<td class="num">${eur(c.net)}</td>`).join('')}</tr>
          <tr><td><b>Sou net en diners d'abans</b></td>${cas.map((c, k) => `<td class="num ${k === 1 ? 'hi' : ''}"><b>${eur(c.real)}</b></td>`).join('')}</tr>
        </tbody>
      </table></div>
      <p class="sub" style="margin-top:8px">Si els trams <b>no s'actualitzen</b>, passes a pagar un ${pct(cas[1].i / cas[1].sou * 100)} en lloc d'un 20 % i el teu sou net compra
      <b>${eur(perdua)} menys</b> que abans, encara que t'hagin apujat el sou com els preus. Aquests diners se'ls queda Hisenda.
      Si <b>s'actualitzen</b>, quedes exactament igual que abans.</p>
      <p class="muted">"En diners d'abans" vol dir descomptant la inflació: el sou net dividit per ${nf(f, 2)}. L'IRPF real té més trams, mínims personals i deduccions, però el mecanisme és el mateix.</p>
    </div>`;
}

function renderImpostos() {
  const T = IMP();
  const paisos = countries().filter(c => T[c]?.irpf);
  if (!paisos.length) return '<p class="muted">Aquestes dades encara no s\'han baixat.</p>';
  const p = paisos.includes(impPais) ? impPais : paisos[0];
  const aU = impLast(p), a0 = 2000, aI = 2020;
  const irpf0 = impV(p, 'irpf', a0), irpfI = impV(p, 'irpf', aI), irpfU = impV(p, 'irpf', aU);

  // Nòmina: on van 100 € del que paga l'empresa
  const brut = impV(p, 'brut', aU), net = impV(p, 'net', aU), cunya = impV(p, 'cunya', aU), ss = impV(p, 'irpfSS', aU);
  let nomina = '';
  if (brut && net && cunya != null && ss != null) {
    const cost = net / (1 - cunya / 100);
    const parts = [
      ['🏢 Cotització de l\'empresa', (cost - brut) / cost * 100, 'var(--s4)'],
      ['🏛️ IRPF', brut * irpfU / 100 / cost * 100, 'var(--s2)'],
      ['🧑‍💼 Cotització del treballador', brut * (ss - irpfU) / 100 / cost * 100, 'var(--s5)'],
      ['💶 El que cobres net', net / cost * 100, 'var(--s1)'],
    ];
    const mon = ent(p).moneda || '';
    const u = mon === 'EUR' ? ' €' : ''; // de cada 100 unitats de moneda
    nomina = `
    <div class="card">
      <h3>🧾 On van els diners d'un sou mitjà a ${esc(ent(p).nom)} (${aU})</h3>
      <p class="sub">De cada 100 que paga l'empresa per un treballador sense fills que cobra el sou mitjà:</p>
      <div class="stack" role="img" aria-label="Repartiment del cost laboral: ${esc(parts.map(([n, v]) => `${n} ${nf(v, 1)}`).join(', '))}">
        ${parts.map(([n, v, c]) => `<div title="${esc(n)}: ${nf(v, 1)}${u}" style="flex:${v} 1 0;background:${c}">${v >= 7 ? `<span>${nf(v, 1)}${u}</span>` : ''}</div>`).join('')}
      </div>
      <div class="stackleg">
        ${parts.map(([n, v, c]) => `<span><i style="background:${c}"></i>${esc(n)} <b class="num">${nf(v, 1)}${u}</b></span>`).join('')}
      </div>
      <p class="sub" style="margin-top:10px">Sou brut: <b>${int(brut)} ${esc(mon)}</b> l'any · net: <b>${int(net)} ${esc(mon)}</b> · cost per a l'empresa: <b>${int(cost)} ${esc(mon)}</b>.
      La <b>cunya fiscal</b> (tot el que es queda l'estat) és del <b>${pct(cunya)}</b>.</p>
    </div>`;
  }

  // Sou brut i net en termes reals (descomptant la inflació de l'FMI), any triat = 100
  const b0 = impBase;
  const real = k => {
    const s = IMP()[p]?.[k]; if (!s || !s[b0]) return [];
    let f = 1; const out = [[b0, 100]];
    for (let a = b0 + 1; s[a] != null; a++) { const i = val(p, 'infl', a); if (i == null) break; f *= 1 + i / 100; out.push([a, s[a] / s[b0] / f * 100]); }
    return out;
  };
  const rb = real('brut'), rn = real('net');
  const netReal = rn.length > 1 ? rn.at(-1)[1] - 100 : null;
  const pujada = paisos.map(c => ({ c, name: label(c), v: impV(c, 'irpf', impLast(c)) != null && impV(c, 'irpf', aI) != null ? impV(c, 'irpf', impLast(c)) - impV(c, 'irpf', aI) : null }))
    .filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const puja = pujada.filter(r => r.v > 0.2).length;
  const cunyes = paisos.map(c => ({ c, name: label(c), v: impV(c, 'cunya', impLast(c)) })).sort((a, b) => b.v - a.v);
  const selI = sel.filter(c => T[c]?.irpf);

  return `
  <div class="intro">
    <h2>🧾 Impostos sobre el sou: la pujada que no es vota</h2>
    <p class="sub">Quan la inflació puja i et pugen el sou per compensar-la, pots pagar un percentatge més alt d'IRPF encara que <b>no hagi canviat cap llei</b>:
    passes a trams més alts perquè els trams no s'actualitzen. Això es diu <b>progressivitat en fred</b>. Els teus diners valen el mateix, però Hisenda se n'emporta més.</p>
    <div class="controls">País:
      <select onchange="impPais=this.value;lsSet('economia_imppais',impPais);renderView()" aria-label="País">${paisos.map(c => `<option value="${c}" ${c === p ? 'selected' : ''}>${esc(label(c))}</option>`).join('')}</select>
    </div>
  </div>
  <div class="tiles">
    ${irpf0 != null ? tile(`IRPF el ${a0}`, pct(irpf0), 'del sou brut mitjà') : ''}
    ${irpfI != null ? tile(`IRPF el ${aI}`, pct(irpfI), 'abans de la inflació') : ''}
    ${irpfU != null ? tile(`IRPF el ${aU}`, pct(irpfU), irpfI != null ? `${sgn(irpfU - irpfI)} punts des del ${aI}` : '',

    <div class="card">

    <h3>El sou brut i el sou net, descomptant la inflació (${esc(ent(p).nom)})</h3>
    <div class="controls">Comparar des de l'any
      <select onchange="impBase=+this.value;lsSet('economia_impbase',impBase);renderView()" aria-label="Any de referència">${[2000, 2008, 2015, 2018, 2020, 2022].map(a => `<option ${a === b0 ? 'selected' : ''}>${a}</option>`).join('')}</select>
    </div>

    <p class="sub" style="margin-top:8px">Del ${b0} al ${rb.at(-1)[0]}: sou brut real <b>${sgn(rb.at(-1)[1] - 100, 1)} %</b>, sou net real <b>${sgn(rn.at(-1)[1] - 100, 1)} %</b>.
    ${rn.at(-1)[1] < 100 ? `El sou net d'avui compra <b>menys</b> que el del ${b0}.` : ''}</p>
    <p class="muted">Sou mitjà segons l'OCDE (Taxing Wages), deflactat amb la inflació de l'FMI.</p>
  </div>` : ''}
  <div class="card">
    <h3>Com funciona la progressivitat en fred</h3>
    <div class="flow">
      <div class="step"><b>📈 Inflació del 10 %</b>Tot val un 10 % més.</div><div class="arr">→</div>
      <div class="step"><b>💶 Sou +10 %</b>Et pugen el sou el mateix: en teoria, quedes igual.</div><div class="arr">→</div>
      <div class="step"><b>🪜 Tram més alt</b>Els trams de l'IRPF no s'han mogut: part del sou tributa a un tipus més alt.</div><div class="arr">→</div>
      <div class="step"><b>📉 Net real més baix</b>Pagues un % més gran i el teu sou net compra menys que abans.</div>
    </div>
    ${exempleFred()}
    <p class="sub" style="margin-top:10px">La solució tècnica és senzilla: <b>actualitzar els trams amb la inflació cada any</b>, com fan per llei alguns països.
    Si no es fa, és una pujada d'impostos que no passa per cap votació. A Espanya, l'escala estatal no s'ha actualitzat amb la inflació dels últims anys;
    algunes comunitats sí que han ajustat la seva part.</p>
    <p class="muted">Font: OCDE, Taxing Wages. Treballador sense fills que cobra el 100 % del sou mitjà del país; altres situacions familiars o sous paguen percentatges diferents.</p>
  </div>`;
}

// Tresor dels EUA (deute diari i tenidors estrangers, TIC) i Fed de Nova York (repo invers).
const TIC_NOMS = {

  Switzerland: '🇨🇭 Suïssa', Singapore: '🇸🇬 Singapur', 'Hong Kong': '🇭🇰 Hong Kong', Norway: '🇳🇴 Noruega', India: '🇮🇳 Índia',
  Brazil: '🇧🇷 Brasil', 'Saudi Arabia': '🇸🇦 Aràbia Saudita', 'Korea, South': '🇰🇷 Corea del Sud', Israel: '🇮🇱 Israel',
  'United Arab Emirates': '🇦🇪 Emirats Àrabs', Germany: '🇩🇪 Alemanya', Bermuda: '🇧🇲 Bermudes',
};
const bil = v => v == null ? '–' : nf(v / 1000, v >= 10000 ? 1 : 2) + ' bil. $';
const serieMes = (obj, f = x => x) => Object.entries(obj || {}).map(([k, v]) => [monthX(k), f(v)]).filter(p => p[1] != null).sort((a, b) => a[0] - b[0]);

function renderEua() {
  const U = D.eua;
  if (!U?.deute) return '<p class="muted">Aquestes dades encara no s\'han baixat.</p>';
  const [dAvui, dTot] = U.deuteUltim;
  const mesos = Object.keys(U.deute).sort();
  const fa1 = mesos.find(k => k >= (+dAvui.slice(0, 4) - 1) + dAvui.slice(4, 7));
  const creixAny = fa1 ? dTot - U.deute[fa1][0] : null;
  const perDia = creixAny != null ? creixAny / 365 * 1000 : null; // milions de dòlars al dia
  const deute20 = U.deute['2020-01']?.[0];

  const T = U.tenidors || {};
  const ultTic = Object.keys(T.TOTAL || {}).sort().at(-1);
  const fa12 = ultTic ? `${+ultTic.slice(0, 4) - 1}${ultTic.slice(4)}` : null;
  const total = T.TOTAL?.[ultTic], oficial = T.OFICIAL?.[ultTic];
  const public_ = U.deute[ultTic]?.[1];
  const quotaFora = total && public_ ? total / public_ * 100 : null;
  const paisos = Object.keys(T).filter(k => k !== 'TOTAL' && k !== 'OFICIAL' && T[k][ultTic] != null);
  const top = paisos.map(k => ({ c: k, name: TIC_NOMS[k] || k, v: T[k][ultTic] })).sort((a, b) => b.v - a.v);
  const canvi = paisos.map(k => ({ c: k, name: TIC_NOMS[k] || k, v: T[k][fa12] != null ? T[k][ultTic] - T[k][fa12] : null })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const priv = Object.fromEntries(Object.keys(T.TOTAL || {}).filter(k => T.OFICIAL?.[k] != null).map(k => [k, T.TOTAL[k] - T.OFICIAL[k]]));
  const offCanvi = T.OFICIAL?.[fa12] != null ? oficial - T.OFICIAL[fa12] : null;
  const privCanvi = priv[fa12] != null ? priv[ultTic] - priv[fa12] : null;
  const caiman = T['Cayman Islands'];

  const [rDia, rVal] = U.rrpUltim || [];
  const [mDia, mVal] = U.rrpMax || [];

  return `
  <div class="intro">
    <h2>💵 El deute dels EUA i la "fontaneria" del sistema</h2>
    <p class="sub">El dòlar és la moneda en què estalvia mig món, i els bons del Tresor dels EUA són la base de tot el sistema financer.
    Per això importa tant <b>quant deuen els EUA, qui els deixa els diners i amb quins diners ho fa</b>.</p>
  </div>
  <div class="tiles">
    ${tile('🇺🇸 Deute total dels EUA', bil(dTot), `a ${esc(dAvui.split('-').reverse().join('/'))}`, '<span class="badge bad">▲ rècord</span>')}
    ${creixAny != null ? tile('Ha crescut en un any', '+' + bil(creixAny), `uns ${int(perDia)} milions de dòlars cada dia`) : ''}
    ${deute20 ? tile('Des del gener del 2020', '×' + nf(dTot / deute20, 2), `era de ${bil(deute20)}`) : ''}
    ${quotaFora ? tile('En mans d\'estrangers', pct(quotaFora, 0), `del deute que es negocia (${esc(monthLabel(monthX(ultTic)))})`) : ''}
  </div>

  <div class="card">
    <h3>📈 Deute total dels EUA</h3>
    <p class="sub">Milers de milions de dòlars, a final de cada mes. Es dispara amb cada crisi (2008, 2020) i ja no baixa quan la crisi s'acaba.</p>
    ${chart('c-eua-deute', el => lineChart(el, { title: 'Deute dels EUA', months: true, fmt: v => bil(v), tick: v => nf(v / 1000, 0) + ' bil.',
      series: [{ name: 'Deute total', color: 'var(--s2)', pts: serieMes(U.deute, x => x[0]) },
               { name: 'Deute en mans del públic (sense el que es deu a si mateix)', short: 'En mans del públic', color: 'var(--s1)', pts: serieMes(U.deute, x => x[1]) }] }))}
    <p class="muted">Una part del deute total el tenen organismes del mateix govern (com la Seguretat Social). El que es compra i es ven al mercat és el deute "en mans del públic".</p>
  </div>

  ${ultTic ? `<div class="card">
    <h3>🌍 Qui té els bons dels EUA a l'estranger?</h3>
    <p class="sub">La idea que "el món fuig del dòlar" és només mitja veritat. Els <b>governs i bancs centrals</b> estrangers n'han reduït el pes,
    però els <b>inversors privats</b> (fons, bancs, hedge funds) n'han comprat molts més.</p>
    <div class="tiles">
      ${tile('Total en mans d\'estrangers', bil(total), esc(monthLabel(monthX(ultTic))))}
      ${tile('🏛️ Governs i bancs centrals', bil(oficial), offCanvi != null ? `${offCanvi >= 0 ? '+' : '−'}${int(Math.abs(offCanvi))} mil M $ en un any` : '')}
      ${tile('🏦 Inversors privats', bil(priv[ultTic]), privCanvi != null ? `${privCanvi >= 0 ? '+' : '−'}${int(Math.abs(privCanvi))} mil M $ en un any` : '')}
    </div>
    ${chart('c-eua-tic', el => lineChart(el, { title: 'Bons dels EUA en mans d\'estrangers', months: true, fmt: v => bil(v), tick: v => nf(v / 1000, 0) + ' bil.',
      series: [{ name: 'Governs i bancs centrals estrangers', short: 'Oficials', color: 'var(--s4)', pts: serieMes(T.OFICIAL) },
               { name: 'Inversors privats estrangers', short: 'Privats', color: 'var(--s1)', pts: serieMes(priv) }] }))}
    <div class="grid g2" style="margin-top:14px">
      <div><h3>Els principals tenidors</h3><p class="sub">Milers de milions de dòlars (${esc(monthLabel(monthX(ultTic)))}).</p>
        ${barsHTML(top, { fmt: v => int(v), me: 'Japan' })}</div>
      <div><h3>Qui n'ha comprat i qui n'ha venut en un any</h3><p class="sub">Canvi respecte a ${esc(monthLabel(monthX(fa12)))}, en milers de milions.</p>
        ${barsHTML(canvi, { fmt: v => sgn(v, 0) })}</div>
    </div>
    <div class="callout" style="margin-top:12px">
      <b>🏝️ Per què hi surten les Illes Caiman, Luxemburg o Bèlgica?</b>
      <p class="sub">No són grans estalviadors: allà hi ha domiciliats molts <b>fons d'inversió i hedge funds</b>, i dipòsits de valors d'arreu (Bèlgica té Euroclear).
      ${caiman ? `Les Caiman han passat de ${int(caiman[Object.keys(caiman).sort()[0]])} mil milions (${Object.keys(caiman).sort()[0].slice(0, 4)}) a ${int(caiman[ultTic])} mil milions de dòlars.` : ''}
      Molts d'aquests fons compren bons amb <b>diners manllevats a molt curt termini</b> (vegeu més avall): és una demanda real però fràgil.</p>
    </div>
    <p class="muted">Font: Tresor dels EUA (TIC). El país és on està registrat qui té el bo, no sempre el propietari final.</p>
  </div>` : ''}

  ${U.rrp ? `<div class="card">
    <h3>🚰 El coixí de liquiditat que s'ha buidat</h3>
    <p class="sub">Els fons monetaris poden deixar els diners que no fan servir a la Reserva Federal d'un dia per l'altre (el <b>repo invers</b>).
    Quan el Tresor necessita vendre molts bons, aquests fons en treuen els diners per comprar-ne. És com un dipòsit d'aigua que ajuda a absorbir deute nou.</p>
    <div class="tiles">
      ${mVal ? tile('Màxim', bil(mVal), `el ${esc(mDia.split('-').reverse().join('/'))}`) : ''}
      ${rVal != null ? tile('Ara', rVal < 1 ? int(rVal * 1000) + ' milions de $' : rVal < 100 ? nf(rVal, 1) + ' mil M $' : bil(rVal), `el ${esc(rDia.split('-').reverse().join('/'))}`,
        mVal && rVal / mVal < 0.05 ? '<span class="badge warn">▼ gairebé buit</span>' : '') : ''}
    </div>
    ${chart('c-eua-rrp', el => lineChart(el, { title: 'Repo invers de la Fed', months: true, fmt: v => bil(v), tick: v => nf(v / 1000, 1) + ' bil.',
      series: [{ name: 'Diners aparcats a la Fed (mitjana del mes)', color: 'var(--s3)', pts: serieMes(U.rrp) }] }))}
    <p class="sub" style="margin-top:8px">Durant el 2023 i el 2024 aquests diners van anar a comprar deute nou dels EUA sense que la Fed hagués d'imprimir res.
    Ara que el dipòsit és gairebé buit, <b>aquest recurs ja no hi és</b>: el Tresor depèn més de compradors que es financen a curt termini.</p>
    <p class="muted">Font: Fed de Nova York.</p>
  </div>` : ''}

  ${divisesHTML()}

  <div class="card">
    <h3>🔧 Com es pot encallar la canonada</h3>
    <div class="grid g2" style="margin-top:8px">
      <div><b>💱 El "basis trade"</b><p class="sub">Alguns hedge funds compren bons del Tresor i venen futurs sobre aquests bons per guanyar una diferència minúscula.
      Per fer-ho rendible, s'endeuten molt a un dia vista al <b>mercat repo</b>. Funciona mentre algú els deixi diners cada dia.</p></div>
      <div><b>🚨 Setembre del 2019</b><p class="sub">Van coincidir pagaments d'impostos i de deute, i el tipus del mercat repo es va disparar fins a prop del 10 %.
      Ningú no havia fet fallida, però els diners no circulaven. La Fed va haver d'injectar liquiditat.</p></div>
      <div><b>🇬🇧 Londres, setembre del 2022</b><p class="sub">El govern de Liz Truss va anunciar rebaixes d'impostos sense finançar. Els bons britànics es van enfonsar
      i els fons de pensions, que feien servir estratègies amb palanquejament, van haver de vendre bons de cop. El Banc d'Anglaterra va haver d'intervenir.</p></div>
      <div><b>🇯🇵 Agost del 2024</b><p class="sub">Molts inversors es finançaven en iens barats per invertir fora (<b>carry trade</b>). Quan el ien es va encarir,
      van haver de desfer posicions de cop i la borsa japonesa va caure més d'un 12 % en un dia.</p></div>
    </div>
    <div class="callout" style="margin-top:12px">
      <b>La lliçó: solvència no és liquiditat</b>
      <p class="sub">Pots tenir actius que valen més que els teus deutes i, tot i així, no tenir els diners el dia que te'ls demanen. Quan molts inversors han de vendre alhora,
      els preus cauen, els demanen més garanties i han de vendre encara més. Per això els bancs centrals acaben rescatant el sistema, i el cost acaba
      repartit entre tothom (inflació, tipus, impostos).</p>
    </div>
  </div>`;
}

/* ── 👴 Pensions i demografia ───────────────────────────────────────────────── */
// Eurostat: gent gran per cada 100 persones en edat de treballar (real i projecció EUROPOP2023),
// despesa en pensions en % del PIB i fills per dona.
let penSel = lsGet('economia_pensel', ['ESP', 'DEU', 'ITA', 'EU']);
let penCol = fixColors(penSel, lsGet('economia_pensel_c', {}));
const DM = () => D.demo?.eu || {};
const dmLast = (c, k) => { const s = DM()[c]?.[k]; if (!s) return null; const a = Math.max(...Object.keys(s).map(Number)); return [a, s[a]]; };
function togglePen(c) {
  if (penSel.includes(c)) { if (penSel.length > 1) penSel = penSel.filter(x => x !== c); }
  else { if (penSel.length >= MAX_SEL) return alert(`Com a màxim ${MAX_SEL} alhora.`); penSel = [...penSel, c]; }
  fixColors(penSel, penCol); lsSet('economia_pensel', penSel); lsSet('economia_pensel_c', penCol); renderView();
}

function renderPensions() {
  const M = DM();
  if (!M.ESP) return '<p class="muted">Aquestes dades encara no s\'han baixat.</p>';
  const p = M[imPais] ? imPais : 'ESP';
  const [aD, dep] = dmLast(p, 'depVell') || [];
  const pr = M[p]?.depVellProj || {};
  const [aP, pen] = dmLast(p, 'pensions') || [];
  const [aF, fec] = dmLast(p, 'fecunditat') || [];
  const treb = v => v ? nf(100 / v, 1) : '–'; // persones en edat de treballar per cada persona gran
  const paisos = Object.keys(M).filter(c => M[c].depVell);
  const serieDep = c => {
    const h = Object.entries(M[c]?.depVell || {}).map(([a, v]) => [+a, v]);
    const pj = Object.entries(M[c]?.depVellProj || {}).map(([a, v]) => [+a, v]).filter(x => x[0] <= 2070);
    return [...h, ...pj].sort((a, b) => a[0] - b[0]);
  };
  const bars = (k, fmt, extra = {}) => barsHTML(paisos.map(c => ({ c, name: imNom(c), v: dmLast(c, k)?.[1] })).sort((a, b) => b.v - a.v), { fmt, me: p, ...extra });
  const d2050 = paisos.map(c => ({ c, name: imNom(c), v: M[c].depVellProj?.[2050] })).sort((a, b) => b.v - a.v);

  return `
  <div class="intro">
    <h2>👴 Pensions: qui les pagarà?</h2>
    <p class="sub">Les pensions públiques es paguen amb les cotitzacions de qui treballa <b>avui</b> (sistema de repartiment). Per això el que més importa és
    <b>quantes persones treballen per cada jubilat</b>, i aquesta proporció està canviant molt de pressa.</p>
    <div class="controls">País:
      <select onchange="imPais=this.value;lsSet('economia_impais',imPais);renderView()" aria-label="País">${paisos.map(c => `<option value="${c}" ${c === p ? 'selected' : ''}>${esc(imNom(c))}</option>`).join('')}</select>
    </div>
  </div>
  <div class="tiles">
    ${dep ? tile(`👴 Gent gran per cada 100 en edat de treballar (${aD})`, nf(dep, 0), `${treb(dep)} persones de 15-64 anys per cada una de 65 o més`) : ''}
    ${pr[2050] ? tile('I el 2050 (projecció)', nf(pr[2050], 0), `només ${treb(pr[2050])} per cada persona gran`, pr[2050] - dep > 15 ? '<span class="badge bad">▲▲ molt més</span>' : '<span class="badge warn">▲ més</span>') : ''}
    ${pen ? tile(`💶 Despesa en pensions (${aP})`, pct(pen), 'del PIB') : ''}
    ${fec ? tile(`👶 Fills per dona (${aF})`, nf(fec, 2), 'en calen 2,1 perquè la població no baixi', fec < 1.5 ? '<span class="badge bad">▼ molt baixa</span>' : '') : ''}
  </div>

  <div class="card">
    <h3>Gent gran per cada 100 persones en edat de treballar</h3>
    <p class="sub">Persones de 65 anys o més per cada 100 de 15 a 64 anys. A partir del ${new Date().getFullYear()} és una projecció d'Eurostat (escenari base, que ja compta amb la immigració prevista).</p>
    <div class="chips" style="margin-bottom:12px">${paisos.map(c => `<button class="chip ${penSel.includes(c) ? 'on' : ''}" onclick="togglePen('${c}')" ${penSel.includes(c) ? `style="color:${col(c, penCol)}"` : ''}>
      ${penSel.includes(c) ? `<span class="dot" style="background:${col(c, penCol)}"></span>` : ''}<span style="color:var(--text)">${esc(imNom(c))}</span></button>`).join('')}</div>
    ${chart('c-pen-dep', el => lineChart(el, { title: 'Taxa de dependència de la gent gran', forecast: new Date().getFullYear(), fmt: v => nf(v, 1),
      series: penSel.filter(c => M[c]).map(c => ({ name: imNom(c), short: imShort(c), color: col(c, penCol), pts: serieDep(c) })) }))}
  </div>

  <div class="grid g2">
    <div class="card"><h3>El 2050 (projecció)</h3><p class="sub">Gent gran per cada 100 en edat de treballar.</p>${barsHTML(d2050, { fmt: v => nf(v, 0), me: p })}</div>
    <div class="card"><h3>Despesa en pensions</h3><p class="sub">% del PIB, últim any disponible (Eurostat).</p>${bars('pensions', v => pct(v))}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Fills per dona</h3><p class="sub">Per mantenir la població sense immigració en calen 2,1.</p>${bars('fecunditat', v => nf(v, 2), { ref: { v: 2.1, label: 'el nivell de reemplaçament (2,1)' } })}</div>
    <div class="card">
      <h3>Què vol dir tot plegat?</h3>
      <p class="sub">Si avui hi ha ${treb(dep)} persones en edat de treballar per cada jubilat i el 2050 n'hi haurà ${treb(pr[2050])}, cada treballador
      haurà de suportar molta més càrrega. Les sortides possibles són totes incòmodes:</p>
      <p class="sub">• <b>Jubilar-se més tard</b> · • <b>Cotitzar més</b> (més cost laboral) · • <b>Pensions més baixes</b> en relació amb el sou ·
      • <b>Més deute públic</b> · • <b>Més treballadors</b>: més ocupació, més productivitat o més immigració · • <b>Estalvi privat</b> complementari.</p>
      <p class="sub">La immigració rejoveneix la població i aporta cotitzacions, però els immigrants també es jubilaran i cobraran pensió: ajuda a guanyar temps,
      però per si sola no resol el problema si els sous i la productivitat són baixos. <a href="#immigracio">Immigració →</a></p>
    </div>
  </div>
  <p class="muted">Font: Eurostat (indicadors d'estructura de la població, projeccions EUROPOP2023, despesa en pensions i fecunditat).</p>`;
}

/* ── 💱 Divises (dins la pestanya del deute dels EUA) ─────────────────────── */
function divisesHTML() {
  const V = D.divises;
  if (!V?.eer) return '';
  const NOM = { USD: '💵 Dòlar', EUR: '💶 Euro', JPY: '💴 Ien', CNY: '🇨🇳 Iuan', GBP: '💷 Lliura', CHF: '🇨🇭 Franc suís' };
  const COL = { USD: 'var(--s1)', EUR: 'var(--s2)', JPY: 'var(--s3)', CNY: 'var(--s8)', GBP: 'var(--s7)', CHF: 'var(--s4)' };
  const ult = s => { const k = Object.keys(s || {}).sort(); return k.length ? [k.at(-1), s[k.at(-1)]] : null; };
  const fa12 = (s, k) => s?.[`${+k.slice(0, 4) - 1}${k.slice(4)}`];
  const canvis = Object.keys(V.eer).map(c => { const u = ult(V.eer[c]); const a = fa12(V.eer[c], u[0]); return { c, name: NOM[c] || c, v: a ? (u[1] / a - 1) * 100 : null, mes: u[0] }; })
    .filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const eu = ult(V.eur?.USD), eu12 = eu ? fa12(V.eur.USD, eu[0]) : null;
  const us = ult(V.eer.USD), us12 = us ? fa12(V.eer.USD, us[0]) : null;
  const serie = c => Object.entries(V.eer[c]).filter(([k]) => k >= '2015').map(([k, v]) => [monthX(k), v]).sort((a, b) => a[0] - b[0]);
  return `
  <div class="card">
    <h3>💱 El dòlar i les altres monedes</h3>
    <p class="sub">Quan un país abarata la seva moneda, el seu deute (que és en aquesta moneda) pesa menys per als estrangers que el tenen, però les importacions
    s'encareixen. Per això es diu que els EUA "sacrifiquen el dòlar per salvar el deute".</p>
    <div class="tiles">
      ${eu ? tile('💶 Un euro val', nf(eu[1], 4) + ' $', `${esc(monthLabel(monthX(eu[0])))}${eu12 ? ` · fa un any: ${nf(eu12, 4)} $` : ''}`) : ''}
      ${us && us12 ? tile('💵 Força del dòlar en un any', sgn((us[1] / us12 - 1) * 100) + ' %', 'davant de 64 monedes (BIS)', Math.abs(us[1] / us12 - 1) < 0.005 ? '<span class="badge warn">≈ igual</span>' : us[1] < us12 ? '<span class="badge warn">▼ més feble</span>' : '<span class="badge good">▲ més fort</span>') : ''}
    </div>
    <h3>Força de cada moneda des del 2015</h3>
    <p class="sub">Tipus de canvi efectiu nominal (mitjana ponderada davant dels socis comercials), 2020 = 100. Si puja, la moneda s'enforteix.</p>
    ${chart('c-divises', el => lineChart(el, { title: 'Tipus de canvi efectiu', months: true, zero: false, fmt: v => nf(v, 1), ref: { y: 100, label: 'nivell del 2020' },
      series: Object.keys(V.eer).map(c => ({ name: NOM[c] || c, short: (NOM[c] || c).split(' ').slice(1).join(' '), color: COL[c] || 'var(--s5)', pts: serie(c) })) }))}
    <div class="grid g2" style="margin-top:14px">
      <div><h3>Canvi en un any</h3><p class="sub">Tipus de canvi efectiu, fins a ${esc(monthLabel(monthX(canvis[0]?.mes || '2026-01')))}.</p>${barsHTML(canvis, { fmt: v => sgn(v) + ' %' })}</div>
      <div class="callout"><b>Per què el ien s'ha enfonsat?</b>
        <p class="sub">El Japó va mantenir els tipus a zero durant anys i el seu banc central va comprar gairebé la meitat del deute públic. Quan la resta del món
        va apujar tipus, els diners van marxar del ien. És el precedent que Juan Ramón Rallo cita per als EUA: una política monetària al servei del deute
        acaba pagant-se amb una moneda més feble i més inflació.</p>
        <p class="muted">Fonts: BIS (tipus de canvi efectius) i BCE (canvi de l'euro).</p></div>
    </div>
  </div>`;
}

/* ── 🏗️ Població nova vs habitatges (dins L'altra cara) ─────────────────────── */
function obraNovaHTML() {
  const M = DM();
  if (!M.ESP?.llicencies) return '';
  const necessaris = (c, a) => { const pb = M[c]?.creixPob?.[a], ll = M[c]?.llar?.[a] ?? M[c]?.llar?.[a - 1]; return pb != null && ll ? pb / ll : null; };
  const e = M.ESP;
  const anys = Object.keys(e.llicencies).map(Number).filter(a => a >= 2005 && necessaris('ESP', a) != null).sort();
  const aU = anys.at(-1);
  const desde = 2015;
  const acumNec = anys.filter(a => a >= desde).reduce((s, a) => s + necessaris('ESP', a), 0);
  const acumLlic = anys.filter(a => a >= desde).reduce((s, a) => s + e.llicencies[a], 0);
  const paisos = Object.keys(M).filter(c => c !== 'EU' && M[c].llicencies);
  const rati = paisos.map(c => {
    const as = Object.keys(M[c].llicencies).map(Number).filter(a => a >= desde && necessaris(c, a) != null);
    const n = as.reduce((s, a) => s + necessaris(c, a), 0), l = as.reduce((s, a) => s + M[c].llicencies[a], 0);
    return { c, name: imNom(c), v: n > 0 ? l / n * 100 : null };
  }).filter(r => r.v != null).sort((a, b) => a.v - b.v);
  return `
  <div class="card">
    <h3>🏗️ Gent nova vs habitatges nous</h3>
    <p class="sub">Si la població creix, calen habitatges. Una aproximació senzilla: <b>creixement de la població ÷ persones per llar</b>. Ho comparem amb els
    habitatges que reben <b>llicència d'obra</b> cada any (encara no construïts: solen trigar dos o tres anys a acabar-se).</p>
    <div class="tiles">
      ${tile(`Població nova a Espanya (${aU})`, '+' + int(e.creixPob[aU]), `unes ${int(necessaris('ESP', aU))} llars noves (${nf(e.llar[aU] ?? e.llar[aU - 1], 1)} persones per llar)`)}
      ${tile(`Llicències d'habitatge (${aU})`, int(e.llicencies[aU]), e.llicencies[aU] >= necessaris('ESP', aU) ? 'ja cobreixen el creixement d\'aquest any' : 'no arriben a cobrir el creixement')}
      ${tile(`Dèficit acumulat des del ${desde}`, int(Math.max(0, acumNec - acumLlic)), `llars necessàries ${int(acumNec)} · llicències ${int(acumLlic)}`, acumNec > acumLlic ? '<span class="badge bad">▲ falten habitatges</span>' : '')}
    </div>
    ${chart('c-obra', el => lineChart(el, { title: 'Llars necessàries i llicències a Espanya', fmt: v => int(v), tick: v => Math.abs(v) >= 1000 ? nf(v / 1000, 0) + ' mil' : v,
      series: [{ name: 'Llars noves necessàries (creixement de la població ÷ mida de la llar)', short: 'Necessàries', color: 'var(--s2)', pts: anys.map(a => [a, necessaris('ESP', a)]) },
               { name: 'Habitatges amb llicència d\'obra', short: 'Llicències', color: 'var(--s1)', pts: anys.map(a => [a, e.llicencies[a]]) }] }))}
    <div class="grid g2" style="margin-top:14px">
      <div><h3>Llicències per cada 100 llars necessàries (des del ${desde})</h3><p class="sub">Per sota de 100, la construcció no segueix el creixement de la població.
        Els països on la població baixa no hi surten (no necessiten llars noves per aquest motiu).</p>
        ${barsHTML(rati, { fmt: v => nf(v, 0), me: 'ESP', ref: { v: 100, label: 'el punt d\'equilibri (100)' } })}</div>
      <div class="callout"><b>Com es llegeix?</b>
        <p class="sub">La bombolla del 2006-2008 es veu com un excés enorme de llicències. Després, durant una dècada, gairebé no es va construir, i quan la població
        va tornar a créixer amb força (sobretot per la immigració) els habitatges no hi eren. Aquesta és la base de la pujada de preus, més enllà de l'especulació.</p>
        <p class="muted">És una aproximació: no compta pisos buits, segones residències, pisos turístics ni la gent jove que vol emancipar-se. Font: Eurostat.</p></div>
    </div>
  </div>`;
}

/* ── 📏 Bons a 2, 10 i 30 anys (dins la pestanya Deute) ───────────────────── */
const LL_NOM = { USA: '🇺🇸 EUA', JPN: '🇯🇵 Japó', EURO: '🇪🇺 Zona euro (AAA)' };
const LL_COL = { USA: 'var(--s1)', JPN: 'var(--s3)', EURO: 'var(--s2)' };
function llargHTML() {
  const L = D.llarg;
  if (!L || !Object.keys(L).length) return '';
  const zones = Object.keys(LL_NOM).filter(z => L[z]);
  const pts = (z, i) => Object.entries(L[z]).filter(([, v]) => v[i] != null).map(([k, v]) => [monthX(k), v[i]]).sort((a, b) => a[0] - b[0]);
  const ult = z => { const k = Object.keys(L[z]).filter(k => L[z][k][2] != null).sort().at(-1); return k ? [k, L[z][k]] : null; };
  const maxDes = (z, i, v, k) => { // des de quin any no era tan alt
    const ant = Object.entries(L[z]).filter(([kk, x]) => kk < k && x[i] != null && x[i] >= v).map(([kk]) => kk).sort().at(-1);
    return ant ? `el més alt des del ${monthLabel(monthX(ant))}` : 'el més alt de la sèrie (des del 2000)';
  };
  return `
  <div class="card">
    <h3>📏 El deute a 30 anys: el termòmetre de la confiança a llarg termini</h3>
    <p class="sub">Quan un estat s'endeuta a 30 anys, qui li deixa els diners demana un extra per la incertesa: inflació futura, dèficits, política.
    Si aquest tipus puja encara que el banc central abaixi els seus, és que els mercats <b>desconfien del llarg termini</b>.</p>
    <div class="tiles">
      ${zones.map(z => { const u = ult(z); return u ? tile(`${LL_NOM[z]} · bo a 30 anys`, pct(u[1][2], 2), `${esc(monthLabel(monthX(u[0])))} · ${esc(maxDes(z, 2, u[1][2], u[0]))}`) : ''; }).join('')}
    </div>
    <h3>Tipus a 30 anys</h3>
    <p class="sub">Mitjana mensual. El Japó ha passat de gairebé zero a màxims de dècades; els EUA ja paguen més que abans de la crisi del 2008.</p>
    ${chart('c-30a', el => lineChart(el, { title: 'Bons a 30 anys', months: true, fmt: v => pct(v, 2), tick: v => v + ' %',
      series: zones.map(z => ({ name: LL_NOM[z], short: LL_NOM[z].split(' ').slice(1).join(' '), color: LL_COL[z], pts: pts(z, 2) })) }))}
    <h3 style="margin-top:14px">Diferència entre el tipus a 10 anys i a 2 anys</h3>
    <p class="sub">Normalment prestar a 10 anys paga més que a 2 (la línia és positiva). Quan es torna <b>negativa</b> ("corba invertida"), el mercat espera
    que el banc central hagi d'abaixar tipus perquè ve una desacceleració; ha passat abans de moltes recessions. Quan torna a pujar ràpid pot voler dir
    més por a la inflació i al deute.</p>
    ${chart('c-pendent', el => lineChart(el, { title: 'Pendent de la corba', months: true, fmt: v => sgn(v, 2) + ' punts', tick: v => nf(v, 1),
      series: zones.map(z => ({ name: LL_NOM[z], short: LL_NOM[z].split(' ').slice(1).join(' '), color: LL_COL[z],
        pts: Object.entries(L[z]).filter(([, v]) => v[0] != null && v[1] != null).map(([k, v]) => [monthX(k), v[1] - v[0]]).sort((a, b) => a[0] - b[0]) })) }))}
    <p class="muted">Fonts: Tresor dels EUA, Ministeri d'Hisenda del Japó i BCE (bons de la zona euro amb qualificació AAA).</p>
  </div>`;
}

/* ── 📊 Borsa ───────────────────────────────────────────────────────────────── */
let borsaPais = lsGet('economia_borsapais', 'USA');
function renderBorsa() {
  const B = D.borsa || {};
  if (!B.index && !B.capPib) return '<p class="muted">Aquestes dades encara no s\'han baixat.</p>';
  const I = B.index || {}, C = B.capPib || {};
  const ultI = c => { const k = Object.keys(I[c] || {}).sort().at(-1); return k ? [k, I[c][k]] : null; };
  const mitjanaAny = (c, a) => { const v = Object.entries(I[c] || {}).filter(([k]) => k.startsWith(a + '-')).map(([, x]) => x); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const paisos = countries().filter(c => I[c]);
  const p = paisos.includes(borsaPais) ? borsaPais : 'USA';
  const u = ultI(p);
  const capU = c => { const ks = Object.keys(C[c] || {}); if (!ks.length) return null; const a = Math.max(...ks.map(Number)); return [a, C[c][a]]; };
  const cUSA = capU('USA');
  const maxUSA = C.USA ? Object.entries(C.USA).reduce((m, e) => e[1] > m[1] ? e : m) : null;
  const dot = C.USA?.[2000];
  // borsa vs economia vs sous (2015 = 100)
  const any0 = 2015;
  const serieAny = (f) => { const out = []; for (let a = any0; a <= Y; a++) { const v = f(a); if (v != null) out.push([a, v]); } return out; };
  const bI = serieAny(a => { const v = mitjanaAny(p, a), b = mitjanaAny(p, any0); return v && b ? v / b * 100 : null; });
  const acumPib = a => { const b = val(p, 'pib', any0), v = val(p, 'pib', a); return b && v ? v / b * 100 : null; }; // PIB en dòlars corrents
  const souN = ent(p).s.souNom;
  const bS = souN ? serieAny(a => souN[a] && souN[any0] ? souN[a] / souN[any0] * 100 : null) : [];
  const creixBorsa = (c) => { const v = ultI(c), b = mitjanaAny(c, any0); return v && b ? (v[1] / b - 1) * 100 : null; };
  const ranking = paisos.map(c => ({ c, name: label(c), v: creixBorsa(c) })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  const capRank = countries().map(c => ({ c, name: label(c), v: capU(c)?.[1] })).filter(r => r.v != null).sort((a, b) => b.v - a.v);

  return `
  <div class="intro">
    <h2>📊 Borsa: màxims, concentració i la IA</h2>
    <p class="sub">La borsa ha pujat molt més que l'economia i que els sous, sobretot als EUA i sobretot per unes poques empreses tecnològiques.
    Aquí es veu quant, i per què alguns economistes parlen de bombolla. <b>No és cap consell d'inversió.</b></p>
    <div class="controls">País:
      <select onchange="borsaPais=this.value;lsSet('economia_borsapais',borsaPais);renderView()" aria-label="País">${paisos.map(c => `<option value="${c}" ${c === p ? 'selected' : ''}>${esc(label(c))}</option>`).join('')}</select>
    </div>
  </div>
  <div class="tiles">
    ${u ? tile(`📈 Borsa · ${esc(ent(p).nom)}`, sgn(creixBorsa(p), 0) + ' %', `des de la mitjana del ${any0} (${esc(monthLabel(monthX(u[0])))})`) : ''}
    ${cUSA ? tile('🇺🇸 Valor de la borsa dels EUA', pct(cUSA[1], 0), `del PIB (${cUSA[0]})`, dot && cUSA[1] > dot ? '<span class="badge bad">▲ per sobre del 2000</span>' : '') : ''}
    ${dot ? tile('El 2000 (bombolla puntcom)', pct(dot, 0), 'del PIB dels EUA') : ''}
    ${maxUSA ? tile('Màxim de la sèrie', pct(maxUSA[1], 0), `el ${maxUSA[0]}`) : ''}
  </div>

  <div class="card">
    <h3>Índex de la borsa (2015 = 100)</h3>
    <p class="sub">Mitjana mensual dels preus de les accions de cada país (OCDE). No inclou els dividends.</p>
    ${chipsHTML(c => !!I[c])}
    ${chart('c-borsa', el => lineChart(el, { title: 'Índex borsari', months: true, zero: false, fmt: v => nf(v, 0), ref: { y: 100, label: 'nivell del 2015' },
      series: sel.filter(c => I[c]).map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: Object.entries(I[c]).map(([k, v]) => [monthX(k), v]).sort((a, b) => a[0] - b[0]) })) }))}
  </div>

  <div class="grid g2">
    <div class="card">
      <h3>Quant ha pujat la borsa des del ${any0}</h3>
      <p class="sub">Del nivell mitjà del ${any0} a l'últim mes, en moneda de cada país i sense descomptar la inflació.</p>
      ${barsHTML(ranking, { fmt: v => sgn(v, 0) + ' %', me: p })}
    </div>
    <div class="card">
      <h3>Valor de la borsa en % del PIB</h3>
      <p class="sub">Valor de totes les empreses cotitzades del país dividit pel seu PIB (Banc Mundial). És l'"indicador Buffett": com més alt, més cara està la borsa respecte a l'economia real.</p>
      ${barsHTML(capRank, { fmt: v => pct(v, 0), me: p })}
    </div>
  </div>

  ${C.USA ? `<div class="card">
    <h3>🇺🇸 L'"indicador Buffett" als EUA</h3>
    <p class="sub">Valor de la borsa dels EUA en % del PIB. Les dues puntes anteriors van acabar malament: el 2000 (puntcom) i el 2021 (diners fàcils de la pandèmia).</p>
    ${chart('c-buffett', el => lineChart(el, { title: 'Valor de la borsa en % del PIB', fmt: v => pct(v, 0), tick: v => v + ' %', ref: dot ? { y: dot, label: 'nivell del 2000' } : null,
      series: ['USA', 'JPN', 'GBR', 'ESP'].filter(c => C[c]).map((c, i) => ({ name: label(c), short: ent(c).nom, color: `var(--s${i + 1})`, pts: Object.entries(C[c]).map(([a, v]) => [+a, v]) })) }))}
  </div>` : ''}

  ${bI.length > 1 ? `<div class="card">
    <h3>Borsa, economia i sous · ${esc(ent(p).nom)} (${any0} = 100)</h3>
    <p class="sub">Si la borsa puja molt més que l'economia i que els sous, qui té accions s'enriqueix més de pressa que qui viu del sou. És la "inflació d'actius" de la qual parlen tant Marc Vidal com Juan Ramón Rallo.</p>
    ${chart('c-borsa-pib', el => lineChart(el, { title: 'Borsa, PIB i sous', zero: false, fmt: v => nf(v, 0), ref: { y: 100, label: 'nivell del ' + any0 },
      series: [{ name: 'Borsa (mitjana anual)', short: 'Borsa', color: 'var(--s2)', pts: bI },
               { name: 'PIB en dòlars corrents (FMI)', short: 'PIB', color: 'var(--s1)', pts: serieAny(acumPib).filter(x => x[0] <= Y) },
               ...(bS.length > 1 ? [{ name: 'Sou mitjà en moneda del país (OCDE)', short: 'Sous', color: 'var(--s3)', pts: bS }] : [])] }))}
    <p class="muted">El PIB està en dòlars, i per als països que no fan servir el dòlar el tipus de canvi també el mou. L'any en curs de la borsa és la mitjana dels mesos que hi ha.</p>
  </div>` : ''}

  <div class="card">
    <h3>🤖 Concentració i IA: per què es parla de bombolla</h3>
    <div class="grid g2" style="margin-top:8px">
      <div><b>🎯 Pocs valors, molt pes</b><p class="sub">Els grans índexs pesen cada empresa pel seu valor. Quan unes poques tecnològiques valen molt, un fons indexat
      "diversificat" depèn sobretot d'elles. Marc Vidal cita que la tecnologia ja pesa prop del 39 % de l'S&P 500, per sobre del màxim de la bombolla
      puntcom, i que la correlació entre l'S&P 500 i el Nasdaq va tocar 0,98 el març del 2026.</p></div>
      <div><b>🏗️ La inversió en IA necessita diners</b><p class="sub">Els centres de dades costen centenars de milers de milions. Juan Ramón Rallo explica que aquesta
      demanda de finançament competeix amb els dèficits dels estats i empeny a l'alça els tipus a llarg termini (el bo dels EUA a 30 anys va arribar al
      5,22 % aquest estiu), cosa que alhora pot frenar la mateixa inversió en IA.</p></div>
      <div><b>🏦 L'avís del BIS</b><p class="sub">El Banc de Pagaments Internacionals (el "banc dels bancs centrals") ha alertat del risc que la valoració de les empreses
      d'IA sigui una bombolla que pugui punxar.</p></div>
      <div><b>⚖️ L'altra cara</b><p class="sub">No totes les pujades són bombolla: aquestes empreses tenen beneficis reals i molt alts. La pregunta és si el que es paga
      avui ja descompta massa creixement futur. Ningú no sap quan ni si hi haurà una correcció.</p></div>
    </div>
    <p class="muted" style="margin-top:10px">Les xifres de concentració (39 %, 0,98) són les que citen els divulgadors; l'app no en té una font oficial i oberta per verificar-les.
    La resta de dades d'aquesta pestanya són de l'OCDE, el Banc Mundial, l'FMI i el Tresor dels EUA. Res d'això és un consell d'inversió.</p>
  </div>
  <div class="card">
    <h3>🧊 I la lectura contrària: potser no és cap bogeria</h3>
    <p class="sub">Tot el que hi ha aquí sobre la concentració i la intel·ligència artificial és la visió dels qui avisen d'una bombolla. Val la pena sentir també
    els qui la desinflen. L'economista català <b>Xavier Sala i Martín</b> (Universitat de Colúmbia) sosté que bona part de l'alarma sobre la IA és soroll:
    que les màquines no han desobeït ningú i que el problema, quan n'hi ha, és de <b>persones que incompleixen lleis que ja existeixen</b>, no de tecnologia fora de control.
    També recorda que quan una empresa demana aturar el progrés, sol tenir-hi interessos propis.</p>
    <p class="sub">Aplicat a la borsa: que unes poques empreses pesin molt no vol dir automàticament que hi hagi bombolla. Les grans tecnològiques guanyen
    diners de veritat, i part de la inversió en centres de dades i xips acabarà produint més. La diferència entre una bombolla i un canvi tecnològic
    de debò no es veu clara fins que ha passat. Per això aquí hi ha les <b>dues lectures</b>, amb les dades al costat.</p>
    <p class="muted">Font: entrevistes de Xavier Sala i Martín a RAC1 (2025-2026). És l'opinió d'un economista, com les dels divulgadors citats més amunt: l'app no pren partit.</p>
  </div>
  ${petita(LP.borsa())}`;
}

const RAPID = {
  inici: () => {
    const W = 'WEOWORLD';
    return `L'economia mundial creix un <b>${pct(val(W, 'creix', Y))}</b> el ${Y} i la inflació és del <b>${pct(val(W, 'infl', Y))}</b>, més alta que el ${Y - 1} per l'energia.

  },
  inflacio: () => {
    const a0 = 2015, a1 = Y - 1, cr = cumInfl('ESP', a0, a1), fa = 1 + cr / 100;
    return `Des del ${a0}, a Espanya els <b>preus han pujat un ${pct(cr, 0)}</b>: el que valia 100 € ara en val ${nf(100 * fa, 0)} €.
    Una família que avui gasta 2.000 € al mes pagava ${nf(2000 / fa, 0)} € pel mateix el ${a0}, i qui tenia 10.000 € parats al banc n'ha perdut
    ${nf(10000 - 10000 / fa, 0)} € de poder de compra. <b>Què mirar:</b> la targeta "Com es nota a la butxaca".`;
  },
  sous: () => {
    const T = IMP().ESP, aT = impLast('ESP');
    let net = null;
    if (T?.net?.[2018] && aT) net = (T.net[aT] / T.net[2018] / (1 + (cumInfl('ESP', 2018, aT) || 0) / 100) - 1) * 100;
    const r = ent('ESP').s.souReal, a = lastYear('ESP', 'souReal');
    const g = (r[a] / r[2020] - 1) * 100;
    return `Del 2020 al ${a}, el sou mitjà a Espanya, descomptant la inflació, ha variat un <b>${sgn(g)} %</b>: ${g < 0 ? 'ha perdut poder adquisitiu' : g < 3 ? 'gairebé no ha guanyat poder adquisitiu' : g < 8 ? 'ha guanyat poc poder adquisitiu' : 'ha guanyat poder adquisitiu'}.
      ${net != null ? `I si hi sumes els impostos, el <b>sou net real és un ${nf(Math.abs(net), 1)} % ${net < 0 ? 'més baix' : 'més alt'} que el 2018</b>.` : ''}
      <b>Què mirar:</b> en quins països els sous han guanyat a la inflació.`;
  },
  impostos: () => {
    const e = IMP().ESP, a = impLast('ESP');
    return `L'IRPF d'un sou mitjà a Espanya ha passat del <b>${pct(e.irpf[2020])} al ${pct(e.irpf[a])}</b> del 2020 al ${a}, sense canviar cap llei:
      és la <b>progressivitat en fred</b>. De cada 100 € que paga l'empresa, l'estat se'n queda ${nf(e.cunya[a], 0)}. <b>Què mirar:</b> l'exemple amb números i el sou net real.`;
  },
  altra: () => {
    const H = D.altra?.habitatge?.ESP?.anual, S = ent('ESP').s.souReal;
    const a = Math.min(Math.max(...Object.keys(H).map(Number)), lastYear('ESP', 'souReal'));
    return `Des del 2015, a Espanya els <b>pisos han pujat un ${pct((H[a] / H[2015] - 1) * 100, 0)}</b> per sobre de la inflació i els <b>sous un ${pct((S[a] / S[2015] - 1) * 100, 0)}</b>.
      Els bancs centrals han creat diners com mai des del 2008 i compren or per no dependre del dòlar. Les dades oficials són certes, però no ho expliquen tot.`;
  },
  deute: () => {
    const de = D.fiscal?.bons?.DEU, es = D.fiscal?.bons?.ESP;

    return `Espanya deu el <b>${pct(val('ESP', 'deute', Y), 0)} del PIB</b> i en paga el ${pct(interessos('ESP', Y))} en interessos cada any${m ? `; la seva prima de risc és de ${nf((es[m] - de[m]) * 100, 0)} punts` : ''}.
      Els EUA, França i el Japó deuen més i cada cop els costa més: els tipus a 30 anys són els més alts en dècades. <b>Què mirar:</b> la prima de risc i els interessos.`;
  },
  eua: () => {
    const U = D.eua, T = U.tenidors || {}, k = Object.keys(T.TOTAL || {}).sort().at(-1);
    return `Els EUA deuen <b>${bil(U.deuteUltim[1])}</b>, i el deute creix a un ritme rècord. Els governs estrangers en venen bons, però els inversors privats n'hi compren més,
      sovint amb diners manllevats a curt termini. El "coixí" de liquiditat de la Fed és gairebé buit: el sistema té menys marge per aguantar un ensurt.`;
  },
  borsa: () => {
    const C = D.borsa?.capPib?.USA; const a = C ? Math.max(...Object.keys(C).map(Number)) : null;
    return `La borsa dels EUA val el <b>${pct(C?.[a], 0)} del PIB</b> (${a}), més que a la bombolla del 2000 (${pct(C?.[2000], 0)}). Ha pujat molt més que l'economia i que els sous,
      i unes poques tecnològiques en tenen gran part del pes. <b>No és cap consell d'inversió.</b>`;
  },
  tipus: () => {
    const c = lastChange('XM'), T = D.tipus?.XM, k = Object.keys(T || {}).sort().at(-1), inf = val('EURO', 'infl', Y);

      Amb una inflació del ${pct(inf)}, el tipus real és de ${sgn(T[k] - inf, 2)} punts. Quan els tipus pugen, hipoteques i préstecs s'encareixen i la inflació es frena.`;
  },

  immigracio: () => {
    const e = IE().ESP, [aF, f] = imLast('ESP', 'nascutsFora'), [aO, o] = imLast('ESP', 'ordres');

      Com que les pensions es paguen amb les cotitzacions d'avui, el sistema haurà de canviar: jubilació més tardana, més cotitzacions, pensions més baixes o més treballadors.`;
  },
};

function plega(el) {
  const nodes = [...el.children];
  let keep = nodes[0]?.classList.contains('intro') ? 1 : 0;
  if (nodes[keep]?.classList.contains('tiles')) keep++;
  const rap = rapidHTML(view);
  if (rap) (keep ? nodes[0].insertAdjacentHTML('afterend', rap) : el.insertAdjacentHTML('afterbegin', rap));
  const resta = [];
  for (const n of nodes.slice(keep)) { if (n.classList.contains('sempre')) el.appendChild(n); else resta.push(n); }
  if (!resta.length) return;
  const det = document.createElement('details');
  det.className = 'detall';
  det.open = !!detallObert[view];
  const blocs = resta.reduce((s, n) => s + (n.classList.contains('grid') ? n.querySelectorAll(':scope > .card, :scope > div').length : 1), 0);
  det.innerHTML = `<summary><span class="dobre">📊 Veure el detall</span><span class="dtanca">▲ Amagar el detall</span><span class="muted">${blocs} blocs amb gràfics, comparacions i fonts</span></summary>`;
  resta.forEach(n => det.appendChild(n));
  el.appendChild(det);
}

function glossaritza(el) {
  if (view === 'aprendre') return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode: n => !n.nodeValue.trim() || n.parentElement.closest(NO_GLOS) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const [t, d, re] of GLOSSARI) {
    if (!re) continue;
    for (const n of nodes) {
      if (!n.parentNode) continue;
      const m = re.exec(n.nodeValue);
      if (!m) continue;
      const trobat = n.splitText(m.index), resta = trobat.splitText(m[0].length);
      const ab = document.createElement('abbr');
      ab.className = 'terme'; ab.tabIndex = 0; ab.dataset.t = t; ab.dataset.d = d; ab.textContent = trobat.nodeValue;
      trobat.replaceWith(ab);
      nodes.push(resta);
      break; // només la primera aparició de cada terme a cada pàgina
    }
  }
}
function mostraTerme(a) {
  const tip = $('#glostip');
  tip.innerHTML = `<b>${esc(a.dataset.t)}</b><p>${esc(a.dataset.d)}</p><a href="#aprendre">Tot el glossari →</a>`;
  tip.style.display = 'block';
  const r = a.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  tip.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';
}
const amagaTerme = () => { const t = $('#glostip'); if (t) t.style.display = 'none'; };
document.addEventListener('mouseover', e => { const a = e.target.closest?.('abbr.terme'); if (a) mostraTerme(a); });
document.addEventListener('mouseout', e => { if (e.target.closest?.('abbr.terme') && !e.relatedTarget?.closest?.('#glostip')) amagaTerme(); });
document.addEventListener('focusin', e => { const a = e.target.closest?.('abbr.terme'); if (a) mostraTerme(a); });
document.addEventListener('click', e => {
  const a = e.target.closest?.('abbr.terme');
  if (a) { mostraTerme(a); return; }
  if (!e.target.closest?.('#glostip') || e.target.closest?.('#glostip a')) amagaTerme();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') amagaTerme(); });
addEventListener('scroll', amagaTerme, { passive: true });

/* ── 📊 Comparar ────────────────────────────────────────────────────────────── */
const COLS = [
  ['pib', 'PIB', money, null], ['creix', 'Creix.', v => sgn(v) + ' %', null], ['infl', 'Inflació', v => pct(v), [5]],
  ['atur', 'Atur', v => pct(v), [10]], ['deute', 'Deute', v => pct(v, 0), [100]], ['deficit', 'Saldo públic', v => sgn(v) + ' %', null],
  ['pibpc', 'PIB/hab.', v => int(v) + ' $', null], ['pob', 'Població', v => nf(v, v < 10 ? 1 : 0) + ' M', null],
];
let sortK = 'pib', sortDir = -1, cmpY = null;
function sortBy(k) { if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = k === 'nom' ? 1 : -1; } renderView(); }
function renderComparar() {
  const ay = cmpY ?? Y;
  const years = Object.keys(D.paisos.USA.s.pib).map(Number);
  const key = c => sortK === 'nom' ? ent(c).nom : val(c, sortK, ay);
  const cs = countries().sort((a, b) => {
    const x = key(a), y = key(b);
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y, 'ca') : x - y) * sortDir;
  });
  const cell = (c, [k, , f, lim]) => {
    const v = val(c, k, ay);
    const cls = lim && v != null && v >= lim[0] ? 'hi' : '';
    return `<td class="num ${cls}">${esc(f(v))}</td>`;
  };
  const th = (k, t) => `<th class="${sortK === k ? 'on' : ''}" onclick="sortBy('${k}')">${t}${sortK === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  return `
  <div class="intro">
    <h2>📊 Comparar tots els països</h2>
    <p class="sub">Toca el títol d'una columna per ordenar. En vermell, valors preocupants (inflació ≥ 5 %, atur ≥ 10 %, deute ≥ 100 %).</p>
    <div class="controls">Any:
      <select onchange="cmpY=+this.value;renderView()" aria-label="Any">${years.map(a => `<option value="${a}" ${a === ay ? 'selected' : ''}>${a}${a >= Y ? ' (previsió)' : ''}</option>`).join('')}</select>
    </div>
  </div>
  <div class="card tablewrap">
    <table>
      <thead><tr>${th('nom', 'País')}${COLS.map(([k, t]) => th(k, t)).join('')}</tr></thead>
      <tbody>
        ${cs.map(c => `<tr><td><a href="#pais" onclick="fitxa='${c}';lsSet('economia_fitxa','${c}')">${esc(label(c))}</a></td>${COLS.map(col => cell(c, col)).join('')}</tr>`).join('')}
        ${Object.keys(D.grups).map(c => `<tr class="grp"><td>${esc(label(c))}</td>${COLS.map(col => cell(c, col)).join('')}</tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ── 📘 Com funciona ────────────────────────────────────────────────────────── */
function renderAprendre() {
  const G = GLOSSARI;
  return `
  <div class="intro">
    <h2>📘 Com funciona l'economia mundial</h2>
    <p class="sub">Una explicació curta de les peces principals i de com es mouen juntes.</p>
  </div>
  <div class="card">
    <h3>🔍 Com llegir les xifres oficials sense empassar-te-les</h3>
    <p class="sub">Aquesta app només fa servir dades oficials (FMI, OCDE, BCE, Eurostat, BIS, Tresor dels EUA, Idescat). No perquè siguin la veritat absoluta,
    sinó perquè es poden comprovar. Ara bé, cap xifra és innocent: totes decideixen què compten i què deixen fora. La regla d'aquí és senzilla:
    <b>criticar no és inventar</b>. De cada dada diem què mesura, què no mesura i on mirar-ho.</p>
    <div class="grid g2">
      <div><b>🏭 El PIB</b><p class="sub">Compta activitat, no si vivim millor. Un país pot créixer només perquè hi ha més gent.
      <a href="#creixement">D'on surt el creixement →</a></p></div>
      <div><b>🛒 L'IPC</b><p class="sub">És una cistella mitjana i no hi entra el preu de comprar un pis, només el lloguer. La teva inflació pot ser més alta.
      <a href="#inflacio">Calcula la teva →</a></p></div>
      <div><b>💶 El sou mitjà</b><p class="sub">L'estiren els sous alts. El del mig (medià) és més baix, i la renda de les llars es mou diferent.
      <a href="#creixement">Mediana vs mitjana →</a></p></div>
      <div><b>🏦 El deute públic</b><p class="sub">En % del PIB pot baixar mentre els euros deguts pugen. I no inclou les pensions promeses.
      <a href="#deute">Mira-ho →</a></p></div>
      <div><b>📉 L'atur</b><p class="sub">És una enquesta: ocupat = has treballat una hora la setmana passada. Qui deixa de buscar feina desapareix de l'estadística.</p></div>
      <div><b>🔮 Les previsions</b><p class="sub">Les de l'FMI es refan cada sis mesos i s'equivoquen sovint. Aquí surten ombrejades: són una hipòtesi, no el futur.</p></div>
    </div>
    <p class="muted">A cada pestanya hi trobaràs un desplegable <b>🔍 La lletra petita</b> amb els límits d'aquelles dades concretes.
    I si una xifra oficial contradiu un text escrit a mà d'aquesta app, la que està malament és la frase.</p>
  </div>
  <div class="card">
    <h3>El cicle en un dibuix</h3>
    <div class="flow">
      <div class="step"><b>👩‍🔧 Treballem</b>Les empreses produeixen i paguen sous.</div><div class="arr">→</div>
      <div class="step"><b>🛍️ Gastem</b>Amb el sou comprem, i les empreses venen.</div><div class="arr">→</div>
      <div class="step"><b>🏛️ Paguem impostos</b>L'estat en treu sanitat, escoles i pensions.</div><div class="arr">→</div>
      <div class="step"><b>🏦 Estalviem i demanem prestat</b>Els bancs mouen els diners de qui en té a qui en necessita.</div>
    </div>
    <p class="sub" style="margin-top:10px">Tot això sumat és el <b>PIB</b>. Si la gent gasta més del que les empreses poden produir, els preus pugen (<b>inflació</b>).
    Si gasta menys, les empreses venen menys i acomiaden gent (<b>atur</b>). El <b>banc central</b> intenta mantenir l'equilibri amb els tipus d'interès,
    i l'<b>estat</b> amb els impostos i la despesa: si gasta més del que ingressa, té <b>dèficit</b> i s'endeuta.</p>
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Els quatre termòmetres</h3>
      <p><b>🏭 Creixement</b> — si l'economia es fa gran. Sa: 1,5-3 % als països rics.</p>
      <p><b>🛒 Inflació</b> — si els preus pugen. Objectiu: 2 %.</p>
      <p><b>👷 Atur</b> — si hi ha feina per a tothom. Sa: per sota del 5 %.</p>
      <p><b>🏦 Deute</b> — si l'estat pot pagar el que deu. Les normes europees demanen menys del 60 %.</p>
    </div>
    <div class="card">
      <h3>Per què tot està connectat?</h3>
      <p class="sub">Un exemple real, el 2022: la guerra encareix el gas → puja l'electricitat i el transport → puja la inflació →
      el BCE apuja els tipus → pugen les hipoteques → les famílies gasten menys → l'economia creix menys → la inflació baixa.</p>
      <p class="sub">Mentrestant, els estats paguen més interessos pel seu deute, i els sous van per darrere dels preus fins que es negocien nous convenis.</p>
    </div>
  </div>
  <div class="card">
    <h3>Glossari</h3>
    ${G.map(([t, d]) => `<details class="glos"><summary>${esc(t)}</summary><p>${esc(d)}</p></details>`).join('')}
  </div>`;
}

/* ── Init ───────────────────────────────────────────────────────────────────── */
function fontsText() {
  const f = D.fonts || {};
  const names = [...new Set(Object.values(f).map(x => x.font))];
  return `Dades actualitzades el ${esc(D.generat)}. Fonts: ${names.map(esc).join(' · ')}.`;
}
async function init() {
  $('#ver').textContent = `${APP_VERSION} (${BUILD_DATE})`;
  try {
    const r = await fetch('dades.json', { cache: 'no-cache', signal: AbortSignal.timeout(15000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  } catch (e) {
    // sense xarxa ni cache del service worker: intentem la còpia de localStorage
    D = lsGet(LS_DATA, null);
    if (!D) { $('#loading').textContent = 'No s\'han pogut carregar les dades. Comprova la connexió i torna-ho a provar.'; return; }
  }
  Y = +D.generat.slice(0, 4);
  sel = sel.filter(c => ent(c)); if (!sel.length) sel = [...DEFAULT_SEL];
  fixColors(sel, colorOf);
  $('#loading').remove();
  $('#fonts').innerHTML = fontsText();
  go(location.hash.slice(1) || 'resum');
  setTimeout(() => lsSet(LS_DATA, D), 1000);
}
init();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
