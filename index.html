<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economia Mundial — explicada fàcil</title>
<meta name="description" content="Deute, inflació, sous, tipus d'interès i creixement dels principals països del món, explicats de manera senzilla. Dades de l'FMI, l'OCDE i el BIS.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1b2d">
<!-- Política de seguretat de contingut: l'app només llegeix dades.json del mateix servidor.
     Tota la interactivitat va amb onclick en línia, per això cal 'unsafe-inline' als scripts. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self';
  font-src 'self';
  manifest-src 'self';
  worker-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'none';
  frame-src 'none'">
<style>
/* ── Variables ──────────────────────────────────────────────────────────────── */
:root {
  color-scheme: dark;
  --bg: #0c1626;
  --bg-2: #111f33;
  --card: #15263d;
  --card-2: #1a2e48;
  --text: #eef3f8;
  --text-2: #a9b8c9;
  --muted: #7d8ea3;
  --border: rgba(148,178,214,0.16);
  --grid: rgba(148,178,214,0.12);
  --accent: #3987e5;
  --shadow: rgba(0,0,0,0.35);
  --neg: #e66767;
  --pos: #3987e5;
  --mid: #383835;
  --good: #3fb97a;
  --warn: #e0a526;
  --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #2f9e2f; --s7: #9085e9; --s8: #e66767;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9;
  --bg-2: #ffffff;
  --card: #ffffff;
  --card-2: #f2f5f9;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #74736e;
  --border: rgba(20,40,70,0.12);
  --grid: rgba(20,40,70,0.09);
  --accent: #2a78d6;
  --shadow: rgba(20,40,70,0.08);
  --neg: #e34948;
  --pos: #2a78d6;
  --mid: #f0efec;
  --good: #1d8a4f;
  --warn: #b77900;
  --bad: #d23b3a;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}

/* ── Base ───────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; margin-bottom: 6px; }
h3 { font-size: 1.02rem; margin-bottom: 4px; }
p { margin: 0 0 10px; }
.sub { color: var(--text-2); }
.muted { color: var(--muted); font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* ── Capçalera i pestanyes ─────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.top { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; }
.top h1 { font-size: 1.15rem; flex: 1; }
.top h1 span { color: var(--muted); font-weight: 500; font-size: .9rem; }
.iconbtn {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  width: 38px; height: 38px; cursor: pointer; font-size: 1.05rem;
}
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  flex: none; border: 1px solid transparent; background: none; cursor: pointer;
  padding: 7px 12px; border-radius: 999px; color: var(--text-2); white-space: nowrap;
}
nav.tabs button:hover { background: var(--card); }
nav.tabs button.on { background: var(--accent); color: #fff; }

main { padding: 18px 0 40px; }
section.view { display: none; }
section.view.on { display: block; }

/* ── Targetes ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px var(--shadow);
}
.card > h3 + .sub { margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.intro { margin-bottom: 16px; }
.intro p { max-width: 70ch; }

/* Xifres destacades */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.tile .k { color: var(--text-2); font-size: .82rem; }
.tile .v { font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0; }
.tile .d { color: var(--muted); font-size: .8rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge.good { color: var(--good); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }

/* Explicacions */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin: 10px 0 4px; }
.flow .step { flex: 1 1 150px; background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.flow .step b { display: block; margin-bottom: 2px; }
.flow .arr { align-self: center; color: var(--muted); font-size: 1.2rem; }
.concept .emo { font-size: 1.6rem; }
details.glos { border-top: 1px solid var(--border); padding: 10px 0; }
details.glos summary { cursor: pointer; font-weight: 600; }
details.glos p { margin: 6px 0 0; color: var(--text-2); }
.callout { border-left: 3px solid var(--accent); background: var(--card-2); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 10px 0; }

/* ── Controls ───────────────────────────────────────────────────────────────── */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card-2); border-radius: 999px;
  padding: 4px 10px; font-size: .85rem; color: var(--text-2);
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip.on { color: var(--text); border-color: currentColor; background: var(--card); }
.chip.on .dot { box-shadow: 0 0 0 2px var(--card); }
select, input[type=number] {
  background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
}
.more { font-size: .85rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px; }

/* ── Gràfics ────────────────────────────────────────────────────────────────── */
.chart { position: relative; width: 100%; min-height: 120px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .lbl { fill: var(--text-2); font-size: 12px; font-weight: 600; }
.chart .grid line { stroke: var(--grid); }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .fc { fill: var(--text); opacity: .045; }
.chart .hl { stroke: var(--muted); stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--text-2); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px) !important; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 150px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px; font-size: .8rem; box-shadow: 0 6px 20px var(--shadow); display: none;
}
.tip .t { font-weight: 650; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .r span:first-child { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; }

/* Barres horitzontals */
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 70px; align-items: center; gap: 10px; font-size: .86rem; padding: 2px 4px; border-radius: 6px; }
.bar:hover { background: var(--card-2); }
.bar.me { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.bar .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .track { position: relative; height: 16px; }
.bar .fill { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; }
.bar .axis0 { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; }
.bar.pair .dbl { display: grid; gap: 3px; }
.bar.pair .track { height: 11px; }
.bar.pair .val { display: grid; line-height: 1.15; font-size: .8rem; }
.bar .ref { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--text-2); }

/* Taula */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card); }
th.on { color: var(--text); }
tr.grp td { color: var(--text-2); font-style: italic; }
td.hi { color: var(--bad); font-weight: 600; }
td.lo { color: var(--good); font-weight: 600; }

/* Calculadora */
.calc { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.calc .res { font-size: 1.6rem; font-weight: 650; }

footer { border-top: 1px solid var(--border); padding: 20px 0 40px; color: var(--muted); font-size: .82rem; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

@media (max-width: 560px) {
  body { font-size: 14px; }
  .card { padding: 14px; border-radius: 14px; }
  .tile .v { font-size: 1.55rem; }
  .bar { grid-template-columns: 105px 1fr 58px; gap: 6px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar .fill { transition: width .35s ease, left .35s ease; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>🌍 Economia Mundial <span>explicada fàcil</span></h1>
      <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="Canvia el tema" aria-label="Canvia el tema">🌓</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Seccions">
      <button data-v="inici" onclick="go('inici')">🏠 Inici</button>
      <button data-v="inflacio" onclick="go('inflacio')">🛒 Inflació</button>
      <button data-v="sous" onclick="go('sous')">💶 Sous</button>
      <button data-v="deute" onclick="go('deute')">🏦 Deute</button>
      <button data-v="tipus" onclick="go('tipus')">📈 Tipus d'interès</button>
      <button data-v="creixement" onclick="go('creixement')">🏭 Creixement</button>
      <button data-v="pais" onclick="go('pais')">📍 Fitxa de país</button>
      <button data-v="altra" onclick="go('altra')">🔍 L'altra cara</button>
      <button data-v="comparar" onclick="go('comparar')">📊 Comparar</button>
      <button data-v="aprendre" onclick="go('aprendre')">📘 Com funciona</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app">
  <div class="loading" id="loading">Carregant dades…</div>

  <!-- ── Inici ── -->
  <section class="view" id="v-inici"></section>
  <!-- ── Inflació ── -->
  <section class="view" id="v-inflacio"></section>
  <!-- ── Sous ── -->
  <section class="view" id="v-sous"></section>
  <!-- ── Deute ── -->
  <section class="view" id="v-deute"></section>
  <!-- ── Tipus ── -->
  <section class="view" id="v-tipus"></section>
  <!-- ── Creixement ── -->
  <section class="view" id="v-creixement"></section>
  <!-- ── País ── -->
  <section class="view" id="v-pais"></section>
  <!-- ── Comparar ── -->
  <section class="view" id="v-comparar"></section>
  <!-- ── L'altra cara ── -->
  <section class="view" id="v-altra"></section>
  <!-- ── Aprendre ── -->
  <section class="view" id="v-aprendre"></section>
</main>

<footer>
  <div class="wrap">
    <p id="fonts"></p>
    <p>Els anys ombrejats als gràfics són <b>previsions</b> de l'FMI, no dades reals. Les xifres de l'FMI es revisen dues vegades l'any (abril i octubre).
    Aquesta app no desa res a cap servidor.</p>
    <p>Versió <span id="ver"></span></p>
  </div>
</footer>

<script>
/* ── Configuració ───────────────────────────────────────────────────────────── */
const APP_VERSION = '1.2.0';
const BUILD_DATE = '2026-09-16';
const LS_THEME = 'economia_theme';
const LS_SEL = 'economia_sel';
const LS_BANKS = 'economia_banks';
const LS_PAIS = 'economia_pais';
const LS_DATA = 'economia_dades_v1';
const MAX_SEL = 6;
const DEFAULT_SEL = ['ESP', 'USA', 'DEU', 'CHN', 'JPN'];
const DEFAULT_BANKS = ['XM', 'US', 'GB', 'JP', 'CH'];
const SLOTS = 8;

// Nom dels bancs centrals (codis del BIS)
const BANKS = {
  XM: 'BCE (zona euro)', US: 'Reserva Federal (EUA)', GB: 'Banc d\'Anglaterra', JP: 'Banc del Japó',
  CH: 'Banc Nacional Suís', CN: 'Banc Popular de la Xina', CA: 'Banc del Canadà', AU: 'Banc de la Reserva d\'Austràlia',
  IN: 'Banc de la Reserva de l\'Índia', BR: 'Banc Central del Brasil', MX: 'Banc de Mèxic', KR: 'Banc de Corea',
  SE: 'Riksbank (Suècia)', NO: 'Norges Bank', PL: 'Banc Nacional de Polònia', TR: 'Banc Central de Turquia',
  RU: 'Banc de Rússia', ZA: 'Banc de la Reserva de Sud-àfrica', ID: 'Banc d\'Indonèsia', SA: 'Banc Central Saudita',
  AR: 'Banc Central de l\'Argentina',
};
// País o grup que fa servir cada banc central (per comparar-ne la inflació)
const BANK_INFL = { XM: 'EURO', US: 'USA', GB: 'GBR', JP: 'JPN', CH: 'CHE', CN: 'CHN', CA: 'CAN', AU: 'AUS', IN: 'IND',
  BR: 'BRA', MX: 'MEX', KR: 'KOR', SE: 'SWE', NO: 'NOR', PL: 'POL', TR: 'TUR', RU: 'RUS', ZA: 'ZAF', ID: 'IDN', SA: 'SAU', AR: 'ARG' };

/* ── Helpers ────────────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? '–' : v.toLocaleString('ca-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? '–' : nf(v, d) + ' %';
const sgn = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + nf(v, d);
const money = v => v == null ? '–' : v >= 1000 ? nf(v / 1000, v >= 10000 ? 0 : 1) + ' bil. $' : nf(v, 0) + ' mil M $';
const int = v => v == null ? '–' : Math.round(v).toLocaleString('ca-ES');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lsGet = (k, def) => { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let D = null;          // dades.json
let Y = 2026;          // any "actual" (el de la descàrrega): a partir d'aquí són previsions
let view = 'inici';

const ent = c => D.paisos[c] || D.grups[c];
const isGroup = c => !!D.grups[c];
const val = (c, k, y) => ent(c)?.s[k]?.[y];
const pts = (c, k, from = 0, to = 9999) => Object.entries(ent(c)?.s[k] || {}).map(([a, v]) => [+a, v]).filter(([a]) => a >= from && a <= to);
const lastYear = (c, k, max = 9999) => { const ys = Object.keys(ent(c)?.s[k] || {}).map(Number).filter(a => a <= max); return ys.length ? Math.max(...ys) : null; };
const label = c => { const e = ent(c); return e ? `${e.flag} ${e.nom}` : c; };
const countries = () => Object.keys(D.paisos).sort((a, b) => (val(b, 'pib', Y) || 0) - (val(a, 'pib', Y) || 0));

// Preus acumulats: quant pugen els preus entre la mitjana de l'any a0 i la de l'any a1
function cumInfl(c, a0, a1) {
  let f = 1;
  for (let a = a0 + 1; a <= a1; a++) { const i = val(c, 'infl', a); if (i == null) return null; f *= 1 + i / 100; }
  return (f - 1) * 100;
}

/* ── Tema ───────────────────────────────────────────────────────────────────── */
function applyTheme(t) {
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#f4f6f9' : '#0c1626';
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  lsSet(LS_THEME, t); applyTheme(t); renderView();
}
applyTheme(lsGet(LS_THEME, null));
// si l'usuari no ha triat tema, segueix el del sistema també quan canvia
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!lsGet(LS_THEME, null)) { applyTheme(null); renderView(); } });

/* ── Selecció de països (colors fixos per país mentre estigui seleccionat) ─── */
let sel = lsGet(LS_SEL, DEFAULT_SEL);
let colorOf = lsGet(LS_SEL + '_c', {});
function fixColors(list, map) {
  for (const k of Object.keys(map)) if (!list.includes(k)) delete map[k];
  for (const k of list) if (map[k] == null) {
    const used = new Set(Object.values(map));
    map[k] = [...Array(SLOTS).keys()].find(i => !used.has(i)) ?? 0;
  }
  return map;
}
fixColors(sel, colorOf);
const col = (c, map = colorOf) => `var(--s${(map[c] ?? 0) + 1})`;

function toggleSel(c) {
  if (sel.includes(c)) { if (sel.length > 1) sel = sel.filter(x => x !== c); }
  else { if (sel.length >= MAX_SEL) return alert(`Com a màxim ${MAX_SEL} alhora, perquè el gràfic es pugui llegir. Treu-ne un abans.`); sel = [...sel, c]; }
  fixColors(sel, colorOf); lsSet(LS_SEL, sel); lsSet(LS_SEL + '_c', colorOf); renderView();
}
let showAll = false;
function chipsHTML(filter = () => true) {
  const list = [...Object.keys(D.grups), ...countries()].filter(filter);
  const main = list.filter(c => sel.includes(c) || ['WEOWORLD', 'EURO', ...countries().slice(0, 12)].includes(c));
  const shown = showAll ? list : main;
  return `<div class="chips">${shown.map(c => `<button class="chip ${sel.includes(c) ? 'on' : ''}" onclick="toggleSel('${c}')" ${sel.includes(c) ? `style="color:${col(c)}"` : ''}>
      ${sel.includes(c) ? `<span class="dot" style="background:${col(c)}"></span>` : ''}<span style="color:var(--text)">${esc(label(c))}</span></button>`).join('')}
    <button class="more" onclick="showAll=!showAll;renderView()">${showAll ? 'Menys països ▲' : `Tots (${list.length}) ▼`}</button></div>`;
}

/* ── Gràfic de línies (SVG propi, sense llibreries) ───────────────────────── */
function niceTicks(min, max, n = 5) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const t = [];
  for (let v = Math.floor(min / step) * step; v <= max + step * 0.001; v += step) t.push(+v.toFixed(10));
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + step);
  return t;
}
const monthX = s => +s.slice(0, 4) + (+s.slice(5, 7) - 1) / 12;
const MESOS = ['gen', 'febr', 'març', 'abr', 'maig', 'juny', 'jul', 'ag', 'set', 'oct', 'nov', 'des'];
const monthLabel = x => { const y = Math.floor(x + 1e-6); return `${MESOS[Math.round((x - y) * 12)]} ${y}`; };

/**
 * o.series: [{name, color, pts:[[x,y]], dash}]
 * o.fmt: format dels valors · o.forecast: primer any de previsió · o.zero: inclou el 0
 * o.months: l'eix x són mesos (x decimal) · o.h: alçada
 */
function lineChart(host, o) {
  const W = Math.max(280, host.clientWidth || 600), H = o.h || (W < 500 ? 240 : 300);
  const narrow = W < 500;
  const labelsOn = o.series.length <= 4 && !narrow;
  const m = { t: 14, r: labelsOn ? 118 : 14, b: 26, l: 46 };
  const all = o.series.flatMap(s => s.pts);
  if (!all.length) { host.innerHTML = '<p class="muted">No hi ha dades per a aquesta selecció.</p>'; return; }
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (o.zero !== false) { y0 = Math.min(0, y0); y1 = Math.max(0, y1); }
  const yt = niceTicks(y0, y1, narrow ? 4 : 5);
  y0 = yt[0]; y1 = yt[yt.length - 1];
  const X = x => m.l + (x - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
  const Yp = y => m.t + (1 - (y - y0) / (y1 - y0 || 1)) * (H - m.t - m.b);
  const fmt = o.fmt || (v => nf(v));

  // eix x: anys rodons
  const span = x1 - x0, every = span > 24 ? 5 : span > 10 ? (narrow ? 5 : 2) : 1;
  const xt = [];
  for (let a = Math.ceil(x0); a <= Math.floor(x1); a++) if (a % every === 0) xt.push(a);

  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.title || 'Gràfic')}">`;
  if (o.forecast != null && o.forecast <= x1) {
    const fx = X(Math.max(x0, o.forecast - 0.5));
    s += `<rect class="fc" x="${fx}" y="${m.t}" width="${X(x1) - fx}" height="${H - m.t - m.b}"/>
      <text x="${fx + 4}" y="${m.t + 11}">previsió</text>`;
  }
  s += `<g class="grid">${yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Yp(v)}" y2="${Yp(v)}"/>`).join('')}</g>`;
  s += yt.map(v => `<text x="${m.l - 6}" y="${Yp(v) + 4}" text-anchor="end">${esc(o.tick ? o.tick(v) : nf(v, Math.abs(v) < 10 && v % 1 ? 1 : 0))}</text>`).join('');
  s += xt.map(a => `<text x="${X(a)}" y="${H - 6}" text-anchor="middle">${a}</text>`).join('');
  if (y0 < 0 && y1 > 0) s += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Yp(0)}" y2="${Yp(0)}"/>`;
  if (o.ref) s += `<line class="hl" x1="${m.l}" x2="${W - m.r}" y1="${Yp(o.ref.y)}" y2="${Yp(o.ref.y)}"/><text x="${m.l + 4}" y="${Yp(o.ref.y) - 4}">${esc(o.ref.label)}</text>`;

  for (const se of o.series) {
    if (!se.pts.length) continue;
    const d = se.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Yp(p[1]).toFixed(1)}`).join('');
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
  }
  // etiquetes directes al final de cada línia, separades perquè no se solapin
  if (labelsOn) {
    const ends = o.series.filter(se => se.pts.length).map(se => { const p = se.pts[se.pts.length - 1]; return { se, x: X(p[0]), y: Yp(p[1]) }; }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    for (const e of ends) s += `<text class="lbl" x="${e.x + 8}" y="${e.y + 4}">${esc(e.se.short || e.se.name)}</text>`;
  }
  s += `<line class="hl" id="hl" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" style="display:none"/>`;
  s += `<g id="dots"></g><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" class="hit"/></svg>`;

  const leg = o.series.length > 1 ? `<div class="legend">${o.series.map(se => `<span><i class="${se.dash ? 'dash' : ''}" style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>` : '';
  host.innerHTML = s + leg + '<div class="tip"></div>';

  // capa d'interacció: línia vertical + tooltip amb tots els valors d'aquell punt
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), hl = svg.querySelector('#hl'), dots = svg.querySelector('#dots');
  const xs = [...new Set(all.map(p => p[0]))].sort((a, b) => a - b);
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * W / r.width;
    const xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    let best = xs[0];
    for (const x of xs) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x;
    const rows = o.series.map(se => ({ se, p: se.pts.find(p => Math.abs(p[0] - best) < 1e-6) })).filter(r => r.p).sort((a, b) => b.p[1] - a.p[1]);
    if (!rows.length) return;
    hl.setAttribute('x1', X(best)); hl.setAttribute('x2', X(best)); hl.style.display = '';
    dots.innerHTML = rows.map(r => `<circle cx="${X(best)}" cy="${Yp(r.p[1])}" r="4.5" fill="${r.se.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
    const title = o.months ? monthLabel(best) : best + (o.forecast != null && best >= o.forecast ? ' · previsió' : '');
    tip.innerHTML = `<div class="t">${esc(title)}</div>` + rows.map(r => `<div class="r"><span><i class="sw" style="background:${r.se.color}"></i>${esc(r.se.name)}</span><b class="num">${esc(fmt(r.p[1]))}</b></div>`).join('');
    tip.style.display = 'block';
    const hx = X(best) * r.width / W;
    const left = hx + 14 + tip.offsetWidth > host.clientWidth ? hx - 14 - tip.offsetWidth : hx + 14;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '8px';
  };
  const out = () => { tip.style.display = 'none'; hl.style.display = 'none'; dots.innerHTML = ''; };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', out);
}

/* ── Barres horitzontals (HTML) ─────────────────────────────────────────────── */
// rows: [{c, name, v, color}] · o.fmt · o.me: codi a ressaltar · o.ref: {v, label}
function barsHTML(rows, o = {}) {
  rows = rows.filter(r => r.v != null);
  if (!rows.length) return '<p class="muted">Sense dades.</p>';
  const lo = Math.min(0, ...rows.map(r => r.v)), hi = Math.max(0, ...rows.map(r => r.v), o.ref?.v ?? 0);
  const P = v => (v - lo) / (hi - lo || 1) * 100;
  const fmt = o.fmt || (v => nf(v));
  return `<div class="bars">${rows.map(r => {
    const a = P(Math.min(0, r.v)), b = P(Math.max(0, r.v));
    const color = r.color || (r.v < 0 ? 'var(--neg)' : 'var(--pos)');
    return `<div class="bar ${r.c === o.me ? 'me' : ''}" title="${esc(r.name)}: ${esc(fmt(r.v))}">
      <span class="n">${esc(r.name)}</span>
      <span class="track">${lo < 0 ? `<span class="axis0" style="left:${P(0)}%"></span>` : ''}
        <span class="fill" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;background:${color}"></span>
        ${o.ref ? `<span class="ref" style="left:${P(o.ref.v)}%"></span>` : ''}</span>
      <span class="val">${esc(fmt(r.v))}</span></div>`;
  }).join('')}</div>${o.ref ? `<p class="muted" style="margin-top:6px">┆ La línia discontínua és ${esc(o.ref.label)}.</p>` : ''}`;
}

// Els gràfics SVG es dibuixen després d'inserir l'HTML (necessiten l'amplada real)
let pending = [];
const chart = (id, fn) => { pending.push([id, fn]); return `<div class="chart" id="${id}"></div>`; };
function flushCharts() { for (const [id, fn] of pending) { const el = document.getElementById(id); if (el) fn(el); } }

/* ── Navegació ──────────────────────────────────────────────────────────────── */
const VIEWS = { inici: renderInici, inflacio: renderInflacio, sous: renderSous, deute: renderDeute, tipus: renderTipus,
  creixement: renderCreixement, pais: renderPais, comparar: renderComparar, altra: renderAltra, aprendre: renderAprendre };
function go(v) {
  if (!VIEWS[v]) v = 'inici';
  view = v;
  if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelector(`#tabs button[data-v="${v}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  renderView();
  scrollTo({ top: 0 });
}
function renderView() {
  if (!D) return;
  document.querySelectorAll('section.view').forEach(s => s.classList.remove('on'));
  const el = $('#v-' + view);
  pending = [];
  const sy = scrollY;
  el.innerHTML = VIEWS[view]();
  el.classList.add('on');
  flushCharts();
  scrollTo({ top: sy });
}
addEventListener('hashchange', () => go(location.hash.slice(1)));
let lastW = innerWidth;
addEventListener('resize', debounce(() => { if (innerWidth !== lastW) { lastW = innerWidth; renderView(); } }, 200));

/* ── Lectura en llenguatge planer ───────────────────────────────────────────── */
function levelInfl(v) {
  if (v == null) return '';
  if (v < 0) return '<span class="badge warn">↓ preus baixant</span>';
  if (v <= 2.5) return '<span class="badge good">✓ estable</span>';
  if (v <= 5) return '<span class="badge warn">▲ una mica alta</span>';
  return '<span class="badge bad">▲▲ alta</span>';
}
function levelDeute(v) {
  if (v == null) return '';
  if (v < 60) return '<span class="badge good">✓ moderat</span>';
  if (v < 100) return '<span class="badge warn">▲ elevat</span>';
  return '<span class="badge bad">▲▲ molt elevat</span>';
}
function levelAtur(v) {
  if (v == null) return '';
  if (v < 5) return '<span class="badge good">✓ baix</span>';
  if (v < 10) return '<span class="badge warn">▲ mitjà</span>';
  return '<span class="badge bad">▲▲ alt</span>';
}
function levelCreix(v) {
  if (v == null) return '';
  if (v < 0) return '<span class="badge bad">▼ en recessió</span>';
  if (v < 1) return '<span class="badge warn">≈ estancada</span>';
  return '<span class="badge good">▲ creix</span>';
}
const tile = (k, v, d, badge = '') => `<div class="tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="d">${d} ${badge}</div></div>`;

// Últim canvi del tipus oficial d'un banc central: {mes, de, a}
function lastChange(b) {
  const e = Object.entries(D.tipus?.[b] || {}).sort((x, y) => x[0] < y[0] ? -1 : 1);
  for (let i = e.length - 1; i > 0; i--) if (e[i][1] !== e[i - 1][1]) return { mes: e[i][0], de: e[i - 1][1], a: e[i][1] };
  return null;
}

/* ── Actualitat ─────────────────────────────────────────────────────────────── */
// Text escrit a mà: cal revisar-lo quan canviï la situació (porta la data a la vista).
const ACTUALITAT_DATA = '16 de setembre de 2026';
function actualitatHTML() {
  // "World Economic Outlook (April 2026)" → "edició d'abril del 2026"
  const m = (D.fonts?.infl?.font || '').match(/\((\w+) (\d{4})\)/);
  const MES_EN = { January: 'gener', April: 'abril', July: 'juliol', October: 'octubre' };
  const weo = m ? `edició ${/^[ao]/i.test(MES_EN[m[1]] || m[1]) ? "d'" : 'de '}${MES_EN[m[1]] || m[1]} del ${m[2]}` : '';
  const bce = lastChange('XM');
  return `<div class="card" style="border-color:var(--warn)">
    <h3>⚠️ Actualitat: la crisi de l'estret d'Ormuz</h3>
    <p class="muted">Situació a ${ACTUALITAT_DATA}</p>
    <p>Per l'estret d'Ormuz, entre l'Iran i la península Aràbiga, hi passa prop d'<b>una cinquena part del petroli del món</b>.
    Des del març del 2026, amb la guerra amb l'Iran, el trànsit s'ha tallat o reduït molt. L'alto el foc de l'abril no l'ha normalitzat:
    el pas continua inestable, amb un bloqueig dels EUA i nous atacs a la regió. El petroli Brent ha passat de rondar els 70 $ el juliol a
    acostar-se als 100 $ el setembre.</p>
    <div class="flow">
      <div class="step"><b>🛢️ Petroli més car</b>Menys vaixells poden passar per Ormuz.</div><div class="arr">→</div>
      <div class="step"><b>⛽ Carburants i transport</b>Pugen la benzina, el gasoil i el gas.</div><div class="arr">→</div>
      <div class="step"><b>🛒 Més inflació</b>Tot el que es transporta s'encareix.</div><div class="arr">→</div>
      <div class="step"><b>📈 Tipus d'interès</b>${bce && bce.a > bce.de ? `El BCE els va apujar el ${monthLabel(monthX(bce.mes))}, fins al ${pct(bce.a, 2)}.` : 'Els bancs centrals deixen de baixar-los o els apugen.'}</div>
    </div>
    <p class="sub" style="margin-top:8px">📌 <b>Important:</b> les previsions de l'FMI d'aquesta app són de l'<b>${esc(weo || 'última edició')}</b>. Ja inclouen el primer
    cop de la crisi (l'FMI va rebaixar el creixement i va apujar la inflació mundial prevista), però <b>no el rebrot de l'estiu</b>.
    L'FMI en publica una revisió cada octubre; l'app l'agafarà sola a la següent actualització mensual.</p>
  </div>`;
}

/* ── 🏠 Inici ───────────────────────────────────────────────────────────────── */
function renderInici() {
  const W = 'WEOWORLD';
  const top = countries().slice(0, 15);
  const alts = countries().filter(c => (val(c, 'deute', Y) || 0) >= 100);
  const inflMax = Math.max(...pts(W, 'infl', 2015, Y).map(p => p[1]));
  const anyMax = pts(W, 'infl', 2015, Y).find(p => p[1] === inflMax)?.[0];
  const pibTop = top.reduce((s, c) => s + (val(c, 'quota', Y) || 0), 0);
  const inflPuja = val(W, 'infl', Y) > val(W, 'infl', Y - 1);
  const bce = lastChange('XM');
  return `
  <div class="intro">
    <h2>Com va el món el ${Y}?</h2>
    <p class="sub">Les xifres principals de l'economia mundial, amb les dades de l'FMI. Toca qualsevol pestanya per aprofundir-hi.
    Les xifres del ${Y} són <b>previsions</b>: l'any encara no s'ha acabat.</p>
  </div>
  <div class="tiles">
    ${tile('🏭 Creixement mundial', pct(val(W, 'creix', Y)), `Quant creix l'economia del món el ${Y}`, levelCreix(val(W, 'creix', Y)))}
    ${tile('🛒 Inflació mundial', pct(val(W, 'infl', Y)), `El ${anyMax} va arribar al ${pct(inflMax)}`, levelInfl(val(W, 'infl', Y)))}
    ${tile('🏦 Deute públic mundial', pct(val(W, 'deute', Y), 0), 'del PIB mundial', levelDeute(val(W, 'deute', Y)))}
    ${tile('💰 Economia mundial', money(val(W, 'pib', Y)), 'Valor de tot el que es produeix en un any')}
  </div>
  ${actualitatHTML()}

  <div class="grid g2">
    <div class="card">
      <h3>Les economies més grans</h3>
      <p class="sub">PIB del ${Y} en dòlars. Aquests 15 països fan el ${nf(pibTop, 0)} % de l'economia mundial (comptant en paritat de poder adquisitiu).</p>
      ${barsHTML(top.map(c => ({ c, name: label(c), v: val(c, 'pib', Y) })), { fmt: money, me: 'ESP' })}
    </div>
    <div class="card">
      <h3>Inflació: la pujada de preus al món</h3>
      <p class="sub">Percentatge anual. Després de la pandèmia i la guerra d'Ucraïna els preus es van disparar. ${inflPuja ? `Quan semblava que es calmaven, la crisi d'Ormuz els torna a empènyer el ${Y}.` : 'Després han anat tornant a la normalitat.'}</p>
      ${chart('c-home-infl', el => lineChart(el, { title: 'Inflació', forecast: Y, fmt: v => pct(v),
        series: [['WEOWORLD', 1], ['ADVEC', 0], ['OEMDC', 2]].map(([c, i]) => ({ name: ent(c).nom, color: `var(--s${i + 1})`, pts: pts(c, 'infl', 2000) })) }))}
    </div>
  </div>

  <div class="card">
    <h3>Tres coses per entendre el moment actual</h3>
    <div class="grid g3" style="margin-top:10px">
      <div class="concept"><div class="emo">🛒</div><b>${inflPuja ? 'Els preus tornen a pujar més de pressa' : 'Els preus ja no pugen tan de pressa…'}</b>
        <p class="sub">${inflPuja ? `L'FMI preveu un ${pct(val(W, 'infl', Y))} d'inflació mundial el ${Y}, més que el ${Y - 1} (${pct(val(W, 'infl', Y - 1))}), sobretot per l'energia.` : '…però no han baixat.'}
        El que va pujar el 2021-2023 no ha tornat enrere; per això molta gent nota que tot és més car.
        <a href="#inflacio">Mira-ho →</a></p></div>
      <div class="concept"><div class="emo">🏦</div><b>Els estats deuen més que mai</b>
        <p class="sub">${alts.length} dels ${countries().length} països d'aquesta app deuen més del 100 % del que produeixen en un any, entre ells ${alts.slice(0, 4).map(c => esc(ent(c).nom)).join(', ')}.
        <a href="#deute">Mira-ho →</a></p></div>
      <div class="concept"><div class="emo">📈</div><b>Els diners tornen a tenir preu</b>
        <p class="sub">Del 2022 al 2023 els bancs centrals van pujar els tipus d'interès per frenar la inflació i després els van abaixar.
        ${bce ? `L'últim moviment del BCE va ser ${bce.a > bce.de ? 'una <b>pujada</b>' : 'una baixada'}: el ${monthLabel(monthX(bce.mes))}, del ${pct(bce.de, 2)} al ${pct(bce.a, 2)}.` : ''}
        <a href="#tipus">Mira-ho →</a></p></div>

/* ── 🛒 Inflació ────────────────────────────────────────────────────────────── */
let calc = lsGet('economia_calc', { c: 'ESP', a0: 2020, a1: Y - 1, q: 100 });
function setCalc(k, v) { calc[k] = k === 'c' ? v : +v; lsSet('economia_calc', calc); renderView(); }
function renderInflacio() {
  const a0 = 2020, a1 = Y - 1;
  const rows = [...sel].map(c => ({ c, name: label(c), v: cumInfl(c, a0, a1), color: col(c) })).sort((a, b) => b.v - a.v);
  const big = sel.some(c => pts(c, 'infl', 2000).some(p => p[1] > 30));
  const cr = cumInfl(calc.c, Math.min(calc.a0, calc.a1), Math.max(calc.a0, calc.a1));
  const yrs = Object.keys(ent(calc.c)?.s.infl || {}).map(Number).filter(a => a <= Y);
  return `

    <p class="sub">La <b>inflació</b> és el percentatge que pugen els preus en un any. Un 2 % anual es considera sa; per sobre, el sou rendeix menys cada mes.</p>

  <div class="card">
    <h3>Inflació anual per país</h3>
    <p class="sub">Tria fins a ${MAX_SEL} països o zones per comparar.</p>
    ${chipsHTML()}
    ${big ? '<p class="muted">⚠️ Algun país seleccionat té inflacions molt altes i estira l\'escala: treu-lo per veure millor la resta.</p>' : ''}
    ${chart('c-infl', el => lineChart(el, { title: 'Inflació anual', forecast: Y, fmt: v => pct(v), ref: { y: 2, label: 'objectiu 2 %' },

        <input type="number" value="${calc.q}" min="1" style="width:110px" onchange="setCalc('q', this.value)" aria-label="Quantitat">

      </div>
      <div class="callout" style="margin-top:12px">
        ${cr == null ? 'No hi ha dades per a tots aquests anys.' : `<div class="res num">${nf(calc.q * (1 + cr / 100) ** (calc.a1 >= calc.a0 ? 1 : -1), 2)}</div>
        <div class="sub">Els preus ${calc.a1 >= calc.a0 ? 'han pujat' : 'eren'} un ${pct(cr)} ${calc.a1 >= calc.a0 ? '' : 'més baixos'}. ${calc.a1 >= calc.a0 ? `Amb els mateixos ${nf(calc.q, 0)} d'abans ara només compres el que abans valia ${nf(calc.q / (1 + cr / 100), 2)}.` : ''}</div>`}
      </div>
      <p class="muted">Calculat amb la inflació mitjana anual de l'FMI. Els anys a partir del ${Y} són previsió.</p>
    </div>
  </div>
  <div class="callout">⚠️ El ${Y} la crisi de l'estret d'Ormuz ha tornat a encarir el petroli. Les previsions de l'FMI que es veuen aquí encara no recullen el rebrot de l'estiu. <a href="#inici">Més informació →</a></div>
  <div class="card">
    <h3>Per què va pujar tant el 2022?</h3>
    <div class="flow">
      <div class="step"><b>1. Pandèmia</b>Les fàbriques tanquen i falten peces i contenidors.</div><div class="arr">→</div>
      <div class="step"><b>2. Reobertura</b>Tothom torna a comprar alhora, amb estalvis i ajudes.</div><div class="arr">→</div>
      <div class="step"><b>3. Guerra d'Ucraïna</b>Gas, petroli i cereals es disparen.</div><div class="arr">→</div>
      <div class="step"><b>4. Contagi</b>L'energia encareix el transport i tota la resta de productes.</div>
    </div>
    <p class="sub" style="margin-top:8px">La inflació de 2022 no va ser només "massa diners": va ser una barreja de menys oferta, més demanda i energia cara. Per frenar-la, els bancs centrals van pujar els <a href="#tipus">tipus d'interès</a>.</p>
  </div>`;
}

/* ── 💶 Sous ────────────────────────────────────────────────────────────────── */
function renderSous() {
  const has = c => !isGroup(c) && ent(c).s.souReal;
  const base = 2000;
  const selW = sel.filter(has);
  const idx = c => { const s = ent(c).s.souReal, b = s[base] ?? s[Object.keys(s)[0]]; return Object.entries(s).map(([a, v]) => [+a, v / b * 100]); };
  const ocde = countries().filter(has);
  const lastW = c => lastYear(c, 'souNom');
  // Sous vs preus 2020 → últim any amb dada de sou
  const comp = c => {
    const a1 = lastW(c); if (!a1 || !val(c, 'souNom', 2020)) return null;
    const w = (val(c, 'souNom', a1) / val(c, 'souNom', 2020) - 1) * 100, p = cumInfl(c, 2020, a1);
    // el poder adquisitiu surt del sou real de l'OCDE (deflactat amb els preus del consum privat),
    // no de restar la inflació de l'FMI: així coincideix amb el gràfic del sou real
    const r0 = val(c, 'souReal', 2020), r1 = val(c, 'souReal', a1);
    return p == null || !r0 || !r1 ? null : { w, p, real: (r1 / r0 - 1) * 100, a1 };
  };
  const reals = ocde.map(c => ({ c, name: label(c), v: comp(c)?.real })).sort((a, b) => b.v - a.v);
  const guany = reals.filter(r => r.v > 0).length;
  const me = selW[0] || 'ESP', mc = comp(me);
  return `
  <div class="intro">
    <h2>💶 Sous: guanyem o perdem poder adquisitiu?</h2>
    <p class="sub">Que et pugin el sou no vol dir que visquis millor: si els preus pugen més, a final de mes et queda menys.
    Això és el <b>sou real</b>: el sou descomptant la inflació. Dades de l'OCDE (${ocde.length} països; la Xina, l'Índia o el Brasil no hi són).</p>
  </div>
  ${mc ? `<div class="tiles">
    ${tile(`${esc(label(me))}: sous ${mc.a1} vs 2020`, sgn(mc.w, 1) + ' %', 'pujada del sou mitjà en diners')}
    ${tile('Preus en el mateix període', sgn(mc.p, 1) + ' %', 'inflació acumulada')}
    ${tile('Poder adquisitiu', sgn(mc.real, 1) + ' %', mc.real >= 0 ? 'el sou compra més coses' : 'el sou compra menys coses',
      mc.real >= 0 ? '<span class="badge good">▲ guany</span>' : '<span class="badge bad">▼ pèrdua</span>')}
  </div>` : ''}
  <div class="card">
    <h3>Evolució del sou real (${base} = 100)</h3>
    <p class="sub">Si la línia puja, el sou mitjà compra més coses que el ${base}. Si està per sota de 100, compra menys.</p>
    ${chipsHTML(has)}
    ${selW.length ? chart('c-sous', el => lineChart(el, { title: 'Sou real', zero: false, fmt: v => nf(v), ref: { y: 100, label: 'nivell del ' + base },
      series: selW.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: idx(c) })) }))
      : '<p class="muted">Cap dels països seleccionats té dades de sous a l\'OCDE. Tria\'n algun de la llista.</p>'}
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Guanys i pèrdues des del 2020</h3>
      <p class="sub">Variació del poder adquisitiu del sou mitjà del 2020 a l'últim any disponible. En ${guany} de ${reals.filter(r => r.v != null).length} països els sous ja han superat la inflació.</p>
      ${barsHTML(reals, { fmt: v => sgn(v) + ' %', me })}
    </div>
    <div class="card">
      <h3>Qui cobra més? (sou mitjà anual ${lastYear('USA', 'souReal')})</h3>
      <p class="sub">En dòlars ajustats pel cost de vida de cada país (PPA), perquè sigui comparable.</p>
      ${barsHTML(ocde.map(c => ({ c, name: label(c), v: val(c, 'souReal', lastYear(c, 'souReal')) })).sort((a, b) => b.v - a.v), { fmt: v => int(v) + ' $', me })}
    </div>
  </div>
  <p class="muted">L'OCDE calcula el sou real amb els preus del consum privat, no exactament amb l'IPC. Per això el poder adquisitiu no sempre és
  exactament la pujada del sou menys la inflació de l'FMI que es mostra al costat.
  El sou mitjà inclou tots els assalariats a temps complet equivalent.</p>`;
}

/* ── 🏦 Deute ───────────────────────────────────────────────────────────────── */
let deutePais = lsGet(LS_PAIS, 'ESP');
function renderDeute() {
  const ay = Y;
  const rows = countries().map(c => ({ c, name: label(c), v: val(c, 'deute', ay), color: (val(c, 'deute', ay) || 0) >= 100 ? 'var(--neg)' : 'var(--pos)' })).sort((a, b) => b.v - a.v);
  const p = deutePais, hy = lastYear(p, 'deuteLlars');
  const defs = countries().map(c => ({ c, name: label(c), v: val(c, 'deficit', ay) })).sort((a, b) => a.v - b.v);
  return `
  <div class="intro">
    <h2>🏦 Deute: qui deu més?</h2>
    <p class="sub">El <b>deute públic</b> és tot el que l'estat ha demanat prestat i encara no ha retornat. Es compara amb el <b>PIB</b>
    (tot el que el país produeix en un any): un deute del 100 % vol dir que deu l'equivalent a un any sencer de feina de tot el país.</p>
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Deute públic en % del PIB (${ay})</h3>
      <p class="sub">En vermell, els que deuen més d'un any de PIB.</p>
      ${barsHTML(rows, { fmt: v => pct(v, 0), me: p, ref: { v: val('WEOWORLD', 'deute', ay), label: 'la mitjana mundial' } })}
    </div>
    <div>
      <div class="card">
        <h3>Evolució del deute públic</h3>
        <p class="sub">Tria els països a dalt de la pestanya d'<a href="#inflacio">Inflació</a> o aquí.</p>
        ${chipsHTML()}
        ${chart('c-deute', el => lineChart(el, { title: 'Deute públic', forecast: Y, fmt: v => pct(v, 0), tick: v => v + ' %',
          series: sel.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: pts(c, 'deute', 2000) })) }))}
      </div>
      <div class="card">
        <h3>Qui deu? Estat, famílies i empreses</h3>
        <p class="sub">El deute no és només de l'estat. Tria un país:</p>
        <select onchange="deutePais=this.value;lsSet(LS_PAIS,this.value);renderView()" aria-label="País">${countries().filter(c => ent(c).s.deuteLlars).map(c => `<option value="${c}" ${c === p ? 'selected' : ''}>${esc(label(c))}</option>`).join('')}</select>
        <div style="margin-top:12px">${hy ? barsHTML([
          { name: '🏛️ Estat', v: val(p, 'deute', hy), color: 'var(--s1)' },
          { name: '👪 Famílies', v: val(p, 'deuteLlars', hy), color: 'var(--s2)' },
          { name: '🏢 Empreses', v: val(p, 'deuteEmpreses', hy), color: 'var(--s3)' },
        ], { fmt: v => pct(v, 0) }) + `<p class="muted">En % del PIB, any ${hy} (Global Debt Database de l'FMI). Famílies: hipoteques i crèdits. Empreses: préstecs i bons, sense bancs.</p>` : '<p class="muted">Sense dades.</p>'}</div>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>Dèficit: gasten més del que ingressen?</h3>
    <p class="sub">Saldo de les administracions públiques el ${ay}, en % del PIB. Un valor negatiu (dèficit) vol dir que l'estat ha de demanar més diners prestats aquell any, i el deute creix.</p>
    ${barsHTML(defs, { fmt: v => sgn(v) + ' %', me: p })}
  </div>
  <div class="card">
    <h3>És dolent deure molt?</h3>
    <div class="grid g3">
      <div><b>Depèn de qui et deixa els diners.</b><p class="sub">El Japó deu el 200 % del PIB, però gairebé tot als seus propis ciutadans i en la seva moneda. Això el fa menys vulnerable.</p></div>
      <div><b>Depèn dels interessos.</b><p class="sub">Amb tipus d'interès alts, pagar el deute costa més i queden menys diners per a sanitat, escoles o pensions.</p></div>
      <div><b>Depèn de si l'economia creix.</b><p class="sub">Si el PIB creix més de pressa que el deute, el percentatge baixa sol encara que no es retorni res.</p></div>
    </div>
  </div>`;
}

/* ── 📈 Tipus d'interès ─────────────────────────────────────────────────────── */
let banks = lsGet(LS_BANKS, DEFAULT_BANKS);
let bankCol = fixColors(banks, lsGet(LS_BANKS + '_c', {}));
function toggleBank(b) {
  if (banks.includes(b)) { if (banks.length > 1) banks = banks.filter(x => x !== b); }
  else { if (banks.length >= MAX_SEL) return alert(`Com a màxim ${MAX_SEL} alhora.`); banks = [...banks, b]; }
  fixColors(banks, bankCol); lsSet(LS_BANKS, banks); lsSet(LS_BANKS + '_c', bankCol); renderView();
}
function renderTipus() {
  const T = D.tipus || {};
  const avail = Object.keys(BANKS).filter(b => T[b]);
  const last = b => { const k = Object.keys(T[b] || {}).sort().pop(); return k ? [k, T[b][k]] : null; };
  const rows = avail.map(b => {
    const l = last(b), inf = val(BANK_INFL[b], 'infl', Y);
    return { b, l, inf, real: l && inf != null ? l[1] - inf : null };
  });
  const ecb = last('XM');
  return `
  <div class="intro">
    <h2>📈 Tipus d'interès: el preu dels diners</h2>
    <p class="sub">El <b>tipus d'interès oficial</b> el fixa el banc central de cada país. És el preu al qual els bancs es deixen diners, i d'aquí surten
    l'euríbor, les hipoteques, els préstecs i el que et paguen pels estalvis.</p>
  </div>
  ${ecb ? `<div class="tiles">
    ${tile('🇪🇺 Tipus del BCE', pct(ecb[1], 2), `a ${monthLabel(monthX(ecb[0]))}`)}
    ${tile('Inflació zona euro ' + Y, pct(val('EURO', 'infl', Y)), 'previsió FMI', levelInfl(val('EURO', 'infl', Y)))}
    ${tile('Tipus real', sgn(ecb[1] - val('EURO', 'infl', Y), 2) + ' %', 'tipus menys inflació')}
  </div>` : ''}
  <div class="card">
    <h3>Tipus oficials dels bancs centrals des del 2007</h3>
    <p class="sub">A final de cada mes. Fixa't en els tres moments clau: la crisi del 2008, els tipus a zero (o negatius) fins al 2022, i la pujada ràpida per frenar la inflació.</p>
    <div class="chips" style="margin-bottom:12px">${avail.map(b => `<button class="chip ${banks.includes(b) ? 'on' : ''}" onclick="toggleBank('${b}')" ${banks.includes(b) ? `style="color:${col(b, bankCol)}"` : ''}>
      ${banks.includes(b) ? `<span class="dot" style="background:${col(b, bankCol)}"></span>` : ''}<span style="color:var(--text)">${esc(BANKS[b])}</span></button>`).join('')}</div>
    ${chart('c-tipus', el => lineChart(el, { title: 'Tipus oficials', months: true, fmt: v => pct(v, 2),
      series: banks.filter(b => T[b]).map(b => ({ name: BANKS[b], short: BANKS[b].split(' (')[0].replace(/^Banc (del |de l'|d'|de )?/, ''), color: col(b, bankCol),
        pts: Object.entries(T[b]).map(([k, v]) => [monthX(k), v]).sort((a, b) => a[0] - b[0]) })) }))}
  </div>
  <div class="card">
    <h3>Tipus reals: guanyen els estalvis a la inflació?</h3>
    <p class="sub">Tipus oficial actual menys la inflació prevista per al ${Y}. Si és positiu, els diners estalviats guanyen valor; si és negatiu, en perden, i demanar un préstec surt "barat".</p>
    ${barsHTML(rows.map(r => ({ c: r.b, name: BANKS[r.b], v: r.real })).sort((a, b) => b.v - a.v), { fmt: v => sgn(v) + ' %', me: 'XM' })}
  </div>
  <div class="card">
    <h3>Com funciona?</h3>
    <div class="flow">
      <div class="step"><b>📈 Pugen els tipus</b>Les hipoteques i els préstecs són més cars.</div><div class="arr">→</div>
      <div class="step"><b>💳 Menys crèdit</b>Famílies i empreses gasten i inverteixen menys.</div><div class="arr">→</div>
      <div class="step"><b>📦 Menys demanda</b>Les botigues venen menys i no poden apujar tant els preus.</div><div class="arr">→</div>
      <div class="step"><b>🛒 Baixa la inflació</b>…però l'economia creix més a poc a poc.</div>
    </div>
    <p class="sub" style="margin-top:8px">Quan baixen els tipus passa al revés: s'anima el consum i la inversió. L'art del banc central és trobar el punt on els preus pugen un 2 % sense frenar massa l'economia.</p>
  </div>`;
}

/* ── 🏭 Creixement ──────────────────────────────────────────────────────────── */
function renderCreixement() {
  const rows = countries().map(c => ({ c, name: label(c), v: val(c, 'creix', Y) })).sort((a, b) => b.v - a.v);
  const atur = countries().map(c => ({ c, name: label(c), v: val(c, 'atur', Y), color: (val(c, 'atur', Y) || 0) >= 10 ? 'var(--neg)' : 'var(--pos)' })).sort((a, b) => b.v - a.v);
  const rics = countries().map(c => ({ c, name: label(c), v: val(c, 'pibpcppa', Y) })).sort((a, b) => b.v - a.v);
  return `
  <div class="intro">
    <h2>🏭 Creixement, atur i riquesa</h2>
    <p class="sub">El <b>PIB</b> és el valor de tot el que un país produeix en un any. Quan creix, normalment hi ha més feina i més ingressos.
    Dues caigudes en seguit es diuen <b>recessió</b>.</p>
  </div>
  <div class="card">
    <h3>Creixement anual del PIB</h3>
    <p class="sub">Descomptada la inflació. Es veuen clarament la crisi del 2009 i la pandèmia del 2020.</p>
    ${chipsHTML()}
    ${chart('c-creix', el => lineChart(el, { title: 'Creixement del PIB', forecast: Y, fmt: v => sgn(v) + ' %',
      series: sel.map(c => ({ name: label(c), short: ent(c).nom, color: col(c), pts: pts(c, 'creix', 2000) })) }))}
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Qui creix més el ${Y}?</h3>
      <p class="sub">Els països emergents creixen més de pressa perquè parteixen de més avall.</p>
      ${barsHTML(rows, { fmt: v => sgn(v) + ' %', me: 'ESP', ref: { v: val('WEOWORLD', 'creix', Y), label: 'el creixement mundial' } })}
    </div>
    <div class="card">
      <h3>Atur ${Y}</h3>
      <p class="sub">% de la població activa que busca feina i no en troba. En vermell, per sobre del 10 %.</p>
      ${barsHTML(atur, { fmt: v => pct(v), me: 'ESP' })}
    </div>
  </div>
  <div class="card">
    <h3>Riquesa per habitant ${Y}</h3>
    <p class="sub">PIB per persona en dòlars internacionals (ajustat pel cost de vida). És la millor manera de comparar el nivell de vida mitjà, tot i que no diu res de com es reparteix.</p>
    ${barsHTML(rics, { fmt: v => int(v) + ' $', me: 'ESP' })}
  </div>`;
}

/* ── 📍 Fitxa de país ───────────────────────────────────────────────────────── */
let fitxa = lsGet('economia_fitxa', 'ESP');
function renderPais() {
  const c = D.paisos[fitxa] || D.grups[fitxa] ? fitxa : 'ESP', e = ent(c);
  const v = k => val(c, k, Y);
  const g = isGroup(c);
  const txt = [];
  const cr = v('creix'), inf = v('infl'), de = v('deute'), at = v('atur'), df = v('deficit'), cc = v('cc');
  if (cr != null) txt.push(cr < 0 ? `L'economia es contrau un ${pct(-cr)}.` : cr < 1 ? `L'economia gairebé no creix (${pct(cr)}).` : cr > 4 ? `L'economia creix amb força, un ${pct(cr)}.` : `L'economia creix a un ritme moderat, un ${pct(cr)}.`);
  if (inf != null) txt.push(inf <= 2.5 ? `Els preus estan controlats (${pct(inf)}).` : inf <= 5 ? `Els preus pugen una mica més del desitjable (${pct(inf)}).` : `La inflació és un problema seriós: ${pct(inf)}.`);
  if (at != null) txt.push(at >= 10 ? `L'atur és alt: un ${pct(at)}.` : at < 5 ? `Gairebé hi ha plena ocupació (atur del ${pct(at)}).` : `L'atur és del ${pct(at)}.`);
  if (de != null) txt.push(de >= 100 ? `L'estat deu més que tot el que el país produeix en un any (${pct(de, 0)} del PIB).` : de >= 60 ? `El deute públic és considerable (${pct(de, 0)} del PIB).` : `El deute públic és moderat (${pct(de, 0)} del PIB).`);
  if (df != null) txt.push(df < -3 ? `Gasta força més del que ingressa: dèficit del ${pct(-df)}.` : df < 0 ? `Gasta una mica més del que ingressa (dèficit del ${pct(-df)}).` : `Ingressa més del que gasta (superàvit del ${pct(df)}).`);
  if (cc != null) txt.push(cc >= 0 ? `Ven a l'exterior més del que compra (superàvit exterior del ${pct(cc)}).` : `Compra a l'exterior més del que ven (dèficit exterior del ${pct(-cc)}).`);
  const opts = [...Object.keys(D.grups), ...countries()];
  const cs = `var(--s1)`, is = `var(--s2)`;
  return `
  <div class="intro controls">
    <h2 style="margin:0">📍 ${esc(label(c))}</h2>
    <select onchange="fitxa=this.value;lsSet('economia_fitxa',this.value);renderView()" aria-label="País">${opts.map(o => `<option value="${o}" ${o === c ? 'selected' : ''}>${esc(label(o))}</option>`).join('')}</select>
  </div>
  <div class="tiles">
    ${tile('Creixement ' + Y, sgn(cr) + ' %', 'PIB real', levelCreix(cr))}
    ${tile('Inflació ' + Y, pct(inf), 'pujada de preus', levelInfl(inf))}
    ${tile('Atur ' + Y, pct(at), 'població activa', levelAtur(at))}
    ${tile('Deute públic', pct(de, 0), 'del PIB', levelDeute(de))}
    ${tile('PIB', money(v('pib')), g ? '' : `${nf(v('quota'), 1)} % del món (PPA)`)}
    ${g ? '' : tile('PIB per habitant', int(v('pibpc')) + ' $', `${nf(v('pob'), v('pob') < 10 ? 2 : 0)} M d'habitants`)}
  </div>
  <div class="card">
    <h3>En poques paraules</h3>
    <p>${txt.map(esc).join(' ')}</p>
    <p class="muted">Dades del ${Y} (previsió de l'FMI).</p>
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Creixement i inflació</h3>
      <p class="sub">% anual.</p>
      ${chart('c-p1', el => lineChart(el, { title: 'Creixement i inflació', forecast: Y, fmt: v => pct(v),
        series: [{ name: 'Creixement del PIB', short: 'Creixement', color: cs, pts: pts(c, 'creix', 2000) }, { name: 'Inflació', color: is, pts: pts(c, 'infl', 2000) }] }))}
    </div>
    <div class="card">
      <h3>Deute públic i dèficit</h3>
      <p class="sub">% del PIB.</p>
      ${chart('c-p2', el => lineChart(el, { title: 'Deute', forecast: Y, fmt: v => pct(v), tick: v => v + ' %',
        series: [{ name: 'Deute públic', short: 'Deute', color: cs, pts: pts(c, 'deute', 2000) }, { name: 'Saldo públic (dèficit si és negatiu)', short: 'Saldo', color: is, pts: pts(c, 'deficit', 2000) }] }))}
    </div>
    <div class="card">
      <h3>Atur</h3>
      <p class="sub">% de la població activa.</p>
      ${chart('c-p3', el => lineChart(el, { title: 'Atur', forecast: Y, fmt: v => pct(v), series: [{ name: 'Atur', color: cs, pts: pts(c, 'atur', 2000) }] }))}
    </div>
    ${!g && e.s.souReal ? `<div class="card">
      <h3>Sou mitjà anual</h3>
      <p class="sub">En diners de cada any (${esc(e.moneda || '')}) i descomptant la inflació (preus del ${esc(e.souBase || '')}). La distància entre les dues línies és el que s'ha menjat la inflació.</p>
      ${chart('c-p4', el => {
        const f = e.s.souReal[e.souBase] / e.s.souNom[e.souBase]; // passa el sou real a moneda nacional

      })}

}

/* ── 🔍 L'altra cara ────────────────────────────────────────────────────────── */
// Dades oficials que no surten als titulars: habitatge, creació de diners i or.
let altraPais = lsGet('economia_altra_pais', 'ESP');

const idxBase = (serie, base) => { const b = serie?.[base]; return b ? Object.entries(serie).filter(([a]) => +a >= base).map(([a, v]) => [+a, v / b * 100]) : []; };

// Barres dobles: dues mesures per fila, amb el mateix eix
function pairBarsHTML(rows, o) {
  rows = rows.filter(r => r.a != null && r.b != null);
  if (!rows.length) return '<p class="muted">Sense dades.</p>';
  const lo = Math.min(0, ...rows.flatMap(r => [r.a, r.b])), hi = Math.max(0, ...rows.flatMap(r => [r.a, r.b]));
  const P = v => (v - lo) / (hi - lo || 1) * 100;
  const one = (v, color) => {
    const a = P(Math.min(0, v)), b = P(Math.max(0, v));
    return `<span class="track">${lo < 0 ? `<span class="axis0" style="left:${P(0)}%"></span>` : ''}<span class="fill" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;background:${color}"></span></span>`;
  };
  return `<div class="legend" style="margin:0 0 8px"><span><i style="background:var(--s2)"></i>${esc(o.la)}</span><span><i style="background:var(--s1)"></i>${esc(o.lb)}</span></div>
  <div class="bars">${rows.map(r => `<div class="bar pair ${r.c === o.me ? 'me' : ''}" title="${esc(r.name)}: ${esc(o.la)} ${esc(o.fmt(r.a))} · ${esc(o.lb)} ${esc(o.fmt(r.b))}">
    <span class="n">${esc(r.name)}</span>
    <span class="dbl">${one(r.a, 'var(--s2)')}${one(r.b, 'var(--s1)')}</span>
    <span class="val"><span>${esc(o.fmt(r.a))}</span><span class="muted">${esc(o.fmt(r.b))}</span></span></div>`).join('')}</div>`;
}

  const hp = both.includes(altraPais) ? altraPais : (both[0] || 'ESP');
  const hr = pair.find(r => r.c === hp);

      series: [{ name: 'Diners en circulació (M3)', short: 'Diners', color: 'var(--s2)', pts: idxBase(M.m3, d0).filter(p => p[0] <= lastM) },
               { name: 'Economia en euros (PIB nominal)', short: 'PIB', color: 'var(--s1)', pts: idxBase(M.pib, d0) },

/* ── 📊 Comparar ────────────────────────────────────────────────────────────── */
const COLS = [
  ['pib', 'PIB', money, null], ['creix', 'Creix.', v => sgn(v) + ' %', null], ['infl', 'Inflació', v => pct(v), [5]],
  ['atur', 'Atur', v => pct(v), [10]], ['deute', 'Deute', v => pct(v, 0), [100]], ['deficit', 'Saldo públic', v => sgn(v) + ' %', null],
  ['pibpc', 'PIB/hab.', v => int(v) + ' $', null], ['pob', 'Població', v => nf(v, v < 10 ? 1 : 0) + ' M', null],
];
let sortK = 'pib', sortDir = -1, cmpY = null;
function sortBy(k) { if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = k === 'nom' ? 1 : -1; } renderView(); }
function renderComparar() {
  const ay = cmpY ?? Y;
  const years = Object.keys(D.paisos.USA.s.pib).map(Number);
  const key = c => sortK === 'nom' ? ent(c).nom : val(c, sortK, ay);
  const cs = countries().sort((a, b) => {
    const x = key(a), y = key(b);
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y, 'ca') : x - y) * sortDir;
  });
  const cell = (c, [k, , f, lim]) => {
    const v = val(c, k, ay);
    const cls = lim && v != null && v >= lim[0] ? 'hi' : '';
    return `<td class="num ${cls}">${esc(f(v))}</td>`;
  };
  const th = (k, t) => `<th class="${sortK === k ? 'on' : ''}" onclick="sortBy('${k}')">${t}${sortK === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  return `
  <div class="intro">
    <h2>📊 Comparar tots els països</h2>
    <p class="sub">Toca el títol d'una columna per ordenar. En vermell, valors preocupants (inflació ≥ 5 %, atur ≥ 10 %, deute ≥ 100 %).</p>
    <div class="controls">Any:
      <select onchange="cmpY=+this.value;renderView()" aria-label="Any">${years.map(a => `<option value="${a}" ${a === ay ? 'selected' : ''}>${a}${a >= Y ? ' (previsió)' : ''}</option>`).join('')}</select>
    </div>
  </div>
  <div class="card tablewrap">
    <table>
      <thead><tr>${th('nom', 'País')}${COLS.map(([k, t]) => th(k, t)).join('')}</tr></thead>
      <tbody>
        ${cs.map(c => `<tr><td><a href="#pais" onclick="fitxa='${c}';lsSet('economia_fitxa','${c}')">${esc(label(c))}</a></td>${COLS.map(col => cell(c, col)).join('')}</tr>`).join('')}
        ${Object.keys(D.grups).map(c => `<tr class="grp"><td>${esc(label(c))}</td>${COLS.map(col => cell(c, col)).join('')}</tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

    <div class="flow">
      <div class="step"><b>👩‍🔧 Treballem</b>Les empreses produeixen i paguen sous.</div><div class="arr">→</div>
      <div class="step"><b>🛍️ Gastem</b>Amb el sou comprem, i les empreses venen.</div><div class="arr">→</div>
      <div class="step"><b>🏛️ Paguem impostos</b>L'estat en treu sanitat, escoles i pensions.</div><div class="arr">→</div>
      <div class="step"><b>🏦 Estalviem i demanem prestat</b>Els bancs mouen els diners de qui en té a qui en necessita.</div>
    </div>
    <p class="sub" style="margin-top:10px">Tot això sumat és el <b>PIB</b>. Si la gent gasta més del que les empreses poden produir, els preus pugen (<b>inflació</b>).
    Si gasta menys, les empreses venen menys i acomiaden gent (<b>atur</b>). El <b>banc central</b> intenta mantenir l'equilibri amb els tipus d'interès,
    i l'<b>estat</b> amb els impostos i la despesa: si gasta més del que ingressa, té <b>dèficit</b> i s'endeuta.</p>
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Els quatre termòmetres</h3>
      <p><b>🏭 Creixement</b> — si l'economia es fa gran. Sa: 1,5-3 % als països rics.</p>
      <p><b>🛒 Inflació</b> — si els preus pugen. Objectiu: 2 %.</p>
      <p><b>👷 Atur</b> — si hi ha feina per a tothom. Sa: per sota del 5 %.</p>
      <p><b>🏦 Deute</b> — si l'estat pot pagar el que deu. Les normes europees demanen menys del 60 %.</p>
    </div>
    <div class="card">
      <h3>Per què tot està connectat?</h3>
      <p class="sub">Un exemple real, el 2022: la guerra encareix el gas → puja l'electricitat i el transport → puja la inflació →
      el BCE apuja els tipus → pugen les hipoteques → les famílies gasten menys → l'economia creix menys → la inflació baixa.</p>
      <p class="sub">Mentrestant, els estats paguen més interessos pel seu deute, i els sous van per darrere dels preus fins que es negocien nous convenis.</p>
    </div>
  </div>
  <div class="card">
    <h3>Glossari</h3>
    ${G.map(([t, d]) => `<details class="glos"><summary>${esc(t)}</summary><p>${esc(d)}</p></details>`).join('')}
  </div>`;
}

/* ── Init ───────────────────────────────────────────────────────────────────── */
function fontsText() {
  const f = D.fonts || {};
  const names = [...new Set(Object.values(f).map(x => x.font))];
  return `Dades actualitzades el ${esc(D.generat)}. Fonts: ${names.map(esc).join(' · ')}.`;
}
async function init() {
  $('#ver').textContent = `${APP_VERSION} (${BUILD_DATE})`;
  try {
    const r = await fetch('dades.json', { cache: 'no-cache', signal: AbortSignal.timeout(15000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  } catch (e) {
    // sense xarxa ni cache del service worker: intentem la còpia de localStorage
    D = lsGet(LS_DATA, null);
    if (!D) { $('#loading').textContent = 'No s\'han pogut carregar les dades. Comprova la connexió i torna-ho a provar.'; return; }
  }
  Y = +D.generat.slice(0, 4);
  sel = sel.filter(c => ent(c)); if (!sel.length) sel = [...DEFAULT_SEL];
  fixColors(sel, colorOf);
  $('#loading').remove();
  $('#fonts').innerHTML = fontsText();
  go(location.hash.slice(1) || 'inici');
  setTimeout(() => lsSet(LS_DATA, D), 1000);
}
init();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
