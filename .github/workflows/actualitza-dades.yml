# Cada dia 3 de mes baixa les dades noves (FMI, OCDE, BIS) i, si han canviat, les puja al repositori.
# GitHub Pages publica automàticament el dades.json nou.
name: Actualitza les dades

on:
  schedule:
    - cron: '17 6 3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixa les dades
        run: node scripts/actualitza.js
      - name: Desa-les si han canviat
        run: |
          if git diff --quiet -- dades.json; then
            echo "Cap canvi a les dades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dades.json
          git commit -m "Dades actualitzades ($(date -u +%Y-%m-%d))"
          git push
